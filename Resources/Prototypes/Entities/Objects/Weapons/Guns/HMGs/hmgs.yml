- type: entity
  name: BaseWeaponHeavyMachineGun
  parent: BaseItem
  id: BaseWeaponHeavyMachineGun
  description: Spray and pray.
  abstract: true
  components:
  - type: Sprite
  - type: Item
    size: Ginormous
  - type: MultiHandedItem
  - type: ClothingSpeedModifier
    walkModifier: 0.8
    sprintModifier: 0.8
  - type: HeldSpeedModifier
  - type: Gun
    fireRate: 20
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/lmg.ogg
    soundEmpty:
      path: /Audio/Weapons/Guns/Empty/lmg_empty.ogg
  - type: StaticPrice
    price: 500
  # No chamber because HMG may want its own

- type: entity
  name: minigun
  id: WeaponMinigun
  parent: [BaseCorvaxContraband434DepartmentsSecurity, BaseWeaponHeavyMachineGun, BaseMajorContraband] # Corvax-Contraband
  # Dystopia: миниган заменён версией из Backmen (github.com/Rxup/space-station-14) — спрайт, звук, калибр 7,62×51 мм;
  # патроны идут из ранца с лентой на спине (Powerpack762x51), своего магазина нет.
  description: A six-barreled rotary machine gun in 7.62x51mm, the ultimate in man-portable firepower. Fed by a belt from an ammo pack worn on the back.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/HMGs/minigun.rsi
    layers:
    - state: icon
  - type: Item
    sprite: Objects/Weapons/Guns/HMGs/minigun_inhands.rsi # Dystopia: руки — отдельный .rsi (иконка 64×32)
    shape:
    - 0,0,2,0
    - 0,1,6,2
    - 1,3,4,4
  - type: Gun # Dystopia: числа и звук Backmen
    minAngle: 1
    maxAngle: 30
    angleDecay: 10
    angleIncrease: 1.5
    cameraRecoilScalar: 0.5
    fireRate: 15
    soundGunshot:
      path: /Audio/_Dystopia/Weapons/Guns/LMGs/minigunSG.ogg
  - type: ClothingSlotAmmoProvider # Dystopia: лента из ранца на спине
  - type: SlotBasedConnectedContainer
    targetSlot: BACK
    containerWhitelist:
      tags:
      - Powerpack762x51
  - type: UseDelay # Dystopia
    delay: 2.3
  - type: AmmoCounter
