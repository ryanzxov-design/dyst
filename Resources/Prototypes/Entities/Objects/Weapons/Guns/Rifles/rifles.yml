- type: entity
  name: BaseWeaponRifle
  parent: [BaseItem, BaseGunWieldable]
  id: BaseWeaponRifle
  description: A rooty tooty point and shooty.
  abstract: true
  components:
  - type: Sprite
  - type: Item
    size: Huge
    shape:
    - 0,0,3,2
  - type: Clothing
    sprite: Objects/Weapons/Guns/Rifles/ak.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: AmmoCounter
  - type: Gun
    fireRate: 5
    selectedMode: FullAuto
    availableModes:
      - FullAuto
      - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/batrifle.ogg
  - type: ChamberMagazineAmmoProvider
    soundRack:
      path: /Audio/Weapons/Guns/Cock/sf_rifle_cock.ogg
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazineLightRifle
        insertSound: /Audio/Weapons/Guns/MagIn/batrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/batrifle_magout.ogg
        priority: 2
        whitelist:
          tags:
            - MagazineLightRifle
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        priority: 1
        whitelist:
          tags:
            - CartridgeLightRifle
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: StaticPrice
    price: 500

- type: entity
  name: AKMS
  parent: [BaseCorvaxContraband434DepartmentsSecurity, BaseWeaponRifle, BaseSecurityContraband] # Corvax-Contraband
  id: WeaponRifleAk
  # Dystopia: АКМС заменён версией из Backmen (github.com/Rxup/space-station-14) — спрайт, звуки, калибр 7,62×39 мм.
  description: The folding-stock Kalashnikov in 7.62x39mm. Favored by criminals, militias and terrorists for its famed reliability and easy-to-manufacture design. 30-round magazines.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Rifles/ak.rsi
    layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
      - state: mag-0
        map: ["enum.GunVisualLayers.Mag"]
  - type: Item # Dystopia: руки и спина — отдельный .rsi (иконка 64×32)
    sprite: Objects/Weapons/Guns/Rifles/ak_inhands.rsi
  - type: Clothing # Dystopia
    sprite: Objects/Weapons/Guns/Rifles/ak_inhands.rsi
  - type: WieldedCameraRecoil # Dystopia
    cameraRecoilScalar: -4
  - type: GunWieldBonus # Dystopia: числа Backmen
    minAngle: -23
    maxAngle: 0
    angleIncrease: -3
  - type: Gun # Dystopia: числа и звук Backmen
    angleDecay: 30
    angleIncrease: 5
    cameraRecoilScalar: 5
    minAngle: 24
    maxAngle: 35
    fireRate: 5
    soundGunshot:
      path: /Audio/_Dystopia/Weapons/Guns/Rifles/ak47.ogg
  - type: ChamberMagazineAmmoProvider
    soundRack:
      path: /Audio/Weapons/Guns/Cock/ltrifle_cock.ogg
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: Magazine762x39AK # Dystopia: 7,62×39 мм
        insertSound: /Audio/_Dystopia/Weapons/Guns/Rifles/ak47_reload.ogg
        ejectSound: /Audio/_Dystopia/Weapons/Guns/Rifles/ak47_unload.ogg
        priority: 2
        whitelist:
          tags:
            - Magazine762x39AK # Dystopia
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        startingItem: Cartridge762x39 # Dystopia
        priority: 1
        whitelist:
          tags:
            - Cartridge762x39 # Dystopia
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance
- type: entity
  name: Lecter
  parent: [BaseCorvaxContraband434DepartmentsSecurity, BaseWeaponRifle, BaseSecurityContraband] # Corvax-Contraband
  id: WeaponRifleLecter
  description: "Popular gas-operated combat rifle used heavily by Nanotrasen and SolGov. Operating in semi or fully automatic, its accuracy, stopping power, and reliability make it excel in all manner of environments.\nFeeds from .20 rifle magazines."
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Rifles/lecter.rsi
    layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
      - state: mag-0
        map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    sprite: Objects/Weapons/Guns/Rifles/lecter.rsi
  - type: GunWieldBonus
    minAngle: -20
    maxAngle: -18
  - type: Gun
    angleIncrease: 1
    angleDecay: 9.5
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/ltrifle.ogg
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazineRifle
        insertSound: /Audio/Weapons/Guns/MagIn/ltrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/ltrifle_magout.ogg
        priority: 2
        whitelist:
          tags:
            - MagazineRifle
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        priority: 1
        whitelist:
          tags:
            - CartridgeRifle
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: MagazineVisuals
    magState: mag
    steps: 5
    zeroVisible: true
  - type: Appearance

- type: entity
  parent: WeaponRifleLecter
  id: WeaponRifleLecterXL8
  name: XL8
  description: |-
    The Experimental Lecter 8
    An unreasonably expensive military grade assault rifle with integrated optic.
    Uses .20 rifle ammo.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Rifles/XL8.rsi
  - type: Clothing
    sprite: Objects/Weapons/Guns/Rifles/XL8.rsi
  - type: CursorOffsetRequiresWield
  - type: EyeCursorOffset
    maxOffset: 2
    pvsIncrease: 0.2
