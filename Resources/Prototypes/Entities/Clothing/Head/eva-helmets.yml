#Syndicate EVA Helmet
- type: entity
  parent: [ ClothingHeadEVAHelmetBase ] # Corvax-Contraband deleted - BaseSyndicateContraband
  id: ClothingHeadHelmetSyndicate
  name: syndicate EVA helmet
  description: A simple, stylish EVA helmet. Designed for maximum humble space-badassery.
  components:
  - type: Sprite
    sprite: Clothing/Head/Helmets/eva_syndicate.rsi
  - type: Clothing
    sprite: Clothing/Head/Helmets/eva_syndicate.rsi
  - type: StaticPrice
    price: 500 # Suit is 1000
  # Dystopia: оболочки Внешнего Патруля — параметры под Город (классы брони, скорость, зараза)
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.8
        Slash: 0.8
        Piercing: 0.8
        Heat: 0.3
        Radiation: 0.1
        Caustic: 0.2
  # Dystopia: оболочки Внешнего Патруля — параметры под Город (классы брони, скорость, зараза)
  - type: ArmorRating
    armorClass: Br3
  # Dystopia: оболочки Внешнего Патруля — параметры под Город (классы брони, скорость, зараза)
  - type: DiseaseProtection
    incoming:
      chanceMultipliers:
        Aerial: 0.1
        Contact: 0.1
        Blood: 0.1
    outgoing:
      chanceMultipliers:
        Aerial: 0.1
        Contact: 0.1

