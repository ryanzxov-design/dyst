# Правило раунда «Культ Плоти». Пока — только выбор Проповедников.
# Условия победы (Колыбель / Омега-Стабилизатор) появятся на этапе 6.

- type: entity
  id: DystopiaFleshCultRule
  categories: [ HideSpawnMenu ]
  components:
  - type: GameRule
    minPlayers: 1
  - type: DystopiaFleshCultRule
  - type: AntagSelection
    agentName: dystopia-flesh-cult-round-end-agent-name
    lateJoinAdditional: true
    antags:
    - !type:LinearAntagCount
      proto: DystopiaFleshPreacher
      playerRatio: 15
      range:
        min: 1
        max: 2

- type: gamePreset
  id: DystopiaFleshCult
  alias:
  - fleshcult
  name: dystopia-flesh-cult-title
  description: dystopia-flesh-cult-description
  showInVote: false
  rules:
  - DystopiaFleshCultRule
  - BasicRoundstartVariation
