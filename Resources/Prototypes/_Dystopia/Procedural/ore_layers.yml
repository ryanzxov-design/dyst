# Dystopia: жилы в мире. Слои меток биома заменяют обычную породу жилой (по четырём видам породы). Ими
# пользуются экспедиции (гарантированная добыча ниже) и планета вокруг станции (StationBiome.markerLayers
# на карте). Частота — maxCount групп на участок 128×128 клеток. Генератор gen_ore_layers.py.

- type: biomeMarkerLayer
  id: DystopiaOreLimestone
  entityMask:
    WallRock: DystopiaWallRockLimestone
    WallRockSand: DystopiaWallRockSandLimestone
    WallRockSnow: DystopiaWallRockSnowLimestone
    WallRockChromite: DystopiaWallRockChromiteLimestone
  maxCount: 25   # common
  minGroupSize: 8
  maxGroupSize: 12
  radius: 4

