# Раны по типам урона. Прототип раны — "Wound" + тип урона (WoundBlunt, WoundHeat...).
# Шрамы, травмы (переломы, органы, нервы), кровотечение и боль от ран — в следующих фазах.
# Самостоятельные сущности, без parent.

- type: entity
  id: WoundBlunt
  name: рана (Blunt)
  categories: [ HideSpawnMenu ]
  components:
  - type: Wound
    damageType: Blunt
    woundType: External
    woundVisibility: Always
    mangleSeverity: Severe
  - type: TraumaInflicter
    severityThreshold: 7 # Dystopia: удар битой/дубинкой должен успевать ломать кость
    allowArmourDeduction:
    - Dismemberment
    - OrganDamage
    - BoneDamage
    - VeinsDamage
    - NerveDamage
    traumasChances:
      Dismemberment: -0.4
      OrganDamage: 0.17
      BoneDamage: 0.8
      VeinsDamage: 0
      NerveDamage: 0
    mangledMultipliers:
      BoneDamage: 1
  - type: BleedInflicter
    severityThreshold: 20
    bleedingCoefficient: 0.06 # Dystopia: тяжёлый ушиб/перелом заметно кровит (было 0.04 — кровь почти не убывала)
    clotTime: 60
    clotSeverityLimit: 40

