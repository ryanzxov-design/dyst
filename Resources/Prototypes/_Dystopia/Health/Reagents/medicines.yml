# Dystopia: лекарства новой медицины. Обезболивание, ускорение костей/органов/нервов, вред печени и сердцу
# считает C# (PainComponent, OrganFunctionComponent, BoneSplint) по количеству вещества в крови — здесь только
# простые эффекты: сонливость, замедление, передозировка. Зависимость — AddictionComponent (опиоиды).

- type: reagent
  id: Paracetamol
  name: reagent-name-paracetamol
  desc: reagent-desc-paracetamol
  group: Medicine
  flavor: bitter
  physicalDesc: reagent-physical-desc-powdery
  color: "#f5f5f0"
  metabolisms:
    Bloodstream:
      metabolismRate: 0.05
      effects:
      - !type:HealthChange
        conditions:
        - !type:ReagentCondition
          reagent: Paracetamol
          min: 40
        damage:
          types:
            Poison: 0.5

- type: reagent
  id: Tramadol
  name: reagent-name-tramadol
  desc: reagent-desc-tramadol
  group: Medicine
  flavor: medicine
  physicalDesc: reagent-physical-desc-translucent
  color: "#e8f0e8"
  metabolisms:
    Bloodstream:
      metabolismRate: 0.1
      effects:
      - !type:ModifyStatusEffect
        conditions:
        - !type:ReagentCondition
          reagent: Tramadol
          min: 15
        effectProto: StatusEffectDrowsiness
        time: 4
        type: Update
      - !type:HealthChange
        conditions:
        - !type:ReagentCondition
          reagent: Tramadol
          min: 30
        damage:
          types:
            Asphyxiation: 1

