# Промедол: армейский шприц-тюбик для полевой помощи (одноразовый)
- type: entity
  parent: ChemicalMedipen
  id: PromedolMedipen
  name: шприц-тюбик промедола
  description: Одноразовый армейский шприц-тюбик с сильным обезболивающим. Снимает боль за секунды. Вызывает привыкание.
  components:
  - type: Sprite
    sprite: _Dystopia/Health/Objects/medical_tools.rsi
    layers:
    - state: promedol
      map: ["enum.SolutionContainerLayers.Fill"]
  - type: SolutionContainerVisuals
    maxFillLevels: 1
    changeColor: false
    emptySpriteName: promedol_empty
  - type: Item
    sprite: _Dystopia/Health/Objects/medical_tools.rsi
    heldPrefix: promedol
    inhandVisuals: {}
  - type: Solution
    solution:
      reagents:
      - ReagentId: Promedol
        Quantity: 10

# Гемостатическая губка: повязка, которая останавливает даже глубокие раны (марля — только неглубокие)
- type: entity
  parent: BaseHealingItem
  id: HealthHemostaticSponge
  name: гемостатическая губка
  description: Пропитанная кровоостанавливающим составом губка. Останавливает кровь даже из глубокой раны, где марля бессильна.
  components:
  - type: Sprite
    sprite: _Dystopia/Health/Objects/medical_tools.rsi
    state: hemostatic_sponge
  - type: Item
    sprite: _Dystopia/Health/Objects/medical_tools.rsi
    heldPrefix: hemostatic_sponge
  - type: Healing
    damageContainers:
    - Biological
    damage:
      types:
        Slash: -2
        Piercing: -2
    bloodlossModifier: -15
    delay: 3
  - type: Hemostatic
    maxSeverity: 0

# Лидокаин: местная анестезия — укол в часть тела, куда целится врач
- type: entity
  parent: BaseItem
  id: HealthLidocaineSyringe
  name: шприц лидокаина
  description: Одноразовый шприц местного обезболивания. Колют в часть тела — она перестаёт болеть на несколько минут, и её можно оперировать без наркоза.
  components:
  - type: Sprite
    sprite: _Dystopia/Health/Objects/medical_tools.rsi
    state: lidocaine
  - type: Item
    size: Tiny
    sprite: _Dystopia/Health/Objects/medical_tools.rsi
    heldPrefix: lidocaine
  - type: LocalAnesthesiaInjector
    duration: 240
    injectTime: 2
