# ===== Реакции =====

- type: reaction
  id: Paracetamol
  reactants:
    Phenol:
      amount: 1
    Nitrogen:
      amount: 1
    Oxygen:
      amount: 1
  products:
    Paracetamol: 3

- type: reaction
  id: Tramadol
  reactants:
    Phenol:
      amount: 1
    Ammonia:
      amount: 1
    Hydrogen:
      amount: 1
  products:
    Tramadol: 2

- type: reaction
  id: Morphine
  minTemp: 370
  reactants:
    Phenol:
      amount: 1
    Carbon:
      amount: 1
    Potassium:
      amount: 1
  products:
    Morphine: 2

- type: reaction
  id: Promedol
  reactants:
    Morphine:
      amount: 1
    Ethanol:
      amount: 1
    Hydrogen:
      amount: 1
  products:
    Promedol: 2

- type: reaction
  id: Naloxone
  reactants:
    Morphine:
      amount: 1
    Oxygen:
      amount: 1
    Chlorine:
      amount: 1
  products:
    Naloxone: 2

- type: reaction
  id: Calcitonin
  reactants:
    Lithium:
      amount: 1
    Nitrogen:
      amount: 1
    Oxygen:
      amount: 1
  products:
    Calcitonin: 2

- type: reaction
  id: Ademetionine
  reactants:
    Sulfur:
      amount: 1
    Nitrogen:
      amount: 1
    Carbon:
      amount: 1
  products:
    Ademetionine: 2

- type: reaction
  id: Salbutamol
  reactants:
    Ethanol:
      amount: 1
    Ammonia:
      amount: 1
    Oxygen:
      amount: 1
  products:
    Salbutamol: 2

- type: reaction
  id: Digoxin
  reactants:
    Copper:
      amount: 1
    Carbon:
      amount: 1
    Oxygen:
      amount: 1
  products:
    Digoxin: 2

- type: reaction
  id: Piracetam
  reactants:
    Ammonia:
      amount: 1
    Carbon:
      amount: 1
    Oxygen:
      amount: 1
  products:
    Piracetam: 2

- type: reaction
  id: Ipidacrine
  reactants:
    Ammonia:
      amount: 1
    Phenol:
      amount: 1
    Silicon:
      amount: 1
  products:
    Ipidacrine: 2

