# Пах — отдельная часть тела (система здоровья, Ф1). Самостоятельные сущности, без parent.
# Видимого слоя нет: на спрайте пах — часть торса. Ноги, желудок, печень, почки и аппендикс крепятся к паху.

- type: entity
  id: OrganGroin
  name: пах
  description: 'Нижняя часть туловища: к ней крепятся ноги, в ней желудок, печень и почки.'
  components:
  - type: ChildOrgan
  - type: DetachableOrgan
    detachedBody: DetachedBody
  - type: ParentOrgan
  - type: Item
    size: Small
  - type: Animateable
  - type: Clickable
  - type: InteractionOutline
  - type: MovedByPressure
  - type: EmitSoundOnCollide
    sound:
      collection: WeakHit
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Effects/drop.ogg
      params:
        volume: 2
  - type: DamageOnHighSpeedImpact
    damage:
      types:
        Blunt: 5
    soundHit:
      collection: MetalThud
  - type: CollisionWake
  - type: GravityAffected
  - type: Physics
    bodyType: Dynamic
    fixedRotation: false
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.25,-0.25,0.25,0.25"
        density: 20
        mask:
        - ItemMask
        restitution: 0.3
        friction: 0.2
  - type: Sprite
    sprite: _Dystopia/Mobs/Species/groin.rsi
    state: groin
  - type: Pullable
  - type: DamageExaminable
  - type: Rotatable
    increment: 30
  - type: Organ
    category: Groin
  - type: BodyPart
    partType: Groin
    partComposition: Organic

