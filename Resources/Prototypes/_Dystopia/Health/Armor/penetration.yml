# Dystopia: пробитие брони. Формула — из Combat Extended, числа — свои (классы брони — armor_classes.yml).
# Код — Content.Shared/_Dystopia/Health/Armor/Penetration/
#
# Острое пробитие и острая броня — в мм, тупое — в МПа (тупое пробитие пули = дульная энергия реального аналога / 50 Дж).
# АКМ .30 FMJ { sharp: 12, blunt: 41 } против Бр2 { sharp: 5, blunt: 8 }: 12 > 5 — пробил, урон × (12 − 5) / 12 ≈ 58%,
#   а потерянная часть даёт небольшой тупой удар.
# Тот же патрон против Бр4 { sharp: 13, blunt: 20 }: 12 < 13 — рикошет, пуля становится тупым ударом
#   (41 × 10000)^(1/3) / 10 × 1.5 ≈ 11.2, который давит на 20 МПа плиты: проходит (41 − 20) / 41 ≈ 51% — около 5.7.

- type: armorPenetrationSettings
  id: Default
  sharpTypes: [ Piercing, Slash ]
  bluntTypes: [ Blunt ]
  # Жар (огонь, лазеры) — процентом, как огонь в CE: защита слоёв складывается. Число — пробитие (доля).
  ambientTypes:
    Heat: 0
  deflectType: Blunt
  deflectScale: 10000
  deflectPower: 0.3333333
  deflectDivisor: 10
  # Перевод в наш урон: сколько тупого урона даёт рикошет (баланс SS14)
  deflectDamageMultiplier: 1.5
  # Пуля, застрявшая в броне, всё равно оставляет ушиб: до тела доходит не меньше этой доли тупого удара,
  # сколько бы тупой брони ни было. Картечь в упор по жилету — около 10 тупого урона.
  deflectMinPass: 0.25
  # Взрыв, пожар, падение (урон по всему телу) встречает броня груди
  areaPart: Chest
  # Слои от внешнего к внутреннему
  layerOrder:
  - outerClothing
  - neck
  - back
  - head
  - mask
  - eyes
  - ears
  - gloves
  - shoes
  - belt
  - jumpsuit
  # Броня без класса защиты: рейтинг из её коэффициентов. Колющий 0.7 → (1 − 0.7) × 16 ≈ 5 мм (как Бр2),
  # 0.4 → 9.6 мм (Бр3), 0.2 → 12.8 мм (почти Бр4).
  sharpRating:
    damageType: Piercing
    perProtection: 16
  bluntRating:
    damageType: Blunt
    perProtection: 27
  # Пробитие без ArmorPenetration — из урона.
  # Ближний бой (и брошенные предметы): нож с 12 режущего — 3.6 мм (пробивает Бр1, Бр2 держит), тупое 6 МПа;
  # ящик с 12 тупого — 18 МПа.
  melee:
    sharpPerSharpDamage: 0.3
    bluntPerBluntDamage: 1.5
    bluntPerSharpDamage: 0.5
  # Снаряды без своего пробития
  projectile:
    sharpPerSharpDamage: 0.3
    bluntPerBluntDamage: 1.5
    bluntPerSharpDamage: 1.5
  # Источник неизвестен: осколки взрыва, хитскан и прочее
  fallback:
    sharpPerSharpDamage: 0.2
    bluntPerBluntDamage: 1
    bluntPerSharpDamage: 0.5
