# Инструменты лечебной хирургии.

- type: entity
  parent: [BaseCorvaxContraband432DepartmentsMedical, BaseToolSurgery]
  id: HealthBoneSetter
  name: костоправ
  description: Хирургический инструмент, чтобы вправлять кости.
  components:
  - type: BoneSetter
  - type: Sprite
    sprite: _Dystopia/Health/Objects/medical_tools.rsi
    state: bone_setter
  - type: Item
    sprite: _Dystopia/Health/Objects/medical_tools.rsi
    heldPrefix: bone_setter
    storedRotation: 90

- type: entity
  parent: BaseItem
  id: HealthBoneGel
  name: костный гель
  description: Тюбик геля, который скрепляет вправленную кость за считанные минуты.
  components:
  - type: Sprite
    sprite: _Dystopia/Health/Objects/medical_tools.rsi
    state: bone_gel
  - type: Item
    size: Small
    sprite: _Dystopia/Health/Objects/medical_tools.rsi
    heldPrefix: bone_gel
  - type: SurgeryTool
  - type: BoneGel
