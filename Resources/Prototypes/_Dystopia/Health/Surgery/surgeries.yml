# SPDX-License-Identifier: AGPL-3.0-or-later
# Операции. Перенос Shitmed из Goob-Station (space-syndicate/Goob-Station, AGPL-3.0), адаптация Dystopia:
# у нас органы и конечности — категории (Heart, ArmLeft...), а не слоты.
# requirement — операция, которую нужно сделать сначала (обычно «Вскрыть»); её шаги идут первыми.

- type: entity
  abstract: true
  id: SurgeryBase
  components:
  - type: Surgery

- type: entity
  abstract: true
  parent: SurgeryBase
  id: BasePartSurgery
  components:
  - type: SurgeryPartPresentCondition

# ===================== Вскрытие и закрытие =====================

- type: entity
  parent: BasePartSurgery
  id: SurgeryOpenIncision
  name: Вскрыть
  components:
  - type: Surgery
    priority: -1
    steps:
    - SurgeryStepOpenIncisionScalpel
    - SurgeryStepRetractSkin

- type: entity
  parent: BasePartSurgery
  id: SurgeryCloseIncision
  name: Закрыть разрез
  components:
  - type: Surgery
    priority: 10
    steps:
    - SurgeryStepCloseBones
    - SurgeryStepSealBones
    - SurgeryStepCloseIncision
  - type: SurgeryPartComponentCondition
    components:
    - type: IncisionOpen

- type: entity
  parent: BasePartSurgery
  id: SurgeryOpenRibcage
  name: Вскрыть грудную клетку
  components:
  - type: Surgery
    requirement: SurgeryOpenIncision
    steps:
    - SurgeryStepSawBones
    - SurgeryStepPriseOpenBones
  - type: SurgeryPartCondition
    parts: [ Chest ]

- type: entity
  parent: BasePartSurgery
  id: SurgeryOpenSkull
  name: Вскрыть череп
  components:
  - type: Surgery
    requirement: SurgeryOpenIncision
    steps:
    - SurgeryStepSawBones
    - SurgeryStepPriseOpenBones
  - type: SurgeryPartCondition
    parts: [ Head ]

# ===================== Кровотечение и раны =====================

- type: entity
  parent: BasePartSurgery
  id: SurgeryStopBleeding
  name: Остановить кровотечение
  components:
  - type: Surgery
    requirement: SurgeryOpenIncision
    steps:
    - SurgeryStepClampBleeders
    - SurgeryStepCloseBloodOutputs
  - type: SurgeryBleedsPresentCondition

- type: entity
  parent: BasePartSurgery
  id: SurgeryTendWoundsBrute
  name: Обработать раны
  components:
  - type: Surgery
    steps:
    - SurgeryStepCarefulIncisionScalpel
    - SurgeryStepRepairBruteTissue
    - SurgeryStepSealTendWound
  - type: SurgeryWoundedCondition
    damageGroup: Brute

- type: entity
  parent: BasePartSurgery
  id: SurgeryTendWoundsBurn
  name: Обработать ожоги
  components:
  - type: Surgery
    steps:
    - SurgeryStepCarefulIncisionScalpel
    - SurgeryStepRepairBurnTissue
    - SurgeryStepSealTendWound
  - type: SurgeryWoundedCondition
    damageGroup: Burn

# ===================== Травмы =====================

- type: entity
  parent: BasePartSurgery
  id: SurgeryMendBones
  name: Восстановить кость
  components:
  - type: Surgery
    requirement: SurgeryOpenIncision
    steps:
    - SurgeryStepClampInternalBleeders
    - SurgeryStepSetBones
    - SurgeryStepMendBones
  - type: SurgeryBleedsPresentCondition
    inverted: true
  - type: SurgeryBoneDamagedCondition

- type: entity
  parent: BasePartSurgery
  id: SurgeryRepairVeins
  name: Восстановить вены
  components:
  - type: Surgery
    requirement: SurgeryOpenIncision
    steps:
    - SurgeryStepClampInternalBleeders
    - SurgeryStepRepairVeins
  - type: SurgeryTraumaPresentCondition
    trauma: VeinsDamage

- type: entity
  parent: BasePartSurgery
  id: SurgeryRepairNerves
  name: Восстановить нервы
  components:
  - type: Surgery
    requirement: SurgeryOpenIncision
    steps:
    - SurgeryStepClampInternalBleeders
    - SurgeryStepRepairNerves
  - type: SurgeryBleedsPresentCondition
    inverted: true
  - type: SurgeryTraumaPresentCondition
    trauma: NerveDamage

- type: entity
  parent: BasePartSurgery
  id: SurgeryFixDismemberment
  name: Обработать культю
  components:
  - type: Surgery
    requirement: SurgeryOpenIncision
    steps:
    - SurgeryStepRemoveSeveredSkin
    - SurgeryStepSealDismembermentWound
  - type: SurgeryBleedsPresentCondition
    inverted: true
  - type: SurgeryTraumaPresentCondition
    trauma: Dismemberment

# ===================== Лечение органов =====================

- type: entity
  parent: BasePartSurgery
  id: SurgeryHealOrgansChest
  name: Восстановить органы
  components:
  - type: Surgery
    requirement: SurgeryOpenRibcage
    steps:
    - SurgeryStepClampInternalBleeders
    - SurgeryStepHealOrgans
  - type: SurgeryPartCondition
    parts: [ Chest ]
  - type: SurgeryBleedsPresentCondition
    inverted: true
  - type: SurgeryOrganDamagedCondition

- type: entity
  parent: BasePartSurgery
  id: SurgeryHealOrgansGroin
  name: Восстановить органы
  components:
  - type: Surgery
    requirement: SurgeryOpenIncision
    steps:
    - SurgeryStepClampInternalBleeders
    - SurgeryStepHealOrgans
  - type: SurgeryPartCondition
    parts: [ Groin ]
  - type: SurgeryBleedsPresentCondition
    inverted: true
  - type: SurgeryOrganDamagedCondition

- type: entity
  parent: BasePartSurgery
  id: SurgeryRepairBrain
  name: Восстановить мозг и органы головы
  components:
  - type: Surgery
    requirement: SurgeryOpenSkull
    steps:
    - SurgeryStepClampInternalBleeders
    - SurgeryStepRepairBrain
  - type: SurgeryPartCondition
    parts: [ Head ]
  - type: SurgeryBleedsPresentCondition
    inverted: true
  - type: SurgeryOrganDamagedCondition

# ===================== Конечности =====================

- type: entity
  parent: BasePartSurgery
  id: SurgeryRemovePart
  name: Ампутировать
  components:
  - type: Surgery
    priority: 5
    requirement: SurgeryOpenIncision
    steps:
    - SurgeryStepSawFeature
    - SurgeryStepClampInternalBleeders
    - SurgeryStepRemoveFeature
  - type: SurgeryHasBodyCondition
  - type: SurgeryPartCondition
    parts: [ Arm, Hand, Leg, Foot ]

- type: entity
  abstract: true
  parent: SurgeryBase
  id: BaseSurgeryAttachLimb
  components:
  - type: Surgery
    requirement: SurgeryOpenIncision
    steps:
    - SurgeryStepInsertFeature
    - SurgeryStepSealWounds
  - type: SurgeryPartPresentCondition

- type: entity
  parent: BaseSurgeryAttachLimb
  id: SurgeryAttachArmLeft
  name: Пришить левую руку
  components:
  - type: SurgeryPartRemovedCondition
    connection: ArmLeft

- type: entity
  parent: BaseSurgeryAttachLimb
  id: SurgeryAttachArmRight
  name: Пришить правую руку
  components:
  - type: SurgeryPartRemovedCondition
    connection: ArmRight

- type: entity
  parent: BaseSurgeryAttachLimb
  id: SurgeryAttachHandLeft
  name: Пришить левую кисть
  components:
  - type: SurgeryPartRemovedCondition
    connection: HandLeft

- type: entity
  parent: BaseSurgeryAttachLimb
  id: SurgeryAttachHandRight
  name: Пришить правую кисть
  components:
  - type: SurgeryPartRemovedCondition
    connection: HandRight

- type: entity
  parent: BaseSurgeryAttachLimb
  id: SurgeryAttachLegLeft
  name: Пришить левую ногу
  components:
  - type: SurgeryPartRemovedCondition
    connection: LegLeft

- type: entity
  parent: BaseSurgeryAttachLimb
  id: SurgeryAttachLegRight
  name: Пришить правую ногу
  components:
  - type: SurgeryPartRemovedCondition
    connection: LegRight

- type: entity
  parent: BaseSurgeryAttachLimb
  id: SurgeryAttachFootLeft
  name: Пришить левую стопу
  components:
  - type: SurgeryPartRemovedCondition
    connection: FootLeft

- type: entity
  parent: BaseSurgeryAttachLimb
  id: SurgeryAttachFootRight
  name: Пришить правую стопу
  components:
  - type: SurgeryPartRemovedCondition
    connection: FootRight

# ===================== Извлечение и пересадка органов =====================
# Голова — через вскрытый череп, грудь — через вскрытую грудную клетку, живот — через разрез.

