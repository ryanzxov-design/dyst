# Операции. requirement — операция, которая должна быть закончена раньше,
# steps — шаги по порядку, SurgeryPartCondition — для каких частей тела.
# Извлечение и вставка органов появляются в окне сами, когда у торса или головы раскрыты кости.

- type: entity
  id: SurgeryOpenIncision
  name: Вскрыть
  categories: [ HideSpawnMenu ]
  components:
  - type: Surgery
    priority: 0
    steps:
    - SurgeryStepIncision
    - SurgeryStepClampBleeders
    - SurgeryStepRetractSkin
  - type: SurgeryPartCondition
    parts: [ Torso, Groin, Head, ArmLeft, ArmRight, HandLeft, HandRight, LegLeft, LegRight, FootLeft, FootRight ]

- type: entity
  id: SurgeryOpenRibcage
  name: Вскрыть грудную клетку
  categories: [ HideSpawnMenu ]
  components:
  - type: Surgery
    priority: 1
    requirement: SurgeryOpenIncision
    steps:
    - SurgeryStepSawBones
    - SurgeryStepOpenBones
  - type: SurgeryPartCondition
    parts: [ Torso ]

- type: entity
  id: SurgeryOpenSkull
  name: Вскрыть череп
  categories: [ HideSpawnMenu ]
  components:
  - type: Surgery
    priority: 1
    requirement: SurgeryOpenIncision
    steps:
    - SurgeryStepSawBones
    - SurgeryStepOpenBones
  - type: SurgeryPartCondition
    parts: [ Head ]

- type: entity
  id: SurgeryCloseIncision
  name: Закрыть
  categories: [ HideSpawnMenu ]
  components:
  - type: Surgery
    priority: 10
    requirement: SurgeryOpenIncision
    steps:
    - SurgeryStepCloseBones
    - SurgeryStepCauterize
  - type: SurgeryPartCondition
    parts: [ Torso, Groin, Head, ArmLeft, ArmRight, HandLeft, HandRight, LegLeft, LegRight, FootLeft, FootRight ]

# Ампутация: после отделения у родительской части тела остаётся открытая культя — её закрывают «Закрыть».
# Пришить конечность (отрезанную или протез) можно к вскрытой части тела — кнопка «Пришить» в окне.
- type: entity
  id: SurgeryAmputate
  name: Ампутировать
  categories: [ HideSpawnMenu ]
  components:
  - type: Surgery
    priority: 5
    requirement: SurgeryOpenIncision
    steps:
    - SurgeryStepSawBones
    - SurgeryStepSeverLimb
  - type: SurgeryPartCondition
    parts: [ ArmLeft, ArmRight, HandLeft, HandRight, LegLeft, LegRight, FootLeft, FootRight ]

# Пах (живот): костей нет — полость раскрывают ретрактором. Внутри желудок, печень, почки, аппендикс.
- type: entity
  id: SurgeryOpenAbdomen
  name: Вскрыть брюшную полость
  categories: [ HideSpawnMenu ]
  components:
  - type: Surgery
    priority: 1
    requirement: SurgeryOpenIncision
    steps:
    - SurgeryStepOpenAbdomen
  - type: SurgeryPartCondition
    parts: [ Groin ]

# ===================== Лечебная хирургия (Ф8) =====================
# SurgeryCondition — операция видна, только если на части есть что лечить (или она уже начата).

# Перелом: вправить костоправом и скрепить костным гелем. Кость сразу целая, шина снимается.
- type: entity
  id: SurgeryMendBone
  name: Срастить кость
  categories: [ HideSpawnMenu ]
  components:
  - type: Surgery
    priority: 2
    requirement: SurgeryOpenIncision
    steps:
    - SurgeryStepSetBone
    - SurgeryStepBoneGel
  - type: SurgeryPartCondition
    parts: [ Torso, Groin, Head, ArmLeft, ArmRight, HandLeft, HandRight, LegLeft, LegRight, FootLeft, FootRight ]
  - type: SurgeryCondition
    need: MendBone

# Раны: снимает тяжесть ран части (мимо блокировки переломами и органами), останавливает кровь. Можно повторять.
- type: entity
  id: SurgeryTendWounds
  name: Обработать раны
  categories: [ HideSpawnMenu ]
  components:
  - type: Surgery
    priority: 2
    requirement: SurgeryOpenIncision
    steps:
    - SurgeryStepTendWounds
  - type: SurgeryPartCondition
    parts: [ Torso, Groin, Head, ArmLeft, ArmRight, HandLeft, HandRight, LegLeft, LegRight, FootLeft, FootRight ]
  - type: SurgeryCondition
    need: TendWounds

# Повреждённые вены или кровотечение части.
- type: entity
  id: SurgeryRepairVessels
  name: Сшить сосуды
  categories: [ HideSpawnMenu ]
  components:
  - type: Surgery
    priority: 2
    requirement: SurgeryOpenIncision
    steps:
    - SurgeryStepClampVessels
    - SurgeryStepSutureVessels
  - type: SurgeryPartCondition
    parts: [ Torso, Groin, Head, ArmLeft, ArmRight, HandLeft, HandRight, LegLeft, LegRight, FootLeft, FootRight ]
  - type: SurgeryCondition
    need: RepairVessels

# Повреждённые нервы (часть болит сильнее).
- type: entity
  id: SurgeryRepairNerves
  name: Сшить нервы
  categories: [ HideSpawnMenu ]
  components:
  - type: Surgery
    priority: 3
    requirement: SurgeryOpenIncision
    steps:
    - SurgeryStepRepairNerves
  - type: SurgeryPartCondition
    parts: [ Torso, Groin, Head, ArmLeft, ArmRight, HandLeft, HandRight, LegLeft, LegRight, FootLeft, FootRight ]
  - type: SurgeryCondition
    need: RepairNerves

# Органы: восстанавливают повреждённые органы раскрытой полости (и разрушенный мозг). Разрушенный орган (кроме мозга) — пересадка.
- type: entity
  id: SurgeryRepairOrgansTorso
  name: Восстановить органы
  categories: [ HideSpawnMenu ]
  components:
  - type: Surgery
    priority: 3
    requirement: SurgeryOpenRibcage
    steps:
    - SurgeryStepRepairOrgans
  - type: SurgeryPartCondition
    parts: [ Torso ]
  - type: SurgeryCondition
    need: RepairOrgans

- type: entity
  id: SurgeryRepairOrgansHead
  name: Восстановить органы
  categories: [ HideSpawnMenu ]
  components:
  - type: Surgery
    priority: 3
    requirement: SurgeryOpenSkull
    steps:
    - SurgeryStepRepairOrgans
  - type: SurgeryPartCondition
    parts: [ Head ]
  - type: SurgeryCondition
    need: RepairOrgans

- type: entity
  id: SurgeryRepairOrgansGroin
  name: Восстановить органы
  categories: [ HideSpawnMenu ]
  components:
  - type: Surgery
    priority: 3
    requirement: SurgeryOpenAbdomen
    steps:
    - SurgeryStepRepairOrgans
  - type: SurgeryPartCondition
    parts: [ Groin ]
  - type: SurgeryCondition
    need: RepairOrgans
