# Шаги операций. Перенос Shitmed из Goob-Station (space-syndicate/Goob-Station, AGPL-3.0), адаптация Dystopia.
# Шаг выполнен, когда на части тела есть компоненты из add и нет компонентов из remove (и особые проверки).
# Боль шага (amount) держится painDuration секунд; во сне она умножается на sleepModifier.

- type: entityCategory
  id: Surgeries
  name: entity-category-name-surgeries
  hideSpawnMenu: true

- type: entityCategory
  id: SurgerySteps
  name: entity-category-name-surgery-steps
  hideSpawnMenu: true

- type: entity
  abstract: true
  id: SurgeryStepBase
  components:
  - type: SurgeryStep

# ===================== Доступ =====================

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepOpenIncisionScalpel
  name: Сделать надрез скальпелем
  components:
  - type: SurgeryStep
    tool:
    - type: Scalpel
    add:
    - type: IncisionOpen
    duration: 2
  - type: Sprite
    sprite: _Dystopia/Health/Surgery/steps.rsi
    state: scalpel
  - type: SurgeryStepPainInflicter
    amount: 34
    painDuration: 30
    sleepModifier: 0.12
  - type: SurgeryStepEmoteEffect

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepRetractSkin
  name: Развести края раны
  components:
  - type: SurgeryStep
    tool:
    - type: Retractor
    add:
    - type: SkinRetracted
    duration: 2
  - type: Sprite
    sprite: _Dystopia/Health/Surgery/steps.rsi
    state: retractor
  - type: SurgeryStepPainInflicter
    amount: 12
    painDuration: 30
    sleepModifier: 0.12

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepClampBleeders
  name: Пережать кровоточащие сосуды
  components:
  - type: SurgeryStep
    tool:
    - type: Hemostat
    add:
    - type: BleedersClamped
    duration: 4
  - type: Sprite
    sprite: _Dystopia/Health/Surgery/steps.rsi
    state: hemostat
  - type: SurgeryRepeatableStep
  - type: SurgeryBleedsTreatmentStep

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepCloseBloodOutputs
  name: Сшить повреждённые сосуды
  components:
  - type: SurgeryStep
    tool:
    - type: Stitches
    remove:
    - type: BleedersClamped
    duration: 5
  - type: Sprite
    sprite: _Dystopia/Health/Surgery/steps.rsi
    state: stitches
  - type: SurgeryStepPainInflicter
    amount: 34
    painDuration: 30
    sleepModifier: 0.12

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepClampInternalBleeders
  name: Пережать внутренние сосуды
  components:
  - type: SurgeryStep
    tool:
    - type: Hemostat
    add:
    - type: InternalBleedersClamped
    duration: 2
  - type: Sprite
    sprite: _Dystopia/Health/Surgery/steps.rsi
    state: hemostat

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepSawBones
  name: Распилить кость
  components:
  - type: SurgeryStep
    tool:
    - type: BoneSaw
    add:
    - type: BonesSawed
    duration: 4
  - type: Sprite
    sprite: _Dystopia/Health/Surgery/steps.rsi
    state: saw
  - type: SurgeryStepPainInflicter
    amount: 34
    painDuration: 40
    sleepModifier: 0
  - type: SurgeryStepEmoteEffect

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepPriseOpenBones
  name: Раскрыть кости
  components:
  - type: SurgeryStep
    tool:
    - type: Retractor
    add:
    - type: BonesOpen
    duration: 2
  - type: Sprite
    sprite: _Dystopia/Health/Surgery/steps.rsi
    state: retractor
  - type: SurgeryStepPainInflicter
    amount: 20
    painDuration: 30
    sleepModifier: 0.12

# ===================== Закрытие =====================

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepCloseBones
  name: Свести кости
  components:
  - type: SurgeryStep
    tool:
    - type: Retractor
    remove:
    - type: BonesOpen
    duration: 2
  - type: Sprite
    sprite: _Dystopia/Health/Surgery/steps.rsi
    state: retractor

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepSealBones
  name: Скрепить кости гелем
  components:
  - type: SurgeryStep
    tool:
    - type: BoneGel
    remove:
    - type: BonesSawed
    duration: 2
  - type: Sprite
    sprite: _Dystopia/Health/Surgery/steps.rsi
    state: bone-gel

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepCloseIncision
  name: Прижечь и закрыть разрез
  components:
  - type: SurgeryStep
    tool:
    - type: Cautery
    remove:
    # Снимает и всё, что могло остаться от других операций
    - type: SkinRetracted
    - type: BleedersClamped
    - type: IncisionOpen
    - type: BodyPartReattached
    - type: InternalBleedersClamped
    - type: BoneSet
    duration: 2
  - type: Sprite
    sprite: _Dystopia/Health/Surgery/steps.rsi
    state: cautery
  - type: SurgeryStepPainInflicter
    amount: 9
    painDuration: 20
    sleepModifier: 0.34

