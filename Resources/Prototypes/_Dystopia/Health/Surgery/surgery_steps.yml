# Шаги операций: инструмент, время, какие состояния
# появляются (add) и исчезают (remove) на части тела. Шаг выполнен, когда все add есть и ни одного remove нет.
# Прототипы-данные: не спавнятся. Самостоятельные, без parent.

- type: entity
  id: SurgeryStepIncision
  name: Сделать надрез
  categories: [ HideSpawnMenu ]
  components:
  - type: SurgeryStep
    tools: [ Scalpel ]
    duration: 3
    bleed: 2
    add:
    - type: SurgeryIncisionOpen

- type: entity
  id: SurgeryStepClampBleeders
  name: Пережать сосуды
  categories: [ HideSpawnMenu ]
  components:
  - type: SurgeryStep
    tools: [ Hemostat ]
    duration: 3
    bleed: -2
    add:
    - type: SurgeryBleedersClamped

- type: entity
  id: SurgeryStepRetractSkin
  name: Развести края раны
  categories: [ HideSpawnMenu ]
  components:
  - type: SurgeryStep
    tools: [ Retractor ]
    duration: 3
    add:
    - type: SurgerySkinRetracted

- type: entity
  id: SurgeryStepSawBones
  name: Распилить кости
  categories: [ HideSpawnMenu ]
  components:
  - type: SurgeryStep
    tools: [ Saw ]
    duration: 5
    add:
    - type: SurgeryBonesSawed

- type: entity
  id: SurgeryStepOpenBones
  name: Раскрыть кости
  categories: [ HideSpawnMenu ]
  components:
  - type: SurgeryStep
    tools: [ Retractor ]
    duration: 3
    add:
    - type: SurgeryBonesOpen

- type: entity
  id: SurgeryStepCloseBones
  name: Свести кости
  categories: [ HideSpawnMenu ]
  components:
  - type: SurgeryStep
    tools: [ Retractor ]
    duration: 4
    remove:
    - type: SurgeryBonesOpen
    - type: SurgeryBonesSawed

- type: entity
  id: SurgeryStepCauterize
  name: Прижечь и закрыть рану
  categories: [ HideSpawnMenu ]
  components:
  - type: SurgeryStep
    tools: [ Cautery ]
    duration: 4
    bleed: -10
    remove:
    - type: SurgeryIncisionOpen
    - type: SurgerySkinRetracted
    - type: SurgeryBleedersClamped
    - type: SurgeryBoneSet
    - type: SurgeryVesselsClamped

# Отделить конечность (ампутация): часть тела отваливается вместе со всем, что к ней прикреплено.
- type: entity
  id: SurgeryStepSeverLimb
  name: Отделить конечность
  categories: [ HideSpawnMenu ]
  components:
  - type: SurgeryStep
    tools: [ Scalpel, Saw ]
    duration: 6
    amputate: true

- type: entity
  id: SurgeryStepOpenAbdomen
  name: Раскрыть брюшную полость
  categories: [ HideSpawnMenu ]
  components:
  - type: SurgeryStep
    tools: [ Retractor ]
    duration: 4
    add:
    - type: SurgeryBonesOpen

# ===================== Лечебная хирургия (Ф8) =====================
# effect — что лечит шаг, когда сделан. Шаг без add/remove можно повторять (обработка ран).

- type: entity
  id: SurgeryStepSetBone
  name: Вправить кость
  categories: [ HideSpawnMenu ]
  components:
  - type: SurgeryStep
    tools: [ BoneSetter ]
    duration: 4
    add:
    - type: SurgeryBoneSet

- type: entity
  id: SurgeryStepBoneGel
  name: Скрепить костным гелем
  categories: [ HideSpawnMenu ]
  components:
  - type: SurgeryStep
    tools: [ BoneGel ]
    duration: 3
    effect: MendBone
    remove:
    - type: SurgeryBoneSet

- type: entity
  id: SurgeryStepRepairOrgans
  name: Восстановить ткани органов
  categories: [ HideSpawnMenu ]
  components:
  - type: SurgeryStep
    tools: [ Hemostat ]
    duration: 6
    effect: RepairOrgans

- type: entity
  id: SurgeryStepTendWounds
  name: Иссечь и ушить повреждённые ткани
  categories: [ HideSpawnMenu ]
  components:
  - type: SurgeryStep
    tools: [ Hemostat, Cautery ]
    duration: 4
    effect: TendWounds
    effectAmount: 40

- type: entity
  id: SurgeryStepClampVessels
  name: Пережать повреждённые сосуды
  categories: [ HideSpawnMenu ]
  components:
  - type: SurgeryStep
    tools: [ Hemostat ]
    duration: 3
    add:
    - type: SurgeryVesselsClamped

- type: entity
  id: SurgeryStepSutureVessels
  name: Сшить и прижечь сосуды
  categories: [ HideSpawnMenu ]
  components:
  - type: SurgeryStep
    tools: [ Cautery ]
    duration: 4
    effect: RepairVessels
    remove:
    - type: SurgeryVesselsClamped

- type: entity
  id: SurgeryStepRepairNerves
  name: Сшить нервы
  categories: [ HideSpawnMenu ]
  components:
  - type: SurgeryStep
    tools: [ Scalpel ]
    duration: 6
    effect: RepairNerves
