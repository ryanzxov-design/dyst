# Dystopia: реальные лекарства от болезней. Скорость обмена — 0,5 ед./с (по умолчанию), снижение инфекции
# указано за секунду: при -0,025 полная болезнь (100%) уходит за ~20 ед. без помощи иммунитета.
# Против какого типа — affectedType: Viral, Bacterial, Parasite, Fungal, Prion.
# Названия — Locale/*/_dystopia/health/disease.ftl, таблетки и баночки — medicine_forms.yml рядом.

# ===================== Противовирусные =====================

- type: reagent
  id: Oseltamivir
  name: reagent-name-oseltamivir
  desc: reagent-desc-oseltamivir
  group: Medicine
  flavor: bitter
  physicalDesc: reagent-physical-desc-powdery
  color: "#e9e4f5"
  metabolisms:
    Bloodstream:
      effects:
      - !type:DiseaseProgressChange
        affectedType: Viral
        progressModifier: -0.025 # мягкое, без побочек
      - !type:HealthChange
        conditions:
        - !type:ReagentCondition
          reagent: Oseltamivir
          min: 30
        damage:
          types:
            Poison: 1

- type: reagent
  id: Ribavirin
  name: reagent-name-ribavirin
  desc: reagent-desc-ribavirin
  group: Medicine
  flavor: bitter
  physicalDesc: reagent-physical-desc-translucent
  color: "#f2e27a"
  metabolisms:
    Bloodstream:
      effects:
      - !type:DiseaseProgressChange
        affectedType: Viral
        progressModifier: -0.05 # сильное, единственное надёжное от бешенства
      - !type:HealthChange # разрушает эритроциты
        damage:
          types:
            Bloodloss: 0.3

# ===================== Антибиотики =====================

- type: reagent
  id: Amoxicillin
  name: reagent-name-amoxicillin
  desc: reagent-desc-amoxicillin
  group: Medicine
  flavor: medicine
  physicalDesc: reagent-physical-desc-powdery
  color: "#f7f0d0"
  metabolisms:
    Bloodstream:
      effects:
      - !type:DiseaseProgressChange
        affectedType: Bacterial
        progressModifier: -0.03
      - !type:HealthChange
        conditions:
        - !type:ReagentCondition
          reagent: Amoxicillin
          min: 30
        damage:
          types:
            Poison: 1

- type: reagent
  id: Doxycycline
  name: reagent-name-doxycycline
  desc: reagent-desc-doxycycline
  group: Medicine
  flavor: bitter
  physicalDesc: reagent-physical-desc-chalky
  color: "#e8d36a"
  metabolisms:
    Bloodstream:
      effects:
      - !type:DiseaseProgressChange
        affectedType: Bacterial
        progressModifier: -0.025
      - !type:DiseaseProgressChange # слабо действует и на паразитов
        affectedType: Parasite
        progressModifier: -0.012

- type: reagent
  id: Isoniazid
  name: reagent-name-isoniazid
  desc: reagent-desc-isoniazid
  group: Medicine
  flavor: bitter
  physicalDesc: reagent-physical-desc-crystalline
  color: "#ffffff"
  metabolisms:
    Bloodstream:
      effects:
      - !type:DiseaseProgressChange
        affectedType: Bacterial
        progressModifier: -0.045 # сильнейший антибиотик, бьёт по печени
      - !type:HealthChange
        damage:
          types:
            Poison: 0.4

# ===================== Противопаразитарные =====================

- type: reagent
  id: Albendazole
  name: reagent-name-albendazole
  desc: reagent-desc-albendazole
  group: Medicine
  flavor: chalky
  physicalDesc: reagent-physical-desc-powdery
  color: "#ece8dc"
  metabolisms:
    Bloodstream:
      effects:
      - !type:DiseaseProgressChange
        affectedType: Parasite
        progressModifier: -0.04

- type: reagent
  id: Ivermectin
  name: reagent-name-ivermectin
  desc: reagent-desc-ivermectin
  group: Medicine
  flavor: bitter
  physicalDesc: reagent-physical-desc-oily
  color: "#d9c79a"
  metabolisms:
    Bloodstream:
      effects:
      - !type:DiseaseProgressChange
        affectedType: Parasite
        progressModifier: -0.03
      - !type:Jitter # передозировка — судороги
        conditions:
        - !type:ReagentCondition
          reagent: Ivermectin
          min: 20
      - !type:HealthChange
        conditions:
        - !type:ReagentCondition
          reagent: Ivermectin
          min: 20
        damage:
          types:
            Poison: 1.5

