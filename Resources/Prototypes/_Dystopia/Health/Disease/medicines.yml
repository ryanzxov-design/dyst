# ===================== Против прионов =====================

- type: reagent
  id: PentosanPolysulfate
  name: reagent-name-pentosan-polysulfate
  desc: reagent-desc-pentosan-polysulfate
  group: Medicine
  flavor: medicine
  physicalDesc: reagent-physical-desc-viscous
  color: "#c9e3c4"
  metabolisms:
    Bloodstream:
      effects:
