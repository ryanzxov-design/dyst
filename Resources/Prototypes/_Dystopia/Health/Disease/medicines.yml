# ===================== Рецепты =====================

- type: reaction
  id: Oseltamivir
  reactants:
    Immurin:
      amount: 1
    Ethanol:
      amount: 1
    Nitrogen:
      amount: 1
  products:
    Oseltamivir: 3

- type: reaction
  id: Ribavirin
  reactants:
    Devirate:
      amount: 1
    Sugar: # рибоза
      amount: 1
    Nitrogen:
      amount: 1
  products:
    Ribavirin: 2

- type: reaction
  id: Amoxicillin
  reactants:
    Phenol:
      amount: 1
    Ammonia:
      amount: 1
    Sulfur:
      amount: 1
  products:
    Amoxicillin: 3

- type: reaction
