# Dystopia: нефть, шаг 2 — перегонка. Генератор gen_oil_refining.py.
# Фракции нефти. Все горят (FlammableTileReaction) и ядовиты; лёгкие быстро испаряются, тяжёлые лежат лужей.

- type: reagent
  id: DystopiaGasoline
  name: reagent-name-dystopia-gasoline
  group: Industrial
  desc: reagent-desc-dystopia-gasoline
  physicalDesc: reagent-physical-desc-volatile
  flavor: bitter
  color: "#e8d27a"
  boilingPoint: 100.0
  meltingPoint: -60.0
  evaporationSpeed: 0.6
  tileReactions:
  - !type:FlammableTileReaction {}
  metabolisms:
    Bloodstream:
      effects:
      - !type:HealthChange
        damage:
          types:
            Poison: 1
      - !type:Flammable
        multiplier: 0.6

