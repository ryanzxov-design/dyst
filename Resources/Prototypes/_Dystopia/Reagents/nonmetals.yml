# Dystopia: неметаллы, шаг 1 — сырьё и вещества (машины и рецепты переработки — следующим шагом).
# Вещества неметаллов. Хлор пока — ванильная жидкость, не газ.

- type: reagent
  id: DystopiaMoltenGlass
  name: reagent-name-dystopia-molten-glass
  group: Metals
  desc: reagent-desc-dystopia-molten-glass
  physicalDesc: reagent-physical-desc-dystopia-molten
  flavor: bitter
  color: "#ffb060"
  meltingPoint: 1000.0
  boilingPoint: 2230.0
  reactiveEffects:
    Acidic:
      methods: [ Touch, Ingestion ]
      effects:
      - !type:HealthChange
        damage:
          types:
            Heat: 3

