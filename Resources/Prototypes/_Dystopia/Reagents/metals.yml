# Dystopia: металлы и сплавы Города (этап «Промышленность: вещества»). Самостоятельные сущности, без parent.
# Олово и хром — порошки-элементы (их нет в ванили). Расплавы — жидкие формы металлов и сплавов:
# пока только обжигают при касании; застывание и литьё — этап «Промышленность: переработка».

- type: reagent
  id: DystopiaTin
  name: reagent-name-dystopia-tin
  group: Elements
  desc: reagent-desc-dystopia-tin
  physicalDesc: reagent-physical-desc-metallic
  flavor: metallic
  color: "#c8c8be"
  meltingPoint: 231.9
  boilingPoint: 2602.0

