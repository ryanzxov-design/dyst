    emitters:
    # облако пара
    - rate: 60
      lifetime: 2.5,4.5
      speed: 0.3,0.7
      direction: 0
      spread: 30
      alignToVelocity: false
      inheritVelocity: 0
      drift: 0.12,0.15
      drag: 0.3
      jitter: 1.75
      size: 4,7
      additive: false
      offset: 0,2.0
      activeWhen: enum.DystopiaCoolingTowerVisuals.Working
      colors:
      - "#F0F4F800"
      - "#E6ECF2B0"
      - "#D4DCE490"
      - "#BCC6D050"
      - "#A8B2BC00"
    # капель в бассейне
    - rate: 15
      lifetime: 0.6,1.1
      speed: 0.05,0.2
      direction: 0
      spread: 40
      alignToVelocity: false
      inheritVelocity: 0
      drift: 0,-1.2
      drag: 0.2
      jitter: 1.5
      size: 1,1
      additive: false
      offset: 0,-1.7
      activeWhen: enum.DystopiaCoolingTowerVisuals.Working
      colors:
      - "#B8D8F0A0"
      - "#88B4D860"
      - "#5A8AB000"
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 1500
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: [ Destruction ]

- type: entity
  id: DystopiaCoolingTowerInlet
  name: cooling tower steam inlet
  description: The steam inlet of a cooling tower.
  categories: [ HideSpawnMenu ]
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: NodeContainer
    nodes:
      inlet:
        !type:PipeNode
        nodeGroupID: Pipe
        pipeDirection: South   # поворачивается наружу при установке
        volume: 200
  - type: DystopiaCoolingTowerInlet
