  name: large cooling tower
  description: "A 5×5 cooling tower, three times the capacity of the small one: steam from a gas pipe condenses into water. Some escapes as a cloud. Unpowered, natural draft is three times slower."
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
    noRot: true
  - type: Clickable
  - type: InteractionOutline
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-2.45,-2.45,2.45,2.45"
        density: 4000
        mask: [ MachineMask ]
        layer: [ MachineLayer ]
  - type: Tag
    tags: [ Structure ]
  - type: Sprite
    sprite: _Dystopia/Structures/Power/cooling_tower_large.rsi
