  description: "A steel lattice tower for an overhead power line. Hang wire from pylon to pylon with a coil of line wire: poke one, then the other, up to 12 tiles apart. Pylons joined by wire are one high-voltage network; connect to it with a high-voltage cable under any pylon. Wirecutters take its wires down."
