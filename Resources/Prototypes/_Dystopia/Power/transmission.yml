# Dystopia: энергетика, шаг 4 (gen_energy4.py) — нефтепровод (терминалы, колодцы, секции трубы), ЛЭП
# (опоры, провод), повышающие трансформаторы. Крафт — gen_crafts.py.

- type: entity
  id: DystopiaPipelineTerminal
  name: pipeline terminal
  description: "One end of a buried trunk pipeline. Link two terminals with a stack of trunk pipe sections: poke one, then the other; the pipe is laid straight between them, up to 80 tiles, one section per 4 tiles. Connect it to ordinary liquid pipes with an exporter or importer. In the menu one end sends and the other receives; the pump runs on power."
  placement:
    mode: SnapgridCenter
  components:
  - type: Construction   # крафт (gen_crafts.py)
    graph: DystopiaPipelineTerminalCraft
    node: done
  - type: Transform
    anchored: true
    noRot: true
  - type: Clickable
  - type: InteractionOutline
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 500
        mask: [ MachineMask ]
        layer: [ MachineLayer ]
  - type: Tag
    tags: [ Structure ]
  - type: Sprite
    sprite: _Dystopia/Structures/Liquids/pipeline_terminal.rsi
    noRot: true
    drawdepth: Objects
    layers:
    - state: icon
    - state: mode0
      map: [ "enum.DystopiaPipelineVisuals.Mode" ]
      shader: unshaded
    - state: leak
      map: [ "enum.DystopiaPipelineVisuals.Leak" ]
      shader: unshaded
      visible: false
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.DystopiaPipelineVisuals.Mode:
        enum.DystopiaPipelineVisuals.Mode:
          "0": { state: mode0 }
          "1": { state: mode1 }
          "2": { state: mode2 }
      enum.DystopiaPipelineVisuals.Leak:
        enum.DystopiaPipelineVisuals.Leak:
          True: { visible: true }
          False: { visible: false }
  - type: Solution
    id: tank
    solution:
      maxVol: 1000
      canReact: false
  - type: RefillableSolution
    solution: tank
  - type: DrainableSolution
    solution: tank
  - type: ExaminableSolution
    solution: tank
  - type: ApcPowerReceiver   # насос
    powerLoad: 3000
  - type: ExtensionCableReceiver
  - type: DystopiaPipelineTerminal
  - type: ActivatableUI
    key: enum.DystopiaPipelineUiKey.Key
  - type: UserInterface
    interfaces:
      enum.DystopiaPipelineUiKey.Key:
        type: DystopiaPipelineBoundUserInterface
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Repairable   # чинят сваркой
    fuelCost: 10
    doAfterDelay: 6
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 250
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 2
            max: 2
      - !type:DoActsBehavior
        acts: [ Destruction ]

- type: entity
  id: DystopiaPipelineMarker
  name: pipeline manhole
  description: "A manhole over the buried trunk pipeline. If it is damaged, the pipe beneath leaks; broken, it bursts. Weld it to repair."
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
    noRot: true
  - type: Clickable
  - type: InteractionOutline
  - type: Physics
    bodyType: Static
    canCollide: false
  - type: Fixtures
  - type: Visibility
    layer: 1
  - type: SubFloorHide   # под полом не видно, на голой земле — видно
  - type: Sprite
    sprite: _Dystopia/Structures/Liquids/pipeline_marker.rsi
    noRot: true
    drawdepth: ThinPipe
    state: icon
  - type: DystopiaPipelineMarker
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Repairable   # чинят сваркой
    fuelCost: 10
    doAfterDelay: 6
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 400
      behaviors:
      - !type:DoActsBehavior
        acts: [ Destruction ]

- type: entity
  id: DystopiaPipelineSection
  name: trunk pipe section
  description: "A length of thick pipe for a buried trunk pipeline. Poke one pipeline terminal with the stack, then another: the pipe is laid between them, one section per 4 tiles."
  suffix: Full
  components:
  - type: Item
    size: Large
    sprite: _Dystopia/Objects/Materials/pipeline_section.rsi
    heldPrefix: section
  - type: Animateable
  - type: Clickable
  - type: InteractionOutline
  - type: MovedByPressure
  - type: EmitSoundOnCollide
    sound:
      collection: WeakHit
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Effects/drop.ogg
      params:
        volume: 2
  - type: DamageOnHighSpeedImpact
    damage:
      types:
        Blunt: 5
    soundHit:
      collection: MetalThud
  - type: CollisionWake
  - type: GravityAffected
  - type: Physics
    bodyType: Dynamic
    fixedRotation: false
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.25,-0.25,0.25,0.25"
        density: 20
        mask: [ ItemMask ]
        restitution: 0.3
        friction: 0.2
  - type: Sprite
    drawdepth: Items
    noRot: false
    sprite: _Dystopia/Objects/Materials/pipeline_section.rsi
    state: section_5
    layers:
    - state: section_5
      map: [ base ]
  - type: Pullable
  - type: DamageExaminable
  - type: Rotatable
    increment: 30
  - type: Damageable
    damageModifierSet: FlimsyMetallic
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:DoActsBehavior
        acts: [ Destruction ]
  - type: Appearance
  - type: Stack
    stackType: DystopiaPipelineSection
    baseLayer: base
    layerStates: [ section, section_2, section_3, section_4, section_5 ]
  - type: DystopiaLinker
    tilesPerItem: 4

