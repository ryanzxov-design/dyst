- type: entity
  id: DystopiaTransformerLvMv
  name: transformer box
  description: "A step-up transformer: low voltage in, medium voltage out, up to 30 kW, losing 5% on the way. For portable generators. The low-voltage cable goes under it as the input, the medium-voltage one as the output."
  placement:
    mode: SnapgridCenter
  components:
  - type: Construction   # крафт (gen_crafts.py)
    graph: DystopiaTransformerLvMvCraft
    node: done
  - type: Transform
    anchored: true
    noRot: true
  - type: Clickable
  - type: InteractionOutline
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 500
        mask: [ MachineMask ]
        layer: [ MachineLayer ]
  - type: Tag
    tags: [ Structure ]
  - type: Sprite
    sprite: _Dystopia/Structures/Power/transformer_lv_mv.rsi
    noRot: true
    drawdepth: Objects
    state: icon
  - type: NodeContainer
    examinable: true
    nodes:
      input:
        !type:CableDeviceNode
        nodeGroupID: Apc
      output:
        !type:CableDeviceNode
        nodeGroupID: MVPower
  - type: PowerConsumer   # снизу — как потребитель
    voltage: Apc
    node: input
    drawRate: 0
  - type: PowerSupplier   # наверх — как генератор
    voltage: Medium
    node: output
    supplyRate: 0
    supplyRampRate: 100000000
    supplyRampTolerance: 100000000
  - type: DystopiaTransformer
    maxPower: 30000
    efficiency: 0.95
  - type: AmbientSound
    volume: -8
    range: 4
    sound:
      path: /Audio/Ambience/Objects/periodic_beep.ogg
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Repairable   # чинят сваркой
    fuelCost: 10
    doAfterDelay: 6
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 2
            max: 2
      - !type:DoActsBehavior
        acts: [ Destruction ]

