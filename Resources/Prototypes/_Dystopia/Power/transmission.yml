  - type: NodeContainer
    examinable: true
    nodes:
      power:
        !type:DystopiaPylonNode
        nodeGroupID: HVPower
  - type: DystopiaPylon
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Repairable   # чинят сваркой
