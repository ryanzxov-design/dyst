# SPDX-License-Identifier: AGPL-3.0-or-later
# Dystopia: жидкостная система — трубы (отдельный слой, с газовыми не соединяются), порт, насос, экспортер, импортер.
# Трубы держат общий раствор сети (по 50 ед. на трубу), на трубе — отсечки цвета смеси. Пока только спавном:
# крафты — в самом конце, после всех материалов, машин и структур.
# Направления узлов — для сущности с поворотом 0 (смотрит на юг). Самостоятельные сущности, без parent.

- type: entity
  id: DystopiaLiquidPipeHalf
  name: liquid pipe
  suffix: Half
  description: "Half of a liquid pipe: a dead end."
  placement:
    mode: SnapgridCenter
  components:
  - type: Item
    size: Small
    storedSprite:
      sprite: _Dystopia/Structures/Piping/liquid_pipe.rsi
      state: storageHalf
  - type: Animateable
  - type: Clickable
  - type: InteractionOutline
  - type: MovedByPressure
  - type: EmitSoundOnCollide
    sound:
      collection: WeakHit
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Effects/drop.ogg
      params:
        volume: 2
  - type: DamageOnHighSpeedImpact
    damage:
      types:
        Blunt: 5
    soundHit:
      collection: MetalThud
  - type: CollisionWake
  - type: GravityAffected
  - type: Physics
    canCollide: false
    bodyType: static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.25,0.25,0.25"
        density: 20
        mask:
        - ItemMask
        restitution: 0.3
        friction: 0.2
  - type: Pullable
  - type: DamageExaminable
  - type: Visibility
    layer: 1
  - type: Transform
    anchored: true
  - type: SubFloorHide
  - type: CollideOnAnchor
  - type: Anchorable
  - type: Rotatable
    increment: 90
  - type: Appearance
  - type: StaticPrice
    price: 30
  - type: Sprite
    sprite: _Dystopia/Structures/Piping/liquid_pipe.rsi
    drawdepth: ThinPipe
    noRot: false
    visible: false
    layers:
    - state: pipeHalf
    - state: pipeHalf-marks
      map: [ "enum.DystopiaLiquidVisualLayers.Marks" ]
      color: "#5A5A5A"
  - type: NodeContainer
    nodes:
      pipe:
        !type:DystopiaLiquidPipeNode
        nodeGroupID: DystopiaLiquid
        pipeDirection: South
        volume: 50
  - type: DystopiaLiquidPipe
    emptyColor: "#5A5A5A"

