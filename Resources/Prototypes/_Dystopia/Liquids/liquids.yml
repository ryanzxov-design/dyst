  - type: DamageExaminable
  - type: Visibility
    layer: 1
  - type: Transform
    anchored: true
  - type: SubFloorHide
    blockInteractions: false
    blockAmbience: false
    visibleLayers:
    - enum.SubfloorLayers.FirstLayer
  - type: CollideOnAnchor
  - type: Anchorable
  - type: Rotatable
    increment: 90
  - type: Appearance
  - type: StaticPrice
    price: 30
  - type: Sprite
    sprite: _Dystopia/Structures/Piping/liquid_pipe.rsi
    drawdepth: ThinPipe
    noRot: false
    visible: false
    layers:
    - state: pipeStraight
    - sprite: _Dystopia/Structures/Piping/liquid_pump.rsi
      state: pumpPressure
      map: [ "enum.SubfloorLayers.FirstLayer", "enabled" ]
  - type: NodeContainer
    nodes:
      pipe:
        !type:DystopiaLiquidPipeNode
        nodeGroupID: DystopiaLiquid
        pipeDirection: North
        volume: 10
      outlet:
        !type:DystopiaLiquidPipeNode
        nodeGroupID: DystopiaLiquid
        pipeDirection: South
        volume: 10
  - type: DystopiaLiquidDevice
    mode: Pump
    rate: 20
    inlet: pipe
    outlet: outlet
    requirePower: true
    toggleable: true
    on: false
  - type: ApcPowerReceiver
    powerLoad: 300
  - type: ExtensionCableReceiver
  - type: GenericVisualizer
    visuals:
      enum.DystopiaLiquidVisuals.Working:
        enabled:
          True: { state: pumpPressureOn }
          False: { state: pumpPressure }

