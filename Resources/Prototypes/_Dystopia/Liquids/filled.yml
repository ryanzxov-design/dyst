# SPDX-License-Identifier: AGPL-3.0-or-later
# Dystopia: жидкости в меню спавна — кувшины (240 ед.) и резервуары (960 ед.) с каждым нашим жидким веществом. Для проверки. Генератор gen_liquid_spawns.py.

- type: entity
  id: DystopiaJugCrudeOil
  name: jug
  suffix: CrudeOil
  components:
  - type: Solution
    solution:
      maxVol: 240
      reagents:
      - ReagentId: DystopiaCrudeOil
        Quantity: 240
    id: drink
  - type: Damageable
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 20
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalCrunch
          params:
            volume: -4
      - !type:SpillBehavior {}
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetPlastic1:
            min: 0
            max: 1
        transferForensics: true
      - !type:DoActsBehavior
        acts: [ Destruction ]
  - type: DamageOnLand
    ignoreResistances: true
    damage:
      types:
        Blunt: 1
  - type: DamageOtherOnHit
    damage:
      types:
        Blunt: 2
  - type: PhysicalComposition
    materialComposition:
      Plastic: 100
  - type: Item
    size: Large
    sprite: Objects/Specific/Chemistry/jug.rsi
  - type: Animateable
  - type: Clickable
  - type: InteractionOutline
  - type: MovedByPressure
  - type: EmitSoundOnCollide
    sound:
      collection: WeakHit
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Effects/drop.ogg
      params:
        volume: 2
  - type: DamageOnHighSpeedImpact
    damage:
      types:
        Blunt: 5
    soundHit:
      collection: MetalThud
  - type: CollisionWake
  - type: GravityAffected
  - type: Physics
    bodyType: Dynamic
    fixedRotation: false
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.25,-0.25,0.25,0.25"
        density: 20
        mask: [ ItemMask ]
        restitution: 0.3
        friction: 0.2
  - type: Sprite
    drawdepth: Items
    noRot: false
    layers:
    - state: icon_empty
      map: [ enum.OpenableVisuals.Layer ]
    - state: fill-1
      map:
      - enum.SolutionContainerLayers.Fill
      visible: false
    sprite: Objects/Specific/Chemistry/jug.rsi
  - type: Pullable
  - type: DamageExaminable
  - type: Rotatable
    increment: 30
  - type: MeleeWeapon
    soundNoDamage:
      path: /Audio/Effects/Fluids/splat.ogg
    damage:
      types:
        Blunt: 0
  - type: DnaSubstanceTrace
  - type: Edible
    edible: Drink
    destroyOnEmpty: false
    utensil: None
    solution: drink
  - type: Spillable
    solution: drink
  - type: MixableSolution
    solution: drink
  - type: DrawableSolution
    solution: drink
  - type: RefillableSolution
    solution: drink
  - type: DrainableSolution
    solution: drink
  - type: InjectableSolution
    solution: drink
  - type: ExaminableSolution
    solution: drink
    examinableWhileClosed: true
    heldOnly: false
    exactVolume: true
  - type: SolutionItemStatus
    solution: drink
  - type: SolutionTransfer
    canChangeTransferAmount: true
  - type: UserInterface
    interfaces:
      enum.TransferAmountUiKey.Key:
        type: TransferAmountBoundUserInterface
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.OpenableVisuals.Opened:
        enum.OpenableVisuals.Layer:
          true:
            state: icon_open
          false:
            state: icon_empty
  - type: SolutionContainerVisuals
    solutionName: drink
    maxFillLevels: 6
    fillBaseName: fill-
    inHandsMaxFillLevels: 5
    inHandsFillBaseName: "-fill-"
  - type: Construction
    graph: JugCraft
    node: done
  - type: StaticPrice
    price: 60
  - type: Tag
    tags: [ ChemDispensable ]
  - type: Label
    localizedLabel: reagent-name-dystopia-crude-oil

- type: entity
  id: DystopiaTankCrudeOil
  name: storage tank
  suffix: CrudeOil
  placement:
    mode: SnapgridCenter
  components:
  - type: Solution
    id: tank
    solution:
      maxVol: 960
      reagents:
      - ReagentId: DystopiaCrudeOil
        Quantity: 960
  - type: Transform
    anchored: false
    noRot: true
  - type: Clickable
  - type: GravityAffected
  - type: Physics
    bodyType: Dynamic
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.4"
        density: 155
        mask: [ MachineMask ]
        layer: [ MachineLayer, InteractImpassable ]
  - type: Pullable
  - type: Tag
    tags: [ Structure ]
  - type: Anchorable
  - type: Animateable
  - type: Sprite
    noRot: true
    sprite: Structures/Storage/tanks.rsi
    layers:
    - state: watertank-2
    - state: watertank-2-1
      map:
      - enum.SolutionContainerLayers.Fill
      visible: false
  - type: InteractionOutline
  - type: DrainableSolution
    solution: tank
  - type: ReagentTank
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTypeTrigger
        damageType: Heat
        damage: 5
      behaviors:
      - !type:SolutionExplosionBehavior
        solution: tank
    - trigger: !type:DamageTypeTrigger
        damageType: Piercing
        damage: 5
      behaviors:
      - !type:SolutionExplosionBehavior
        solution: tank
    - trigger: !type:DamageTrigger
        damage: 20
      behaviors:
      - !type:SpillBehavior
        solution: tank
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
  - type: Damageable
    damageModifierSet: PlasticMod
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: TileFrictionModifier
    modifier: 0.4
  - type: StaticPrice
    price: 500
  - type: Appearance
  - type: SolutionContainerVisuals
    maxFillLevels: 5
    fillBaseName: watertank-2-
  - type: ExaminableSolution
    solution: tank
  - type: Label
    localizedLabel: reagent-name-dystopia-crude-oil

