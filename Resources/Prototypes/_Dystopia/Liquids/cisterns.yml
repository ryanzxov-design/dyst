# Dystopia: цистерны 3×5 (вдоль и поперёк, из секций каркаса) и бочки на 200 единиц (gen_oil4b.py).

- type: entity
  id: DystopiaCistern
  name: cistern
  description: "A 10 000-unit steel cistern for any liquid on a concrete base with a manifold all round: fill and drain it with liquid exporters and importers right against any side."
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Clickable
  - type: InteractionOutline
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-1.45,-2.45,1.45,2.45"
        density: 4000
        mask: [ MachineMask ]
        layer: [ MachineLayer ]
  - type: Tag
    tags: [ Structure ]
  - type: Sprite   # 4 направления: юг/север — вдоль, восток/запад — поперёк
    sprite: _Dystopia/Structures/Liquids/cistern.rsi
    noRot: false
    drawdepth: Objects
    state: icon
  - type: Solution
    id: tank
    solution:
      maxVol: 10000
      canReact: false
  - type: DrainableSolution
    solution: tank
  - type: RefillableSolution
    solution: tank
  - type: ExaminableSolution
    solution: tank
  - type: DystopiaLiquidAccess   # коллектор по периметру основания — с любой стороны
    anywhere: true
  - type: DystopiaMultiblock
    frame: DystopiaFrameCistern
    width: 3
    height: 5
    portsHint: dystopia-cistern-ports
  - type: Construction
    graph: DystopiaCisternAssembly
    node: done
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 1200
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:SpillBehavior
        solution: tank
      - !type:DoActsBehavior
        acts: [ Destruction ]

- type: entity
  id: DystopiaBarrel
  name: barrel
  description: "A 200-unit steel barrel. Pour into it with a bucket or tap it; wrench it down next to a liquid exporter or importer to fill or drain it through the pipes."
  placement:
    mode: SnapgridCenter
  components:
  - type: Construction   # крафт (gen_crafts.py)
    graph: DystopiaBarrelCraft
    node: done
  - type: Transform
    anchored: false
    noRot: true
  - type: Clickable
  - type: InteractionOutline
  - type: Physics
    bodyType: Dynamic
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.3,-0.45,0.3,0.3"
        density: 200
        mask: [ MachineMask ]
        layer: [ MachineLayer ]
  - type: Pullable
  - type: Anchorable
    delay: 2
  - type: Tag
    tags: [ Structure ]
  - type: Sprite
    sprite: _Dystopia/Structures/Liquids/barrel.rsi
    noRot: true
    drawdepth: Objects
    state: icon
  - type: Solution
    id: tank
    solution:
      maxVol: 200
      canReact: false
  - type: DrainableSolution
    solution: tank
  - type: RefillableSolution
    solution: tank
  - type: ExaminableSolution
    solution: tank
  - type: Spillable
    solution: tank
  - type: PhysicalComposition
    materialComposition:
      Steel: 400
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 150
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:SpillBehavior
        solution: tank
      - !type:DoActsBehavior
        acts: [ Destruction ]

