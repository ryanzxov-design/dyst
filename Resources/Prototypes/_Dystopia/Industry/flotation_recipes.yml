# Dystopia: ступень ×5 переработки металлов. Молотая руда (из мельницы) обогащается тремя путями:
# флотация — халькопирит, сфалерит, галенит, аргентит, касситерит (2 горсти молотой + 20 воды + 1 флотореагента →
# 5 флотоконцентрата + песок; у полиметаллических руд — партия ×4 с попутным концентратом);
# магнитная сепарация — гематит, хромит (2 горсти → 5 магнитного концентрата + песок, всухую);
# амальгамация — золото (2 горсти + 10 воды + 2 ртути → 5 амальгамы + песок; ртуть в тигле выкипает).
# Рецепты флотомашин (Flotation), магнитного сепаратора (MagneticSeparator) и амальгамационной бочки (Amalgamation).

- type: dystopiaProcessRecipe
  id: DystopiaSeparateHematite
  group: MagneticSeparator
  input: DystopiaGroundHematite
  inputCount: 2
  output: DystopiaMagneticHematite1
  amount: 5
  byproducts:
    DystopiaSand1: 1   # хвосты

- type: dystopiaProcessRecipe
  id: DystopiaFloatChalcopyrite
  group: Flotation
  input: DystopiaGroundChalcopyrite
  inputCount: 8
  output: DystopiaFlotationChalcopyrite1
  amount: 20
  byproducts:
    DystopiaSand1: 4   # хвосты
    DystopiaConcentrateGoldOre1: 1   # попутный концентрат
  reagents:
    Water: 80
    DystopiaFlotationReagent: 4

