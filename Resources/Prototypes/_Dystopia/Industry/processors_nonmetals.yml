# Dystopia: неметаллы, шаг 2 — переработка.
# Машины неметаллов: коксовая печь (Coking), кирпичные прессы (BrickPress), бетономешалка (Mixing), контактный
# аппарат (Contact). Рецепты — nonmetal_recipes.yml. Числа — в полях DystopiaProcessor. Баки не реагируют
# (canReact: false); у бетономешалки и контактного аппарата готовое идёт в отдельный бак продукции
# (processor_solutions.yml). Самостоятельные сущности, без parent.

- type: entity
  id: DystopiaCokeOven
  name: coke oven
  description: "A brick chamber where coal is baked without air. Out comes light grey coke; the tar runs off into a tank. Graphite bound with that tar bakes here into electrodes."
  placement:
    mode: SnapgridCenter
  components:
  - type: Construction   # крафт (gen_crafts.py)
    graph: DystopiaCokeOvenCraft
    node: done
  - type: DystopiaParticleEmitter   # частицы (gen_particles.py)
    emitters:
    # дым
    - rate: 9
      lifetime: 1.6,2.8
      speed: 0.1,0.3
      direction: 0
      spread: 50
      alignToVelocity: false
      inheritVelocity: 0
      drift: 0,0.35
      drag: 0.6
      jitter: 0.9
      size: 3,5
      additive: false
      activeWhen: enum.DystopiaProcessorVisuals.Running
      colors:
      - "#3A383600"
      - "#3A383670"
      - "#3A383640"
      - "#3A383600"
    # искры, летят вверх
    - rate: 3
      lifetime: 0.6,1.2
      speed: 0.3,0.8
      direction: 0
      spread: 80
      alignToVelocity: false
      inheritVelocity: 0
      drift: 0,0.5
      drag: 0.8
      jitter: 0.8
      size: 1,1
      additive: true
      flicker: 0.5
      activeWhen: enum.DystopiaProcessorVisuals.Running
      colors:
      - "#FFD27AFF"
      - "#FF8A2AC8"
      - "#C0401A00"
  - type: Transform
    anchored: true
    noRot: true
  - type: Clickable
  - type: InteractionOutline
  - type: GravityAffected
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 250
        mask: [ MachineMask ]
        layer: [ MachineLayer ]
  - type: Pullable
  - type: Anchorable
    delay: 2
  - type: Tag
    tags: [ Structure ]
  - type: Sprite
    sprite: _Dystopia/Structures/Industry/coke_oven.rsi
    noRot: true
    drawdepth: Objects
    layers:
    - state: icon
      map: [ "enum.DystopiaProcessorVisuals.Running" ]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.DystopiaProcessorVisuals.Running:
        enum.DystopiaProcessorVisuals.Running:
          True: { state: running }
          False: { state: icon }
  - type: ApcPowerReceiver
    powerLoad: 2000
  - type: ExtensionCableReceiver
  - type: AmbientSound
    enabled: false
    volume: -6
    range: 5
    sound:
      path: /Audio/Ambience/Objects/crushing.ogg
  - type: Solution
    id: tank
    solution:
      maxVol: 200
      canReact: false   # вещества в баке не реагируют между собой
  - type: RefillableSolution   # воду — ведром или из цистерны
    solution: tank
  - type: DrainableSolution
    solution: tank
  - type: ContainerContainer
    containers:
      dystopia_processor_input: !type:Container {}
      dystopia_processor_output: !type:Container {}
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:EmptyAllContainersBehaviour
      - !type:SpawnEntitiesBehavior
        spawn:
          DystopiaFireBrick1:
            min: 3
            max: 6
      - !type:DoActsBehavior
        acts: [ Destruction ]
  - type: DystopiaProcessor
    group: Coking
    container: dystopia_processor_input
    capacity: 30
    batchesPerCycle: 1
    cycleTime: 8
    manual: false
    requireAnchored: true
    outputContainer: dystopia_processor_output
    outputCapacity: 60
    tank: tank
    cycleSound:
      path: /Audio/Effects/stonedoor_openclose.ogg
      params:
        volume: -6
    insertSound:
      path: /Audio/Effects/stonedoor_openclose.ogg
      params:
        volume: -8

- type: entity
  id: DystopiaHandBrickPress
  name: hand brick press
  description: "A wooden frame with an iron lever. Put a lump of clay in the mould and lean on the lever: out drop two raw bricks."
  placement:
    mode: SnapgridCenter
  components:
  - type: Construction   # крафт (gen_crafts.py)
    graph: DystopiaHandBrickPressCraft
    node: done
  - type: DystopiaParticleEmitter   # частицы (gen_particles.py)
    emitters:
    # рудная пыль
    - rate: 5
      lifetime: 0.5,1.1
      speed: 0.15,0.5
      direction: 0
      spread: 360
      alignToVelocity: false
      inheritVelocity: 0
      drift: 0,-0.2
      drag: 1.2
      jitter: 0.3
      size: 1,2
      additive: false
      activeWhen: enum.DystopiaProcessorVisuals.Running
      colors:
      - "#9A6A4600"
      - "#9A6A46A0"
      - "#9A6A4650"
      - "#9A6A4600"
  - type: Transform
    anchored: true
    noRot: true
  - type: Clickable
  - type: InteractionOutline
  - type: GravityAffected
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.4,-0.45,0.4,0.3"
        density: 200
        mask: [ MachineMask ]
        layer: [ MidImpassable, LowImpassable ]
  - type: Pullable
  - type: Anchorable
    delay: 2
  - type: Tag
    tags: [ Structure ]
  - type: Sprite
    sprite: _Dystopia/Structures/Industry/hand_brick_press.rsi
    noRot: true
    drawdepth: Objects
    layers:
    - state: icon
      map: [ "enum.DystopiaProcessorVisuals.Running" ]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.DystopiaProcessorVisuals.Running:
        enum.DystopiaProcessorVisuals.Running:
          True: { state: running }
          False: { state: icon }
  - type: ContainerContainer
    containers:
      dystopia_processor_input: !type:Container {}
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 120
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:EmptyAllContainersBehaviour
      - !type:SpawnEntitiesBehavior
        spawn:
          DystopiaIngotCastIron1:
            min: 1
            max: 2
      - !type:DoActsBehavior
        acts: [ Destruction ]
  - type: DystopiaProcessor
    group: BrickPress
    container: dystopia_processor_input
    capacity: 10
    batchesPerCycle: 1
    cycleTime: 3
    manual: true
    requireAnchored: true
    workVerb: dystopia-processor-work-press
    cycleSound:
      path: /Audio/Effects/break_stone.ogg
      params:
        volume: -6
    insertSound:
      path: /Audio/Effects/stonedoor_openclose.ogg
      params:
        volume: -8

