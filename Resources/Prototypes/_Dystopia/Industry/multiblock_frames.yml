# Dystopia: секции каркаса фиксированных многоблоков (gen_oil4b.py). Секции одного ключа соединяются
# текстурами; ровный прямоугольник нужного размера (с узлом в центре, если нужен) превращается в машину
# (DystopiaMultiblockSystem). Крафт — gen_crafts.py.

- type: entity
  id: DystopiaFrameArcFurnace
  name: arc furnace frame section
  description: "A steel shell segment on a firebrick bed: part of a future arc furnace. The furnace is assembled from 3×3 sections with the electrode core in the middle."
  placement:
    mode: SnapgridCenter
  components:
  - type: Construction   # крафт (gen_crafts.py)
    graph: DystopiaFrameArcFurnaceCraft
    node: done
  - type: Transform
    anchored: true
    noRot: true
  - type: Clickable
  - type: InteractionOutline
  - type: Tag   # леса проходимы (без физики); одна секция на клетку
    tags: [ Structure, Unstackable ]
  - type: Sprite
    sprite: _Dystopia/Structures/Industry/frame_arc_furnace.rsi
    noRot: true
    drawdepth: FloorObjects
    layers:
    - state: frame0
  - type: IconSmooth   # секции одного многоблока тянутся друг к другу (север 1, юг 2, восток 4, запад 8)
    key: DystopiaMbArcFurnace
    base: frame
    mode: CardinalFlags
  - type: DystopiaMultiblockFrame
    key: DystopiaMbArcFurnace
    width: 3
    height: 3
    result: DystopiaArcFurnace
    core: false
    requireCore: true
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: [ Destruction ]

