# SPDX-License-Identifier: AGPL-3.0-or-later
# Dystopia: крафты производства (первый заход, без нефти). Предметы — в руки из меню. Постройки — по
# призраку: первый ресурс (у сложных машин — чертёж) закладывает недострой, остальные ресурсы вставляют по
# одному, последний превращает недострой в машину. Разборка ломом возвращает всё. Цены — crafts_table.py,
# генератор gen_crafts.py.
# Недострои: полупрозрачная картинка будущей постройки.

- type: entity
  id: DystopiaSiteForge
  name: construction site
  description: Unfinished construction. Examine it to see what goes in next.
  categories: [ HideSpawnMenu ]
  components:
  - type: Transform
    anchored: true
    noRot: true
  - type: Clickable
  - type: InteractionOutline
  - type: Sprite
    sprite: _Dystopia/Structures/Industry/forge.rsi
    state: base
    color: "#FFFFFF80"
    drawdepth: Objects
    noRot: true
  - type: Construction
    graph: DystopiaForgeCraft
    node: s1
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.35"
        density: 1000
        mask: [ TableMask ]
        layer: [ TableLayer ]
      itemcollide:
        shape: !type:PhysShapeAabb
          bounds: "-0.35,-0.3,0.35,0.45"
        layer: [ HighImpassable ]
        hard: false

