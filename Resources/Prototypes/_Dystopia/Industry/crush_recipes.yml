# Dystopia: дроблёная руда — ступень ×2 переработки металлов (дробилка → тигель 1:1).
# Рецепты дробилок (группа Crusher): кусок руды (стек input) → amount горстей (output). Дробятся только руды, которые
# плавятся в тигле; боксит, уранинит и химические руды пойдут своими цепочками.

- type: dystopiaProcessRecipe
  id: DystopiaCrushedHematite
  group: Crusher
  input: SteelOre
  output: DystopiaCrushedHematite1
  amount: 2

- type: dystopiaProcessRecipe
  id: DystopiaCrushedChalcopyrite
  group: Crusher
  input: DystopiaOreChalcopyrite
  output: DystopiaCrushedChalcopyrite1
  amount: 2

