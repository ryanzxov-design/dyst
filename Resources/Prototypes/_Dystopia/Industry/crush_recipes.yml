# Dystopia: дроблёная руда — ступень ×2 переработки металлов (дробилка → тигель 1:1).
# Рецепты дробилки: кусок руды (стек input) → amount горстей (output). Дробятся только руды, которые
# плавятся в тигле; боксит, уранинит и химические руды пойдут своими цепочками.

- type: dystopiaCrushRecipe
  id: DystopiaCrushedHematite
  input: SteelOre
  output: DystopiaCrushedHematite1
  amount: 2

