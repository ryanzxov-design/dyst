# Dystopia: дуговая сталеплавильная печь (ДСП), 3×3. Плавит как тигель (DystopiaCrucible), греется от сети,
# сама снимает шлак и разливает в подведённый к корпусу литейный желоб только выбранный в меню сплав.
# Самостоятельная сущность, без parent. Числа — в полях компонентов (Content.Shared/_Dystopia/Industry/).

- type: entity
  id: DystopiaArcFurnace
  name: electric arc furnace
  description: "A big steel-making furnace: three graphite electrodes strike arcs into the charge. Load ore and scrap, switch it on, choose the alloy to tap: it skims the slag itself and pours only that alloy into the attached casting channel."
  placement:
    mode: SnapgridCenter
  components:
  - type: DystopiaParticleEmitter   # частицы (gen_particles.py)
    emitters:
    # вспышки дуги
    - rate: 40
      lifetime: 0.05,0.18
      speed: 0.5,2.5
      direction: 0
      spread: 360
      alignToVelocity: false
      inheritVelocity: 0
      drift: 0,0
      drag: 3.0
      jitter: 0.6
      size: 1,1
      additive: true
      flicker: 0.8
      activeWhen: enum.DystopiaArcFurnaceVisuals.Working
      colors:
      - "#FFFFFFFF"
      - "#C8E4FFE0"
      - "#78BEE180"
      - "#3E6E9600"
    # искры, летят вверх
    - rate: 14
      lifetime: 0.6,1.2
      speed: 0.3,0.8
      direction: 0
      spread: 80
      alignToVelocity: false
      inheritVelocity: 0
      drift: 0,0.5
      drag: 0.8
      jitter: 0.8
      size: 1,1
      additive: true
      flicker: 0.5
      activeWhen: enum.DystopiaArcFurnaceVisuals.Working
      colors:
      - "#FFD27AFF"
      - "#FF8A2AC8"
      - "#C0401A00"
    # дым
    - rate: 8
      lifetime: 1.8,3.0
      speed: 0.1,0.3
      direction: 0
      spread: 50
      alignToVelocity: false
      inheritVelocity: 0
      drift: 0,0.35
      drag: 0.6
      jitter: 1.0
      size: 3,5
      additive: false
      activeWhen: enum.DystopiaArcFurnaceVisuals.Working
      colors:
      - "#4A484400"
      - "#4A484470"
      - "#4A484440"
      - "#4A484400"
    # дымок над раскалённым
    - rate: 3
      lifetime: 1.0,1.8
      speed: 0.05,0.2
      direction: 0
      spread: 40
      alignToVelocity: false
      inheritVelocity: 0
      drift: 0,0.3
      drag: 0.5
      jitter: 0.9
      size: 1,3
      additive: false
      activeWhen: enum.DystopiaHeatVisuals.Hot
      colors:
      - "#B0AAA000"
      - "#B0AAA050"
      - "#90898020"
      - "#80787000"
  - type: Transform
    anchored: true
    noRot: true
  - type: Clickable
  - type: InteractionOutline
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-1.45,-1.45,1.45,1.45"   # 3×3 клетки
        density: 3000
        mask: [ MachineMask ]
        layer: [ MachineLayer ]
  - type: Tag
    tags: [ Structure ]
  - type: Sprite
    sprite: _Dystopia/Structures/Industry/arc_furnace.rsi
    noRot: true
    drawdepth: Objects
    layers:
    - state: base
    - state: arcs
      map: [ "enum.DystopiaArcFurnaceVisuals.Working" ]
      shader: unshaded
      visible: false
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.DystopiaArcFurnaceVisuals.Working:
        enum.DystopiaArcFurnaceVisuals.Working:
          True: { visible: true }
          False: { visible: false }
  - type: PointLight
    enabled: false
    radius: 6
    energy: 3
    color: "#C8E0FF"
  - type: AmbientSound
    enabled: false
    volume: -4
    range: 8
    sound:
      path: /Audio/Ambience/Objects/emf_buzz.ogg
  - type: ApcPowerReceiver
    powerLoad: 200
  - type: ExtensionCableReceiver
  - type: ActivatableUI
    key: enum.DystopiaArcFurnaceUiKey.Key
  - type: UserInterface
    interfaces:
      enum.DystopiaArcFurnaceUiKey.Key:
        type: DystopiaArcFurnaceBoundUserInterface
  - type: Solution
    id: crucible
    solution:
      maxVol: 1500
      canReact: true
  - type: ContainerContainer
    containers:
      dystopia_crucible_charge: !type:Container {}
      dystopia_arc_slag: !type:Container {}
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 800
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:EmptyAllContainersBehaviour
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 10
            max: 15
      - !type:DoActsBehavior
        acts: [ Destruction ]
  - type: DystopiaCrucible
    solution: crucible
    chargeContainer: dystopia_crucible_charge
    maxCharge: 10000     # 100 кусков
    meltRate: 500        # пять кусков в секунду
    heatMultiplier: 1
    coolingRate: 0.002
    fallbackAmbient: 293.15
    hotThreshold: 333.15
    glowThreshold: 873.15
    foreignSlag: DystopiaMoltenSlag
    foreignSlagPer100: 5
    slagReagent: DystopiaMoltenSlag
    slagLump: DystopiaSlag1
    slagPerLump: 5
    updateInterval: 0.5
  - type: DystopiaArcFurnace
    maxTemperature: 2073.15   # 1800 °C
    heatRate: 30
    powerLoad: 15000
    idlePowerLoad: 200
    updateInterval: 1
    pourAmount: 100           # за раз
    slagContainer: dystopia_arc_slag
    slagCapacity: 120
    footprint: 1              # 3×3
    castable:
    - DystopiaMoltenGlass
    - DystopiaMoltenSteel
    - DystopiaMoltenIron
    - DystopiaMoltenCastIron
    - DystopiaMoltenStainlessSteel
    - DystopiaMoltenFerrochrome
    - DystopiaMoltenCopper
    - DystopiaMoltenBrass
    - DystopiaMoltenBronze
    - DystopiaMoltenAluminium
    - DystopiaMoltenZinc
    - DystopiaMoltenTin
    - DystopiaMoltenLead
    - DystopiaMoltenSolder
    - DystopiaMoltenGold
    - DystopiaMoltenSilver
    - DystopiaMoltenUranium
