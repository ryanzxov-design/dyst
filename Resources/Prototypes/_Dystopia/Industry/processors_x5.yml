# Dystopia: ступень ×5 переработки металлов. Молотая руда (из мельницы) обогащается тремя путями:
# флотация — халькопирит, сфалерит, галенит, аргентит, касситерит (2 горсти молотой + 20 воды + 1 флотореагента →
# 5 флотоконцентрата + песок; у полиметаллических руд — партия ×4 с попутным концентратом);
# магнитная сепарация — гематит, хромит (2 горсти → 5 магнитного концентрата + песок, всухую);
# амальгамация — золото (2 горсти + 10 воды + 2 ртути → 5 амальгамы + песок; ртуть в тигле выкипает).
# Машины ×5. Флотомашины и амальгамационная бочка — с баком (вода и реагенты в одном баке, можно по трубам
# через жидкостный экспортер). Самостоятельные сущности, без parent.

- type: entity
  id: DystopiaFlotationCell
  name: flotation cell
  description: "An agitated tank blown through with air. Fill its tank with water and flotation reagent and load ore flour: ore grains float up as froth and are skimmed off as concentrate."
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
    noRot: true
  - type: Clickable
  - type: InteractionOutline
  - type: GravityAffected
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 250
        mask: [ MachineMask ]
        layer: [ MachineLayer ]
  - type: Pullable
  - type: Anchorable
    delay: 3
  - type: Tag
    tags: [ Structure ]
  - type: Sprite
    sprite: _Dystopia/Structures/Industry/flotation_cell.rsi
    noRot: true
    drawdepth: Objects
    layers:
    - state: icon
      map: [ "enum.DystopiaProcessorVisuals.Running" ]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.DystopiaProcessorVisuals.Running:
        enum.DystopiaProcessorVisuals.Running:
          True: { state: running }
          False: { state: icon }
  - type: ApcPowerReceiver
    powerLoad: 1500
  - type: ExtensionCableReceiver
  - type: AmbientSound
    enabled: false
    volume: -6
    range: 5
    sound:
      path: /Audio/Ambience/Objects/crushing.ogg
  - type: Solution
    id: tank
    solution:
      maxVol: 400
  - type: RefillableSolution   # воду — ведром или из цистерны
    solution: tank
  - type: DrainableSolution
    solution: tank
  - type: ContainerContainer
    containers:
      dystopia_processor_input: !type:Container {}
      dystopia_processor_output: !type:Container {}
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:EmptyAllContainersBehaviour
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 2
            max: 4
      - !type:DoActsBehavior
        acts: [ Destruction ]
  - type: DystopiaProcessor
    group: Flotation
    container: dystopia_processor_input
    capacity: 40
    batchesPerCycle: 1
    cycleTime: 4
    manual: false
    requireAnchored: true
    outputContainer: dystopia_processor_output
    outputCapacity: 120
    tank: tank
    cycleSound:
      path: /Audio/Effects/Fluids/splash.ogg
      params:
        volume: -6
    insertSound:
      path: /Audio/Effects/stonedoor_openclose.ogg
      params:
        volume: -8

- type: entity
