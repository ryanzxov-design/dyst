      colors:
      - "#FFB050C0"
      - "#E0602080"
      - "#80200000"
    # дымок над раскалённым
    - rate: 2
      lifetime: 1.0,1.8
      speed: 0.05,0.2
      direction: 0
      spread: 40
      alignToVelocity: false
      inheritVelocity: 0
      drift: 0,0.3
      drag: 0.5
      jitter: 0.25
      size: 1,3
      additive: false
      activeWhen: enum.DystopiaForgeVisuals.Lit
      colors:
      - "#B0AAA000"
      - "#B0AAA050"
      - "#90898020"
      - "#80787000"
  - type: Transform
    anchored: true
    noRot: true
  - type: Clickable
  - type: InteractionOutline
  - type: GravityAffected
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.35"
        density: 1000
        mask: [ TableMask ]
        layer: [ TableLayer ]
      # Нежёсткая область сверху: по ней ItemPlacer замечает поставленный тигель
      itemcollide:
        shape: !type:PhysShapeAabb
          bounds: "-0.35,-0.3,0.35,0.45"
        layer: [ HighImpassable ]
        hard: false
  - type: Tag
    tags: [ Structure ]
  - type: Sprite
    noRot: true
    drawdepth: Objects
    layers:
    - sprite: _Dystopia/Structures/Industry/forge_electric.rsi
      state: base
    - sprite: _Dystopia/Structures/Industry/forge_electric.rsi
      state: coils
      map: [ "enum.DystopiaForgeVisuals.Lit" ]
      shader: unshaded
      visible: false
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.DystopiaForgeVisuals.Lit:
        enum.DystopiaForgeVisuals.Lit:
          True: { visible: true }
          False: { visible: false }
  - type: PointLight
    enabled: false
    radius: 4
    energy: 2.5
    color: "#FF8A30"
  - type: AmbientSound
    enabled: false
    volume: -6
    range: 5
    sound:
      path: /Audio/Ambience/Objects/emf_buzz.ogg
  - type: ApcPowerReceiver
    powerLoad: 50
  - type: ExtensionCableReceiver
  - type: ItemPlacer
    maxEntities: 1
    whitelist:
      components: [ DystopiaCrucible ]
  - type: PlaceableSurface
    placeCentered: true
    positionOffset: 0, 0.3
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/break_stone.ogg
      - !type:DoActsBehavior
        acts: [ Destruction ]
  - type: DystopiaForge
    electric: true
    fuelMaterials: {}
    baseMaxTemperature: 1973.15   # 1700 °C без мехов
    bellowsMaxTemperature: 1973.15
    heatRate: 36            # K в секунду — втрое быстрее угольного
    powerLoad: 4000         # Вт, пока включён
    idlePowerLoad: 50
    updateInterval: 0.5
    mountedPrototype: DystopiaForgeElectricLargeCrucible

