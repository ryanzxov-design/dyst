- type: entity
  id: DystopiaForgeHeaterKit
  name: tubular heater kit
  description: A bundle of tubular electric heaters with terminals. Click a forge with it to turn it into an electric forge.
  components:
  - type: Construction   # крафт (gen_crafts.py)
    graph: DystopiaForgeHeaterKitCraft
    node: done
  - type: Item
    size: Normal
    sprite: _Dystopia/Objects/Industry/heater_kit.rsi
  - type: Animateable
  - type: Clickable
  - type: InteractionOutline
  - type: MovedByPressure
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Effects/drop.ogg
      params:
        volume: 2
  - type: CollisionWake
  - type: GravityAffected
  - type: Physics
    bodyType: Dynamic
    fixedRotation: false
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.25,-0.25,0.25,0.25"
        density: 20
        mask: [ ItemMask ]
        restitution: 0.3
        friction: 0.2
  - type: Sprite
    drawdepth: Items
    noRot: false
    sprite: _Dystopia/Objects/Industry/heater_kit.rsi
    state: icon
  - type: Pullable
  - type: Rotatable
    increment: 30
  - type: Damageable
  - type: Injurable
    damageContainer: Inorganic
  - type: Appearance
  - type: PhysicalComposition
