# SPDX-License-Identifier: AGPL-3.0-or-later
# Dystopia: мастерская (Промышленность, этап 3): горн с большим тиглем, литейные желоба, литейный стол со сменными
# формами ×1/×10. Выход по-прежнему 1:1 — мастерская даёт объём и скорость. Самостоятельные сущности, без parent.
# Числа — в полях компонентов (Content.Shared/_Dystopia/Industry/).

- type: entity
  id: DystopiaCrucibleLarge
  name: large crucible
  description: A heavy graphite crucible with trunnions and a tilting lever. Click a forge with it to set it in; tongs can't lift it.
  components:
  - type: Item
    size: Huge
    sprite: _Dystopia/Objects/Industry/crucible_large.rsi
  - type: MultiHandedItem   # холодный — носят двумя руками
  - type: Animateable
  - type: Clickable
  - type: InteractionOutline
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Effects/metal_thud1.ogg
      params:
        volume: 2
  - type: DamageOnHighSpeedImpact
    damage:
      types:
        Blunt: 10
    soundHit:
      collection: MetalThud
  - type: CollisionWake
  - type: GravityAffected
  - type: Physics
    bodyType: Dynamic
    fixedRotation: false
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.35,-0.35,0.35,0.35"
        density: 80
        mask: [ ItemMask ]
        restitution: 0.1
        friction: 0.6
  - type: Sprite
    drawdepth: Items
    noRot: true
    sprite: _Dystopia/Objects/Industry/crucible_large.rsi
    layers:
    - state: icon
    - state: fill-1
      map:
      - enum.SolutionContainerLayers.Fill
      visible: false
      shader: unshaded
  - type: Pullable
  - type: DamageExaminable
  - type: Damageable
  - type: Injurable
    damageContainer: Inorganic
  - type: Appearance
  - type: PhysicalComposition
    materialComposition:
      DystopiaCastIron: 200
  - type: PointLight
    enabled: false
    radius: 2
    energy: 2
    color: "#FF7A2A"
  - type: DystopiaHotItem
    burnDamage:
      types:
        Heat: 6
    checkInterval: 1
  - type: DystopiaForgeMountable
    mounted: DystopiaForgeLargeCrucible
    delay: 4
  - type: Solution
    id: crucible
    solution:
      maxVol: 400
      canReact: true
  - type: RefillableSolution
    solution: crucible
  - type: DrainableSolution
    solution: crucible
  - type: SolutionContainerVisuals
    maxFillLevels: 4
    fillBaseName: fill-
  - type: ContainerContainer
    containers:
      dystopia_crucible_charge: !type:Container {}
  - type: Reactive   # вода в боевом режиме — закалка
    groups:
      Extinguish: [ Touch ]
  - type: DystopiaQuenchable
    solution: crucible
    coolants:
      Water: 4      # K на единицу: большой тигель держит жар дольше малого
      Ice: 6
    sound:
      path: /Audio/Effects/sizzle.ogg
  - type: DystopiaCrucible
    solution: crucible
    chargeContainer: dystopia_crucible_charge
    maxCharge: 3000      # 30 кусков: втрое больше малого
    meltRate: 200        # плавит два куска в секунду
    heatMultiplier: 0.5  # греется вдвое дольше малого
    coolingRate: 0.003
    fallbackAmbient: 293.15
    hotThreshold: 333.15
    glowThreshold: 873.15
    foreignSlag: DystopiaMoltenSlag
    foreignSlagPer100: 5
    slagReagent: DystopiaMoltenSlag
    slagLump: DystopiaSlag1
    slagPerLump: 5
    updateInterval: 0.5

- type: entity
  id: DystopiaForgeLargeCrucible
  name: forge with a large crucible
  description: A brick forge with a large crucible set into it. Feed the firebox, light it, load the crucible, tilt it to pour into the attached casting channel.
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
    noRot: true
  - type: Clickable
  - type: InteractionOutline
  - type: GravityAffected
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.35"
        density: 1000
        mask: [ TableMask ]
        layer: [ TableLayer ]
  - type: Tag
    tags: [ Structure ]
  - type: Sprite
    noRot: true
    drawdepth: Objects
    layers:
    - sprite: _Dystopia/Structures/Industry/forge.rsi
      state: base
    - sprite: _Dystopia/Structures/Industry/forge.rsi
      state: fire
      map: [ "enum.DystopiaForgeVisuals.Lit" ]
      shader: unshaded
      visible: false
    - sprite: _Dystopia/Structures/Industry/forge.rsi
      state: fire_bellows
      map: [ "enum.DystopiaForgeVisuals.Bellows" ]
      shader: unshaded
      visible: false
    - sprite: _Dystopia/Objects/Industry/crucible_large.rsi
      state: icon
      offset: "0,0.25"
    - sprite: _Dystopia/Objects/Industry/crucible_large.rsi
      state: fill-1
      offset: "0,0.25"
      map: [ "enum.SolutionContainerLayers.Fill" ]
      visible: false
      shader: unshaded
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.DystopiaForgeVisuals.Lit:
        enum.DystopiaForgeVisuals.Lit:
          True: { visible: true }
          False: { visible: false }
      enum.DystopiaForgeVisuals.Bellows:
        enum.DystopiaForgeVisuals.Bellows:
          True: { visible: true }
          False: { visible: false }
  - type: PointLight
    enabled: false
    radius: 4
    energy: 2.5
    color: "#FF8A30"
  - type: AmbientSound
    enabled: false
    volume: -6
    range: 5
    sound:
      path: /Audio/Ambience/Objects/fireplace.ogg
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/break_stone.ogg
      - !type:SpawnEntitiesBehavior
        spawn:
          DystopiaCrucibleLarge:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ Destruction ]
  - type: DystopiaForge
    fuelMaterials:
      Coal: 120
      Wood: 45
    maxFuel: 900
    baseMaxTemperature: 1373.15
    bellowsMaxTemperature: 1973.15
    heatRate: 12
    bellowsFuelMultiplier: 2
    updateInterval: 0.5
  - type: DystopiaMountedCrucible
    forge: DystopiaForge
    item: DystopiaCrucibleLarge
    delay: 4
  - type: DystopiaTiltPour
    delay: 2
    pourSound:
      path: /Audio/Effects/Fluids/glug.ogg
  - type: Solution
    id: crucible
    solution:
      maxVol: 400
      canReact: true
  - type: RefillableSolution
    solution: crucible
  - type: DrainableSolution
    solution: crucible
  - type: SolutionContainerVisuals
    maxFillLevels: 4
    fillBaseName: fill-
  - type: ContainerContainer
    containers:
      dystopia_crucible_charge: !type:Container {}
  - type: Reactive   # вода в боевом режиме — закалка
    groups:
      Extinguish: [ Touch ]
  - type: DystopiaQuenchable
    solution: crucible
    coolants:
      Water: 4      # K на единицу: большой тигель держит жар дольше малого
      Ice: 6
    sound:
      path: /Audio/Effects/sizzle.ogg
  - type: DystopiaCrucible
    solution: crucible
    chargeContainer: dystopia_crucible_charge
    maxCharge: 3000      # 30 кусков: втрое больше малого
    meltRate: 200        # плавит два куска в секунду
    heatMultiplier: 0.5  # греется вдвое дольше малого
    coolingRate: 0.003
    fallbackAmbient: 293.15
    hotThreshold: 333.15
    glowThreshold: 873.15
    foreignSlag: DystopiaMoltenSlag
    foreignSlagPer100: 5
    slagReagent: DystopiaMoltenSlag
    slagLump: DystopiaSlag1
    slagPerLump: 5
    updateInterval: 0.5

- type: entity
  id: DystopiaCastingChannelStraight
  name: casting channel
  description: A clay-lined runner for molten metal. Molten metal poured into the network runs to the casting tables its openings lead to.
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Clickable
  - type: InteractionOutline
  - type: Physics
    bodyType: Static
  - type: Sprite
    sprite: _Dystopia/Structures/Industry/casting_channel.rsi
    noRot: false   # поворачивается вместе с желобом
    drawdepth: FloorObjects
    layers:
    - state: straight
    - state: straight-flow
      map: [ "enum.DystopiaCastingChannelVisuals.Flowing" ]
      shader: unshaded
      visible: false
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.DystopiaCastingChannelVisuals.Flowing:
        enum.DystopiaCastingChannelVisuals.Flowing:
          True: { visible: true }
          False: { visible: false }
  - type: Construction
    graph: DystopiaCastingChannel
    node: straight
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 80
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/break_stone.ogg
      - !type:DoActsBehavior
        acts: [ Destruction ]
  - type: DystopiaCastingChannel
    openings: [ North, South ]   # при повороте 0: North — вверх, South — вниз
    maxSegments: 64
    flowVisualTime: 2
    flowSound:
      path: /Audio/Effects/Fluids/glug.ogg
      params:
        volume: -2

