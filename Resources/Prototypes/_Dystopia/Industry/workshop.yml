- type: entity
  id: DystopiaCastingTable
  name: casting table
  description: A cast-iron table with a sand bed and a sprue cup. Put a casting form in it and pour metal through a casting channel or straight from a crucible.
  placement:
    mode: SnapgridCenter
  components:
  - type: DystopiaParticleEmitter   # частицы (gen_particles.py)
    emitters:
    # дымок над раскалённым
    - rate: 3
      lifetime: 1.0,1.8
      speed: 0.05,0.2
      direction: 0
      spread: 40
      alignToVelocity: false
      inheritVelocity: 0
      drift: 0,0.3
      drag: 0.5
      jitter: 0.3
      size: 1,3
      additive: false
      activeWhen: enum.DystopiaHeatVisuals.Hot
      colors:
      - "#B0AAA000"
      - "#B0AAA050"
      - "#90898020"
      - "#80787000"
    # светящиеся крупинки окалины
    - rate: 2
      lifetime: 0.4,0.9
      speed: 0.05,0.2
      direction: 0
      spread: 90
      alignToVelocity: false
      inheritVelocity: 0
      drift: 0,0.2
      drag: 0.6
      jitter: 0.3
      size: 1,1
      additive: true
      flicker: 0.6
      activeWhen: enum.DystopiaHeatVisuals.Hot
      colors:
      - "#FFB050C0"
      - "#E0602080"
      - "#80200000"
  - type: Transform
    anchored: true
    noRot: true
  - type: Clickable
  - type: InteractionOutline
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.35"
        density: 500
        mask: [ TableMask ]
        layer: [ TableLayer ]
  - type: Sprite
    sprite: _Dystopia/Structures/Industry/casting_table.rsi
    noRot: true
    drawdepth: Objects
    layers:
    - state: base
    - state: form-ingot1
      map: [ "enum.DystopiaCastingTableVisuals.Form" ]
      visible: false
    - state: fill-1
      map: [ "enum.SolutionContainerLayers.Fill" ]
      visible: false
      shader: unshaded
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.DystopiaCastingTableVisuals.Form:
        enum.DystopiaCastingTableVisuals.Form:
          none: { visible: false }
          ingot1: { visible: true, state: form-ingot1 }
          ingot10: { visible: true, state: form-ingot10 }
          sheet1: { visible: true, state: form-sheet1 }
          sheet10: { visible: true, state: form-sheet10 }
          rod1: { visible: true, state: form-rod1 }
          rod10: { visible: true, state: form-rod10 }
  - type: Solution
    id: mould
    solution:
      maxVol: 0      # вместимость задаёт вставленная форма
      canReact: true
  - type: RefillableSolution
    solution: mould
  - type: SolutionContainerVisuals
    maxFillLevels: 1
    fillBaseName: fill-
  - type: ItemSlots
    slots:
      dystopia_casting_form:
        name: dystopia-casting-table-slot
        swap: false
        whitelist:
          components: [ DystopiaCastingForm ]
  - type: ContainerContainer
    containers:
      dystopia_casting_form: !type:ContainerSlot {}
      dystopia_casting_output: !type:Container {}
  - type: Reactive   # вода в боевом режиме — закалка
    groups:
      Extinguish: [ Touch ]
  - type: DystopiaQuenchable
    solution: mould
    coolants:
      Water: 20     # K на единицу: стол массивнее изложницы
      Ice: 30
    sound:
      path: /Audio/Effects/sizzle.ogg
  - type: Construction
    graph: DystopiaCastingTable
    node: table
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:EmptyAllContainersBehaviour
      - !type:DoActsBehavior
        acts: [ Destruction ]
  - type: DystopiaMould
    formSlot: dystopia_casting_form
    outputContainer: dystopia_casting_output   # отливки — внутри стола (рукой, ПКМ или извлекателем)
    solution: mould
    coolingRate: 0.006   # больше металла — остывает дольше
    fallbackAmbient: 293.15
    hotThreshold: 333.15
    updateInterval: 0.5

