# SPDX-License-Identifier: AGPL-3.0-or-later
# Dystopia: крафты производства (первый заход, без нефти). Предметы — в руки из меню. Постройки — по
# призраку: первый ресурс (у сложных машин — чертёж) закладывает недострой, остальные ресурсы вставляют по
# одному, последний превращает недострой в машину. Разборка ломом возвращает всё. Цены — crafts_table.py,
# генератор gen_crafts.py.

# --- графы

- type: constructionGraph
  id: DystopiaForgeCraft
  start: start
  graph:
  - node: start
    edges:
    - to: s1
      steps:
      - material: DystopiaOreClay
        amount: 6
        doAfter: 4.0

  - node: s1
    entity: DystopiaSiteForge
    edges:
    - to: done
      steps:
      - material: DystopiaOreLimestone
        amount: 6
        doAfter: 4.0
    - to: start
      completed:
      - !type:SpawnPrototype
        prototype: DystopiaOreClay1
        amount: 6
      - !type:DeleteEntity
      steps:
      - tool: Prying
        doAfter: 2

  - node: done
    entity: DystopiaForge
    edges:
    - to: start
      completed:
      - !type:SpawnPrototype
        prototype: DystopiaOreClay1
        amount: 6
      - !type:SpawnPrototype
        prototype: DystopiaOreLimestone1
        amount: 6
      - !type:DeleteEntity
      steps:
      - tool: Prying
        doAfter: 4

