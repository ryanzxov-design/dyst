- type: dystopiaSmeltable
  id: DystopiaFerrochrome
  products:
    DystopiaMoltenFerrochrome: 10

# Пласталь: плазма выгорает в шлак
- type: dystopiaSmeltable
  id: Plasteel
  products:
    DystopiaMoltenSteel: 7
    DystopiaMoltenSlag: 3

# Дроблёная руда (×2): горсть плавится как целый кусок руды.
- type: dystopiaSmeltable
  id: DystopiaCrushedHematite
  meltTemperature: 1823.15  # 1550 °C, как у целой руды
  products:
    DystopiaMoltenIron: 10
    DystopiaMoltenSlag: 5

- type: dystopiaSmeltable
  id: DystopiaCrushedChalcopyrite
  meltTemperature: 1473.15  # 1200 °C, как у целой руды
  products:
    DystopiaMoltenCopper: 10
    DystopiaMoltenSlag: 5

