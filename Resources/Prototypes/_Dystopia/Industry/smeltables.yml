  meltTemperature: 1343.15  # 1070 °C, как у целой руды
  products:
    DystopiaMoltenGold: 10
    DystopiaMoltenSlag: 5

- type: dystopiaSmeltable
  id: DystopiaCrushedArgentite
  meltTemperature: 1273.15  # 1000 °C, как у целой руды
