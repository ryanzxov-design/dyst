# Dystopia: готовые многоблоки разбираются ломом обратно в секции каркаса (gen_oil4b.py).

- type: constructionGraph
  id: DystopiaArcFurnaceAssembly
  start: start
  graph:
  - node: start

  - node: done
    entity: DystopiaArcFurnace
    edges:
    - to: start
      completed:
      - !type:EmptyContainer
        container: dystopia_crucible_charge
      - !type:EmptyContainer
        container: dystopia_arc_slag
      - !type:DystopiaMultiblockDisassemble
      - !type:DeleteEntity
      steps:
      - tool: Prying
        doAfter: 10

