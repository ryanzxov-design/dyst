# Dystopia: дробилки руды (Промышленность, этап 3, ступень ×2). Кусок руды → две горсти дроблёной руды
# (рецепты — crush_recipes.yml), горсть плавится в тигле в слиток. Самостоятельные сущности, без parent.
# Числа — в полях DystopiaCrusher (Content.Shared/_Dystopia/Industry/DystopiaCrusherComponents.cs).

- type: entity
  id: DystopiaHandCrusher
  name: hand crusher
  description: A cast-iron jaw crusher with a flywheel. Load ore and turn the crank; every turn crushes one chunk.
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
    noRot: true
  - type: Clickable
  - type: InteractionOutline
  - type: GravityAffected
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.4,-0.45,0.4,0.3"
        density: 200
        mask: [ MachineMask ]
        layer: [ MidImpassable, LowImpassable ]
  - type: Pullable
  - type: Anchorable
    delay: 2
  - type: Tag
    tags: [ Structure ]
  - type: Sprite
    sprite: _Dystopia/Structures/Industry/hand_crusher.rsi
    noRot: true
    drawdepth: Objects
    layers:
    - state: icon
      map: [ "enum.DystopiaCrusherVisuals.Running" ]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.DystopiaCrusherVisuals.Running:
        enum.DystopiaCrusherVisuals.Running:
          True: { state: running }
          False: { state: icon }
  - type: ContainerContainer
    containers:
      dystopia_crusher_input: !type:Container {}
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 150
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:EmptyAllContainersBehaviour
      - !type:SpawnEntitiesBehavior
        spawn:
          DystopiaIngotCastIron1:
            min: 1
            max: 2
      - !type:DoActsBehavior
        acts: [ Destruction ]
  - type: DystopiaCrusher
    container: dystopia_crusher_input
    capacity: 10        # кусков руды в воронке
    oresPerCycle: 1
    cycleTime: 5        # секунд крутить ворот на один кусок
    manual: true
    requireAnchored: true
    cycleSound:
      path: /Audio/Effects/break_stone.ogg
      params:
        volume: -4
    insertSound:
      path: /Audio/Effects/stonedoor_openclose.ogg
      params:
        volume: -8

