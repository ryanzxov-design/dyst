- type: entity
  id: DystopiaConeCrusher
  name: cone crusher
  description: An industrial cone crusher. Power-hungry, but crushes three chunks of ore per cycle and works fast.
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
    noRot: true
  - type: Clickable
  - type: InteractionOutline
  - type: GravityAffected
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 300
        mask: [ MachineMask ]
        layer: [ MachineLayer ]
  - type: Anchorable
    delay: 3
  - type: Pullable
  - type: Tag
    tags: [ Structure ]
  - type: Sprite
    sprite: _Dystopia/Structures/Industry/cone_crusher.rsi
    noRot: true
    drawdepth: Objects
    layers:
    - state: icon
      map: [ "enum.DystopiaCrusherVisuals.Running" ]
    - state: unlit
      map: [ "enum.PowerDeviceVisualLayers.Powered" ]
      shader: unshaded
      visible: false
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.DystopiaCrusherVisuals.Running:
        enum.DystopiaCrusherVisuals.Running:
          True: { state: running }
          False: { state: icon }
      enum.PowerDeviceVisuals.Powered:
        enum.PowerDeviceVisualLayers.Powered:
          True: { visible: true }
          False: { visible: false }
  - type: AmbientSound
    enabled: false
    volume: -3
    range: 7
    sound:
      path: /Audio/Ambience/Objects/crushing.ogg
  - type: ApcPowerReceiver
    powerLoad: 3000
  - type: ExtensionCableReceiver
  - type: ContainerContainer
    containers:
      dystopia_crusher_input: !type:Container {}
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:EmptyAllContainersBehaviour
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 4
            max: 6
      - !type:DoActsBehavior
        acts: [ Destruction ]
  - type: DystopiaCrusher
    container: dystopia_crusher_input
    capacity: 90
    oresPerCycle: 3     # 7 кусков — 3 цикла: 3 + 3 + 1
    cycleTime: 2
    manual: false
    requireAnchored: true
    cycleSound:
      path: /Audio/Effects/metal_crunch.ogg
      params:
        volume: -6
    insertSound:
      path: /Audio/Effects/stonedoor_openclose.ogg
      params:
        volume: -8
