    - trigger: !type:DamageTrigger
        damage: 250
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:EmptyContainersBehaviour
        containers: [ dystopia_processor_input ]
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 2
            max: 4
      - !type:DoActsBehavior
        acts: [ Destruction ]
  - type: DystopiaProcessor
    group: VacuumDistillation
    container: dystopia_processor_input
    capacity: 0
    batchesPerCycle: 1
    cycleTime: 4
    manual: false
    requireAnchored: true
