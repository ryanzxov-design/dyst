# SPDX-License-Identifier: AGPL-3.0-or-later
# Dystopia: машины переработки руды (Промышленность, этап 3). Дробилки (Crusher, ×2): кусок руды → 2 горсти
# дроблёной. Мельницы (Mill, ×3): дроблёная → молотая 1:1. Обогатители (Concentrator, ×3): 2 горсти молотой + вода →
# 3 горсти концентрата + песок. Рецепты — crush_recipes.yml, grind_recipes.yml. Самостоятельные сущности, без parent.
# Числа — в полях DystopiaProcessor (Content.Shared/_Dystopia/Industry/DystopiaProcessorComponents.cs).
# Ручные — продукция на пол; электрические — во внутренний контейнер (выгрузка кликом, ПКМ или конвейерным
# извлекателем).

- type: entity
  id: DystopiaHandCrusher
  name: hand crusher
  description: "A cast-iron jaw crusher with a flywheel. Load ore and turn the crank; every turn crushes one chunk."
  placement:
    mode: SnapgridCenter
  components:
  - type: Construction   # крафт (gen_crafts.py)
    graph: DystopiaHandCrusherCraft
    node: done
  - type: DystopiaParticleEmitter   # частицы (gen_particles.py)
    emitters:
    # рудная пыль
    - rate: 10
      lifetime: 0.5,1.1
      speed: 0.15,0.5
      direction: 0
      spread: 360
      alignToVelocity: false
      inheritVelocity: 0
      drift: 0,-0.2
      drag: 1.2
      jitter: 0.35
      size: 1,2
      additive: false
      activeWhen: enum.DystopiaProcessorVisuals.Running
      colors:
      - "#8A7E6E00"
      - "#8A7E6EA0"
      - "#8A7E6E50"
      - "#8A7E6E00"
  - type: Transform
    anchored: true
    noRot: true
  - type: Clickable
  - type: InteractionOutline
  - type: GravityAffected
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.4,-0.45,0.4,0.3"
        density: 200
        mask: [ MachineMask ]
        layer: [ MidImpassable, LowImpassable ]
  - type: Pullable
  - type: Anchorable
    delay: 2
  - type: Tag
    tags: [ Structure ]
  - type: Sprite
    sprite: _Dystopia/Structures/Industry/hand_crusher.rsi
    noRot: true
    drawdepth: Objects
    layers:
    - state: icon
      map: [ "enum.DystopiaProcessorVisuals.Running" ]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.DystopiaProcessorVisuals.Running:
        enum.DystopiaProcessorVisuals.Running:
          True: { state: running }
          False: { state: icon }
  - type: ContainerContainer
    containers:
      dystopia_processor_input: !type:Container {}
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 150
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:EmptyAllContainersBehaviour
      - !type:SpawnEntitiesBehavior
        spawn:
          DystopiaIngotCastIron1:
            min: 1
            max: 2
      - !type:DoActsBehavior
        acts: [ Destruction ]
  - type: DystopiaProcessor
    group: Crusher
    container: dystopia_processor_input
    capacity: 10
    batchesPerCycle: 1
    cycleTime: 5
    manual: true
    requireAnchored: true
    workVerb: dystopia-processor-work-crank
    cycleSound:
      path: /Audio/Effects/break_stone.ogg
      params:
        volume: -6
    insertSound:
      path: /Audio/Effects/stonedoor_openclose.ogg
      params:
        volume: -8

