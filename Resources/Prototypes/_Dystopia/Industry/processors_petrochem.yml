# Dystopia: нефть, шаг 3 — нефтехимия. Генератор gen_petrochem.py.
# Машины нефтехимии: крекинг-установка (Cracking), реактор полимеризации (Polymerization), вулканизационный пресс
# (Vulcanization), химическая установка (DystopiaChemUnit). Рецепты — petrochem_recipes.yml. Баки не реагируют.
# Самостоятельные сущности, без parent.

- type: entity
  id: DystopiaCrackingUnit
  name: cracking unit
  description: "A reactor with a bed of alumina catalyst over an electric furnace. Splits fuel oil and diesel into gasoline and liquefied gases; turns alcohol into butadiene. Load alumina into it; everything comes out mixed into the product tank."
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
    noRot: true
  - type: Clickable
  - type: InteractionOutline
  - type: GravityAffected
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 250
        mask: [ MachineMask ]
        layer: [ MachineLayer ]
  - type: Pullable
  - type: Anchorable
    delay: 2
  - type: Tag
    tags: [ Structure ]
  - type: Sprite
    sprite: _Dystopia/Structures/Industry/cracking_unit.rsi
    noRot: true
    drawdepth: Objects
    layers:
    - state: icon
      map: [ "enum.DystopiaProcessorVisuals.Running" ]
    - state: unlit
      map: [ "enum.PowerDeviceVisualLayers.Powered" ]
      shader: unshaded
      visible: false
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.DystopiaProcessorVisuals.Running:
        enum.DystopiaProcessorVisuals.Running:
          True: { state: running }
          False: { state: icon }
      enum.PowerDeviceVisuals.Powered:
        enum.PowerDeviceVisualLayers.Powered:
          True: { visible: true }
          False: { visible: false }
  - type: ApcPowerReceiver
    powerLoad: 8000
  - type: ExtensionCableReceiver
  - type: AmbientSound
    enabled: false
    volume: -6
    range: 5
    sound:
      path: /Audio/Ambience/Objects/vending_machine_hum.ogg
  - type: Solution
    id: tank
    solution:
      maxVol: 400
      canReact: false   # вещества в баке не реагируют между собой
  - type: RefillableSolution   # воду — ведром или из цистерны
    solution: tank
  - type: SolutionManager   # бак продукции
    solutions:
    - DystopiaSolutionCrackingProduct
  - type: DrainableSolution   # сливают готовое
    solution: product
  - type: ContainerContainer
    containers:
      dystopia_processor_input: !type:Container {}
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:EmptyContainersBehaviour
        containers: [ dystopia_processor_input ]
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 3
            max: 5
      - !type:DoActsBehavior
        acts: [ Destruction ]
  - type: DystopiaProcessor
    group: Cracking
    container: dystopia_processor_input
    capacity: 10
    batchesPerCycle: 1
    cycleTime: 10
    manual: false
    requireAnchored: true
    tank: tank
    outputTank: product
    cycleSound:
      path: /Audio/Effects/Fluids/splash.ogg
      params:
        volume: -6
    insertSound:
      path: /Audio/Effects/stonedoor_openclose.ogg
      params:
        volume: -8

