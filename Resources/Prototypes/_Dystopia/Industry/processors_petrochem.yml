- type: entity
  id: DystopiaChemUnit
  name: chemical unit
  description: "A reactor with a heater, a cooler and a row of dosing pumps. Put a container in its slot and pour into the buffer from it: there nothing mixes. Pick what to make; it takes only the right substances in the right proportions and leaves the rest alone."
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
    noRot: true
  - type: Clickable
  - type: InteractionOutline
  - type: GravityAffected
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 250
        mask: [ MachineMask ]
        layer: [ MachineLayer ]
  - type: Pullable
  - type: Anchorable
    delay: 3
  - type: Tag
    tags: [ Structure ]
  - type: Sprite
    sprite: _Dystopia/Structures/Industry/chem_unit.rsi
    noRot: true
    drawdepth: Objects
    layers:
    - state: icon
      map: [ "enum.DystopiaProcessorVisuals.Running" ]
    - state: unlit
      map: [ "enum.PowerDeviceVisualLayers.Powered" ]
      shader: unshaded
      visible: false
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.DystopiaProcessorVisuals.Running:
        enum.DystopiaProcessorVisuals.Running:
          True: { state: running }
          False: { state: icon }
      enum.PowerDeviceVisuals.Powered:
        enum.PowerDeviceVisualLayers.Powered:
          True: { visible: true }
          False: { visible: false }
  - type: ApcPowerReceiver
    powerLoad: 4000
  - type: ExtensionCableReceiver
  - type: AmbientSound
    enabled: false
    volume: -6
    range: 5
    sound:
      path: /Audio/Ambience/Objects/vending_machine_hum.ogg
  - type: Solution   # буфер: вещества не смешиваются и не реагируют
    id: buffer
    solution:
      maxVol: 1000
      canReact: false
  - type: SolutionManager   # бак продукции
    solutions:
    - DystopiaSolutionChemUnitOutput
  # Напрямую ведром не заливают и не сливают: только через слот «Контейнер» в меню или экспортером (в буфер) и
  # импортером (из бака продукции) — DystopiaLiquidDeviceSystem.
  - type: ItemSlots
    slots:
      dystopia_chem_container:
        name: dystopia-chem-unit-slot
        whitelist:
          components:
          - RefillableSolution
          - DrainableSolution
  - type: ContainerContainer
    containers:
      dystopia_chem_container: !type:ContainerSlot
  - type: ActivatableUI   # клик — меню: что производить, буфер, продукция
    key: enum.DystopiaChemUnitUiKey.Key
  - type: UserInterface
    interfaces:
      enum.DystopiaChemUnitUiKey.Key:
        type: DystopiaChemUnitBoundUserInterface
  - type: DystopiaChemUnit
    unitsPerCycle: 20
    cycleTime: 2
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 250
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:EmptyAllContainersBehaviour
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 2
            max: 4
          SheetGlass1:
            min: 1
            max: 2
      - !type:DoActsBehavior
        acts: [ Destruction ]
