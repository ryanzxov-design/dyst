# Dystopia: ручное литьё (Промышленность, этап 3, ручной уровень ×1).
# Формы отливки: сколько расплава на одну отливку и что выходит. Грязный металл (<95%) или
# недолив — брак (кусок шлака). Любой литейный металл льётся в любую форму: залили не в ту — получите
# годные лист или прутья, их можно переплавить обратно.

