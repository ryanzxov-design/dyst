# Dystopia: конвейерные устройства — извлекатель, вставщик, сортировщик (DystopiaConveyorDevice). Вход — позади,
# выход — впереди (куда повёрнуто; при повороте 0 — вниз). Поворачиваются, пока не прикручены. Нужен ток.
# Самостоятельные сущности, без parent.

- type: entity
  id: DystopiaConveyorExtractor
  name: conveyor extractor
  description: "An arm on a hinge: takes items out of the machine, crate or locker behind it and puts them onto the conveyor in front."
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Clickable
  - type: InteractionOutline
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.35,-0.35,0.35,0.35"
        density: 100
        mask: [ TableMask ]
        layer: [ TableLayer ]   # предметы с конвейера проезжают на устройство и забираются с него
  - type: Pullable
  - type: Anchorable
    delay: 1
  - type: Rotatable
    rotateWhileAnchored: false
  - type: Tag
    tags: [ Structure ]
  - type: Sprite
    sprite: _Dystopia/Structures/Industry/conveyor_extractor.rsi
    noRot: false   # поворачивается вместе с устройством: стрелки показывают вход и выходы
    drawdepth: Objects
    layers:
    - state: icon
      map: [ "enum.DystopiaConveyorDeviceVisuals.Working" ]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.DystopiaConveyorDeviceVisuals.Working:
        enum.DystopiaConveyorDeviceVisuals.Working:
          True: { state: working }
          False: { state: icon }
  - type: ActivatableUI   # клик — меню настройки
    key: enum.DystopiaConveyorUiKey.Key
  - type: UserInterface
    interfaces:
      enum.DystopiaConveyorUiKey.Key:
        type: DystopiaConveyorBoundUserInterface
  - type: ApcPowerReceiver
    powerLoad: 150
  - type: ExtensionCableReceiver
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 1
            max: 2
      - !type:DoActsBehavior
        acts: [ Destruction ]
  - type: DystopiaConveyorDevice
    mode: Extract
    interval: 1    # секунд на один перенос
    maxItemsOnTile: 8
    requireAnchored: true

