# Dystopia: неметаллы, шаг 2 — переработка.
# Баки продукции машин: отдельный раствор "product", чтобы готовое не мешалось с тем, что залили.
# Вещества в них не реагируют между собой. Самостоятельные сущности, без parent.

- type: entity
  id: DystopiaSolutionLeachingProduct
  categories: [ HideSpawnMenu ]
  name: product tank
  components:
  - type: Solution
    id: product
    solution:
      maxVol: 600
      canReact: false

