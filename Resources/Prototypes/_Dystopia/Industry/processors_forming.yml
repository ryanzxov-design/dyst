    capacity: 30
    batchesPerCycle: 2
    cycleTime: 3
    manual: false
    requireAnchored: true
    outputContainer: dystopia_processor_output
    outputCapacity: 60
    cycleSound:
      path: /Audio/Effects/metal_crunch.ogg
      params:
        volume: -6
    insertSound:
      path: /Audio/Effects/stonedoor_openclose.ogg
      params:
        volume: -8

