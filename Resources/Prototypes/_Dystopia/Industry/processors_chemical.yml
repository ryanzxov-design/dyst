# Dystopia: металлы без тигля. Обжиговая печь (Roasting): киноварь → ртуть в конденсатор, сподумен → обожжённый.
# Чан выщелачивания (Leaching): боксит + едкий натр + вода → глинозём; уранинит + серная кислота → жёлтый кек
# (плавится в тигле в уран) + радий в бак; обожжённый сподумен + серная кислота → литий в бак.
# Электролизёр (Electrolysis): глинозём → слиток алюминия; каменная соль → натрий, сильвин → калий (хлор — в вытяжку).
# Баки этих машин не реагируют (canReact: false): калий с водой, радий с кислотой не прореагируют внутри.
# Вещества — в бак машины (сливать сосудом через ПКМ или по трубам импортером).
# Самостоятельные сущности, без parent.

- type: entity
  id: DystopiaRoastingFurnace
  name: roasting furnace
  description: "An electric kiln with a condenser. Roasts cinnabar, collecting the mercury in the condenser tank, and roasts spodumene for leaching."
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
    noRot: true
  - type: Clickable
  - type: InteractionOutline
  - type: GravityAffected
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 250
        mask: [ MachineMask ]
        layer: [ MachineLayer ]
  - type: Pullable
  - type: Anchorable
    delay: 2
  - type: Tag
    tags: [ Structure ]
  - type: Sprite
    sprite: _Dystopia/Structures/Industry/roasting_furnace.rsi
    noRot: true
    drawdepth: Objects
    layers:
    - state: icon
      map: [ "enum.DystopiaProcessorVisuals.Running" ]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.DystopiaProcessorVisuals.Running:
        enum.DystopiaProcessorVisuals.Running:
          True: { state: running }
          False: { state: icon }
  - type: ApcPowerReceiver
    powerLoad: 5000
  - type: ExtensionCableReceiver
  - type: AmbientSound
    enabled: false
    volume: -6
    range: 5
    sound:
      path: /Audio/Ambience/Objects/crushing.ogg
  - type: Solution
    id: tank
    solution:
      maxVol: 300
      canReact: false   # вещества в баке не реагируют между собой
  - type: RefillableSolution   # воду — ведром или из цистерны
    solution: tank
  - type: DrainableSolution
    solution: tank
  - type: ContainerContainer
    containers:
      dystopia_processor_input: !type:Container {}
      dystopia_processor_output: !type:Container {}
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 250
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:EmptyAllContainersBehaviour
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 3
            max: 5
      - !type:DoActsBehavior
        acts: [ Destruction ]
  - type: DystopiaProcessor
    group: Roasting
    container: dystopia_processor_input
    capacity: 30
    batchesPerCycle: 2
    cycleTime: 5
    manual: false
    requireAnchored: true
    outputContainer: dystopia_processor_output
    outputCapacity: 60
    tank: tank
    cycleSound:
      path: /Audio/Effects/Fluids/splash.ogg
      params:
        volume: -6
    insertSound:
      path: /Audio/Effects/stonedoor_openclose.ogg
      params:
        volume: -8

