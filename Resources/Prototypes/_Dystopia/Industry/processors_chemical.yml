- type: entity
  id: DystopiaElectrolyzer
  name: electrolytic cell
  description: "A bath of molten salts under heavy current. Turns alumina into aluminium, rock salt into sodium and sylvite into potassium; the chlorine goes up the vent. Extremely power-hungry."
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
    noRot: true
  - type: Clickable
  - type: InteractionOutline
  - type: GravityAffected
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 250
        mask: [ MachineMask ]
        layer: [ MachineLayer ]
  - type: Pullable
  - type: Anchorable
    delay: 2
  - type: Tag
    tags: [ Structure ]
  - type: Sprite
    sprite: _Dystopia/Structures/Industry/electrolyzer.rsi
    noRot: true
    drawdepth: Objects
    layers:
    - state: icon
      map: [ "enum.DystopiaProcessorVisuals.Running" ]
    - state: unlit
      map: [ "enum.PowerDeviceVisualLayers.Powered" ]
      shader: unshaded
      visible: false
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.DystopiaProcessorVisuals.Running:
        enum.DystopiaProcessorVisuals.Running:
          True: { state: running }
          False: { state: icon }
      enum.PowerDeviceVisuals.Powered:
        enum.PowerDeviceVisualLayers.Powered:
          True: { visible: true }
          False: { visible: false }
  - type: ApcPowerReceiver
    powerLoad: 12000
  - type: ExtensionCableReceiver
  - type: AmbientSound
    enabled: false
    volume: -6
    range: 5
    sound:
      path: /Audio/Ambience/Objects/crushing.ogg
  - type: Solution
    id: tank
    solution:
