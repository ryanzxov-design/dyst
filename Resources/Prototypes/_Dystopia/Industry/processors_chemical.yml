- type: entity
  id: DystopiaElectrolyzer
  name: electrolytic cell
  description: "A bath of molten salts under heavy current. Turns alumina into aluminium, rock salt into sodium and sylvite into potassium; the chlorine goes up the vent. Extremely power-hungry."
  placement:
    mode: SnapgridCenter
  components:
  - type: DystopiaParticleEmitter   # частицы (gen_particles.py)
    emitters:
    # искрение на анодах
    - rate: 10
      lifetime: 0.1,0.3
      speed: 0.4,1.2
      direction: 0
      spread: 360
      alignToVelocity: false
      inheritVelocity: 0
      drift: 0,0
      drag: 2.5
      jitter: 0.5
      size: 1,1
      additive: true
      flicker: 0.7
      activeWhen: enum.DystopiaProcessorVisuals.Running
      colors:
      - "#FFFFFFFF"
      - "#C8E4FFC0"
      - "#78BEE100"
    # дым
    - rate: 4
