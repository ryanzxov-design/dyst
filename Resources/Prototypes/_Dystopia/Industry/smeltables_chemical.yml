# Dystopia: металлы без тигля. Обжиговая печь (Roasting): киноварь → ртуть в конденсатор, сподумен → обожжённый.
# Чан выщелачивания (Leaching): боксит + едкий натр + вода → глинозём; уранинит + серная кислота → жёлтый кек
# (плавится в тигле в уран) + радий в бак; обожжённый сподумен + серная кислота → литий в бак.
# Электролизёр (Electrolysis): глинозём → слиток алюминия; каменная соль → натрий, сильвин → калий (хлор — в вытяжку).
# Баки этих машин не реагируют (canReact: false): калий с водой, радий с кислотой не прореагируют внутри.
# Вещества — в бак машины (сливать сосудом через ПКМ или по трубам импортером).
# Жёлтый кек плавится в уран.

- type: dystopiaSmeltable
  id: DystopiaYellowcake
  meltTemperature: 1423.15  # уран плавится при 1132 °C
  products:
    DystopiaMoltenUranium: 10
    DystopiaMoltenSlag: 2
