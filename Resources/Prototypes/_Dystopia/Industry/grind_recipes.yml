# Dystopia: ступень ×3 переработки металлов — мельница (дроблёная → молотая руда 1:1) и обогащение с водой
# (2 горсти молотой → 3 горсти гравитационного концентрата + 1 горсть песка). Концентрат плавится 1:1 с малым шлаком.
# Рецепты мельниц (Mill) и обогатителей (Concentrator).

- type: dystopiaProcessRecipe
  id: DystopiaGrindHematite
  group: Mill
  input: DystopiaCrushedHematite
  output: DystopiaGroundHematite1
  amount: 1

- type: dystopiaProcessRecipe
  id: DystopiaWashHematite
  group: Concentrator
  input: DystopiaGroundHematite
  inputCount: 2
  output: DystopiaConcentrateHematite1
  amount: 3
  byproducts:
    DystopiaSand1: 1   # хвосты
  reagents:
    Water: 10

