  output: DystopiaFuelPelletRawE41
  amount: 2

- type: dystopiaProcessRecipe
  id: DystopiaSinterPelletsE4
  group: Roasting
  input: DystopiaFuelPelletRawE4
  inputCount: 1
  output: DystopiaFuelPelletE41
  amount: 1

- type: dystopiaProcessRecipe
  id: DystopiaPrecipitateUraniumE20   # UF6 + вода + аммиак → диоксид урана (через осадок), HF возвращается
  group: Leaching
  output: DystopiaUraniumDioxideE201
  amount: 1
  reagents:
    DystopiaUF6E20: 10
    Water: 10
