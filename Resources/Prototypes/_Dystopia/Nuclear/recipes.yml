- type: dystopiaProcessRecipe
  id: DystopiaPressPelletsE20
  group: BrickPress
  input: DystopiaUraniumDioxideE20
  inputCount: 1
  output: DystopiaFuelPelletRawE201
  amount: 2

- type: dystopiaProcessRecipe
  id: DystopiaSinterPelletsE20
  group: Roasting
  input: DystopiaFuelPelletRawE20
  inputCount: 1
  output: DystopiaFuelPelletE201
  amount: 1

- type: dystopiaProcessRecipe
  id: DystopiaDrawStainlessTube   # пруток нержавейки → трубка
  group: WireDrawing
  input: DystopiaRodStainlessSteel
  inputCount: 1
  output: DystopiaStainlessTube1
  amount: 1

- type: dystopiaProcessRecipe
  id: DystopiaReduceWeaponUranium   # UF6 90% → слиток оружейного урана
  group: Electrolysis
  output: DystopiaIngotUraniumWeapon1
  amount: 1
  reagents:
    DystopiaUF6E90: 10
  produces:
    DystopiaHydrofluoricAcid: 5

- type: dystopiaProcessRecipe
  id: DystopiaReduceDepletedUranium   # хвосты → слиток обеднённого урана
  group: Electrolysis
  output: DystopiaIngotUraniumDepleted1
  amount: 1
  reagents:
    DystopiaUF6Depleted: 20
  produces:
    DystopiaHydrofluoricAcid: 10
