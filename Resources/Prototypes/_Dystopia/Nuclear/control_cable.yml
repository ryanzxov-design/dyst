# Dystopia: кабель управления (gen_energy3a.py) — своя сеть DystopiaControl: пульт реактора ↔ колонны.
# Компоненты — как у ванильного кабеля ЛЭП низкого напряжения, без питания.

- type: entity
  id: DystopiaCableControl
  name: control cable
  description: "A multicore signal cable. It links a reactor console to the columns: lay it from under the console to under any column. It carries no power."
  placement:
    mode: SnapgridCenter
  components:
  - type: Visibility
    layer: 1
  - type: Cable
    cuttingDelay: 1
    cableDroppedOnCutPrototype: DystopiaCableControlStack1
    cableType: DystopiaControl
  - type: Clickable
  - type: InteractionOutline
  - type: Transform
    anchored: true
    noRot: true
  - type: Physics
    bodyType: Static
    canCollide: false
  - type: Fixtures
  - type: CollideOnAnchor
  - type: Appearance
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 60
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          DystopiaCableControlStack1:
            min: 1
            max: 1
  - type: Damageable
    damageModifierSet: RodMetalMod
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Sprite
    drawdepth: ThinWire
    visible: false
    color: "#7cb8e8"
    sprite: Structures/Power/Cables/lv_cable.rsi
    state: lvcable_0
  - type: SubFloorHide
  - type: CableVis
    node: power
  - type: Icon
    sprite: Structures/Power/Cables/lv_cable.rsi
    state: lvcable_4
  - type: NodeContainer
    nodes:
      power: !type:CableNode
        nodeGroupID: DystopiaControl
  - type: CableVisualizer
    statePrefix: lvcable_

- type: entity
  id: DystopiaCableControlStack
  name: control cable coil
  description: A coil of multicore control cable for linking a reactor console to the columns.
  suffix: Full
  components:
  - type: Construction   # крафт (gen_crafts.py)
    graph: DystopiaCableControlStackCraft
    node: done
  - type: Solution
    id: composite
    solution:
      maxVol: 5
      reagents:
      - ReagentId: Iron
        Quantity: 3
      - ReagentId: Copper
        Quantity: 2
  - type: Item
    size: Small
    sprite: _Dystopia/Objects/Tools/control_cable.rsi
    storedRotation: -90
    heldPrefix: control
  - type: Animateable
  - type: Clickable
  - type: InteractionOutline
  - type: MovedByPressure
  - type: EmitSoundOnCollide
    sound:
      collection: WeakHit
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Effects/drop.ogg
      params:
        volume: 2
  - type: DamageOnHighSpeedImpact
    damage:
      types:
        Blunt: 5
    soundHit:
      collection: MetalThud
  - type: CollisionWake
  - type: GravityAffected
  - type: Physics
    bodyType: Dynamic
    fixedRotation: false
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.25,-0.25,0.25,0.25"
        density: 20
        mask: [ ItemMask ]
        restitution: 0.3
        friction: 0.2
  - type: Sprite
    drawdepth: Items
    noRot: false
    sprite: _Dystopia/Objects/Tools/control_cable.rsi
    state: control-30
    layers:
    - state: control-30
      map: [ base ]
  - type: Pullable
  - type: DamageExaminable
  - type: Rotatable
    increment: 30
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:DoActsBehavior
        acts: [ Destruction ]
  - type: Tag
    tags: [ CableCoil ]
  - type: Stack
    stackType: DystopiaCableControl
    baseLayer: base
    layerStates: [ control-10, control-20, control-30 ]
  - type: Appearance
  - type: CablePlacer
    cablePrototypeID: DystopiaCableControl
    blockingWireType: DystopiaControl
  - type: StackPrice
    price: 2.25
  - type: PhysicalComposition
    materialComposition:
      Steel: 15
  - type: Extractable
    grindableSolutionName: composite

