- type: entity
  id: DystopiaUraniumDioxideE2
  name: uranium dioxide powder (2%)
  description: Heavy dark-brown powder of 2% enriched uranium. The brick press makes pellets of it.
  suffix: Full
  components:
  - type: Item
    size: Normal
    sprite: _Dystopia/Objects/Materials/Nuclear/uranium_dioxide.rsi
    heldPrefix: powder
  - type: Animateable
  - type: Clickable
  - type: InteractionOutline
  - type: MovedByPressure
  - type: EmitSoundOnCollide
    sound:
      collection: WeakHit
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Effects/drop.ogg
      params:
        volume: 2
  - type: DamageOnHighSpeedImpact
    damage:
      types:
        Blunt: 5
    soundHit:
      collection: MetalThud
  - type: CollisionWake
  - type: GravityAffected
  - type: Physics
    bodyType: Dynamic
    fixedRotation: false
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeCircle
          radius: 0.2
        density: 20
        mask: [ ItemMask ]
        restitution: 0.3
        friction: 0.2
  - type: Sprite
    drawdepth: Items
    noRot: false
    sprite: _Dystopia/Objects/Materials/Nuclear/uranium_dioxide.rsi
    state: powder_E2
  - type: Pullable
  - type: DamageExaminable
  - type: Rotatable
    increment: 30
  - type: Damageable
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:DoActsBehavior
        acts: [ Destruction ]
  - type: Appearance
  - type: Stack
    stackType: DystopiaUraniumDioxideE2
    count: 30
  - type: RadiationSource
    intensity: 0.02
    slope: 0.5

