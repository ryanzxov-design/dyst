  name: control rod channel
  description: "An absorber rod on a drive. Lowered, it soaks up the neutrons passing through it; raised, it lets them by. Driven from the console, singly or in groups; the alternative action drops it by hand."
  placement:
    mode: SnapgridCenter
  components:
  - type: Construction   # крафт (gen_crafts.py)
    graph: DystopiaReactorColumnControlCraft
    node: done
  - type: Transform
    anchored: true
    noRot: true
  - type: Clickable
  - type: InteractionOutline
  - type: Tag   # по пятаку ходят (без физики, как леса); одна колонна на клетку
    tags: [ Structure, Unstackable ]
  - type: Sprite
    sprite: _Dystopia/Structures/Nuclear/reactor_columns.rsi
    noRot: true
    drawdepth: FloorObjects
    layers:
    - state: control
    - state: ins4
      map: [ "enum.DystopiaReactorVisuals.Insertion" ]
    - state: heat1
      map: [ "enum.DystopiaReactorVisuals.Heat" ]
      shader: unshaded
      visible: false
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.DystopiaReactorVisuals.Insertion:   # глубина стержня, четверти
        enum.DystopiaReactorVisuals.Insertion:
          "0": { state: ins0 }
          "1": { state: ins1 }
          "2": { state: ins2 }
          "3": { state: ins3 }
          "4": { state: ins4 }
      enum.DystopiaReactorVisuals.Heat:
        enum.DystopiaReactorVisuals.Heat:
          "0": { visible: false }
          "1": { visible: true, state: heat1 }
          "2": { visible: true, state: heat2 }
  - type: NodeContainer   # кабель управления под клеткой — связь с пультом
    examinable: true
    nodes:
      control:
        !type:CableDeviceNode
        nodeGroupID: DystopiaControl
  - type: RadiationSource   # реактор светит одним источником у центра (DystopiaReactorSystem)
    intensity: 0
    slope: 0.2
    enabled: false
  - type: DystopiaReactorColumn
    kind: Control
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Repairable   # чинят сваркой
    fuelCost: 20
    doAfterDelay: 10
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 2
            max: 2
      - !type:DoActsBehavior
        acts: [ Destruction ]

