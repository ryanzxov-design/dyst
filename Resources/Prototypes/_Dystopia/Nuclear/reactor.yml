- type: entity
  id: DystopiaReactorSeparator
  name: steam separator drum
  description: "A tall drum that stands right against the reactor's columns. Water goes in through a liquid exporter (only water is taken), and the steam the channels raise collects here at 300 °C and leaves through the white branch on top into a gas pipe. Several drums can serve one reactor. If the steam has nowhere to go, the pressure climbs until the drum bursts."
  placement:
    mode: SnapgridCenter
  components:
  - type: Construction   # крафт (gen_crafts.py)
    graph: DystopiaReactorSeparatorCraft
    node: done
  - type: Transform
    anchored: true
    noRot: true
  - type: Clickable
  - type: InteractionOutline
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.4,-0.45,0.4,0.4"
        density: 1000
        mask: [ MachineMask ]
        layer: [ MachineLayer ]
  - type: Tag
    tags: [ Structure ]
  - type: Sprite
    sprite: _Dystopia/Structures/Nuclear/reactor_separator.rsi
    noRot: true
    drawdepth: Objects
    layers:
    - state: running
    - state: unlit
      shader: unshaded
  - type: Solution   # питательная вода
    id: water
    solution:
      maxVol: 2000
      canReact: false
  - type: RefillableSolution
    solution: water
  - type: DrainableSolution
    solution: water
  - type: DystopiaLiquidInputFilter   # экспортер наливает только воду
    solution: water
    reagents: [ Water ]
  - type: NodeContainer   # паровой патрубок: к газовой трубе с любой стороны
    nodes:
      steam:
        !type:PipeNode
        nodeGroupID: Pipe
        pipeDirection: Fourway
        volume: 200
  - type: DystopiaReactorSeparator
    pressureDamage:
      types:
        Blunt: 1
  - type: Explosive   # барабан рвёт паром
    explosionType: Default
    maxIntensity: 30
    intensitySlope: 4
    totalIntensity: 60
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Repairable   # чинят сваркой
    fuelCost: 20
    doAfterDelay: 10
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:ExplodeBehavior
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 4
            max: 4
      - !type:DoActsBehavior
        acts: [ Destruction ]

- type: entity
  id: DystopiaReactorConsole
  name: reactor control console
  description: "The reactor desk: a map of every channel, the rods singly and in groups, the automatic regulator and protection, and the AZ-5 button. It works when it stands right against any column, or over a control cable laid from under the desk to under any column. A reactor can have several consoles."
  placement:
    mode: SnapgridCenter
  components:
  - type: Construction   # крафт (gen_crafts.py)
    graph: DystopiaReactorConsoleCraft
    node: done
  - type: Transform
    anchored: true
    noRot: true
  - type: Clickable
  - type: InteractionOutline
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.25"
        density: 500
        mask: [ MachineMask ]
        layer: [ MachineLayer ]
  - type: Tag
    tags: [ Structure ]
  - type: Sprite
    sprite: _Dystopia/Structures/Nuclear/reactor_console.rsi
    noRot: true
    drawdepth: Objects
    layers:
    - state: running
    - state: unlit
      shader: unshaded
  - type: PointLight
    radius: 1.6
    energy: 1.2
    color: "#78bee1"
    castShadows: false
  - type: NodeContainer   # кабель управления под клеткой — связь с пультом
    examinable: true
    nodes:
      control:
        !type:CableDeviceNode
        nodeGroupID: DystopiaControl
  - type: DystopiaReactorConsole
  - type: ActivatableUI
    key: enum.DystopiaReactorConsoleUiKey.Key
  - type: UserInterface
    interfaces:
      enum.DystopiaReactorConsoleUiKey.Key:
        type: DystopiaReactorConsoleBoundUserInterface
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Repairable   # чинят сваркой
    fuelCost: 20
    doAfterDelay: 10
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 2
            max: 2
      - !type:DoActsBehavior
        acts: [ Destruction ]
