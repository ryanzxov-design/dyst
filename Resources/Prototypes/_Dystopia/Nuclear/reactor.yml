# Dystopia: энергетика, шаг 3а (gen_energy3a.py) — реактор РБМК из колонн 1×1, барабан-сепаратор, пульт.
# Соседние по стороне колонны — один реактор любого размера (DystopiaReactorSystem). Крафт — gen_crafts.py.

- type: dystopiaReactor   # числа физики — значения по умолчанию в DystopiaReactorComponents.cs
  id: Default

- type: entity
  id: DystopiaReactorColumnFuel
  name: fuel channel
  description: "A stainless tube in the graphite stack, capped by a top plate. Fuel rods go in by hand and come out with the alternative action. A fissioning rod sends neutrons out four ways; without graphite on the way its neighbours barely fission. Water boils in the channel and carries the heat away: a steam separator must stand next to the reactor."
  placement:
    mode: SnapgridCenter
  components:
  - type: Construction   # крафт (gen_crafts.py)
    graph: DystopiaReactorColumnFuelCraft
    node: done
  - type: Transform
    anchored: true
    noRot: true
  - type: Clickable
  - type: InteractionOutline
  - type: Tag   # по пятаку ходят (без физики, как леса); одна колонна на клетку
    tags: [ Structure, Unstackable ]
  - type: Sprite
    sprite: _Dystopia/Structures/Nuclear/reactor_columns.rsi
    noRot: true
    drawdepth: FloorObjects
    layers:
    - state: fuel
    - state: rod_11
      map: [ "enum.DystopiaReactorVisuals.Rod" ]
      visible: false
    - state: heat1
      map: [ "enum.DystopiaReactorVisuals.Heat" ]
      shader: unshaded
      visible: false
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.DystopiaReactorVisuals.Rod:   # сорт ТВЭЛа = реактивность ×10
        enum.DystopiaReactorVisuals.Rod:
          "0": { visible: false }
          "11": { visible: true, state: rod_11 }
          "15": { visible: true, state: rod_13 }
          "18": { visible: true, state: rod_18 }
      enum.DystopiaReactorVisuals.Heat:
        enum.DystopiaReactorVisuals.Heat:
          "0": { visible: false }
          "1": { visible: true, state: heat1 }
          "2": { visible: true, state: heat2 }
  - type: NodeContainer   # кабель управления под клеткой — связь с пультом
    examinable: true
    nodes:
      control:
        !type:CableDeviceNode
        nodeGroupID: DystopiaControl
  - type: RadiationSource   # реактор светит одним источником у центра (DystopiaReactorSystem)
    intensity: 0
    slope: 0.2
    enabled: false
  - type: ContainerContainer
    containers:
      dystopia_fuel_rod: !type:ContainerSlot
  - type: DystopiaReactorColumn
    kind: Fuel
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Repairable   # чинят сваркой
    fuelCost: 20
    doAfterDelay: 10
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:EmptyAllContainersBehaviour
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 2
            max: 2
      - !type:DoActsBehavior
        acts: [ Destruction ]

- type: entity
