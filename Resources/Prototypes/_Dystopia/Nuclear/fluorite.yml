# Dystopia: флюорит — руда, материал, стопка, жилы в четырёх породах (gen_energy2.py; компоненты — как у
# гипса). Слои в мире — gen_ore_layers.py.

- type: material
  id: DystopiaRawFluorite
  stackEntity: DystopiaOreFluorite1
  name: materials-dystopia-raw-fluorite
  unit: materials-unit-chunk
  icon: { sprite: _Dystopia/Objects/Materials/NonMetals/fluorite.rsi, state: fluorite }
  color: "#9864c8"
  price: 0.04

- type: stack
  id: DystopiaOreFluorite
  name: stack-dystopia-ore-fluorite
  icon: { sprite: /Textures/_Dystopia/Objects/Materials/NonMetals/fluorite.rsi, state: fluorite }
  spawn: DystopiaOreFluorite1
  maxCount: 30

- type: ore
  id: DystopiaFluorite
  oreEntity: DystopiaOreFluorite1
  minOreYield: 1
  maxOreYield: 3

- type: entity
  id: DystopiaOreFluorite
  name: fluorite
  description: Violet glassy crystals that glow faintly under a lamp. With sulfuric acid it gives off hydrofluoric acid, which uranium is fluorinated with.
  suffix: Fluorite, Full
  components:
  - type: Solution
    solution:
      canReact: false
      maxVol: 2
      reagents:
      - ReagentId: Fluorine
        Quantity: 2
    id: composite
  - type: Item
    size: Normal
    sprite: _Dystopia/Objects/Materials/NonMetals/fluorite.rsi
    heldPrefix: fluorite
  - type: Animateable
  - type: Clickable
  - type: InteractionOutline
  - type: MovedByPressure
  - type: EmitSoundOnCollide
    sound:
      collection: WeakHit
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Effects/drop.ogg
      params:
        volume: 2
  - type: DamageOnHighSpeedImpact
    damage:
      types:
        Blunt: 5
    soundHit:
      collection: MetalThud
  - type: CollisionWake
  - type: GravityAffected
  - type: Physics
    bodyType: Dynamic
    fixedRotation: false
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeCircle
          radius: 0.2
        density: 20
        mask: [ ItemMask ]
        restitution: 0.3
        friction: 0.2
  - type: Sprite
    drawdepth: Items
    noRot: false
    sprite: _Dystopia/Objects/Materials/NonMetals/fluorite.rsi
    state: fluorite
  - type: Pullable
  - type: DamageExaminable
  - type: Rotatable
    increment: 30
  - type: Damageable
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:DoActsBehavior
        acts: [ Destruction ]
  - type: Appearance
  - type: Material
  - type: Tag
    tags: [ Ore ]
  - type: Extractable
    grindableSolutionName: composite
  - type: Stack
    stackType: DystopiaOreFluorite
  - type: PhysicalComposition
    materialComposition:
      DystopiaRawFluorite: 100

