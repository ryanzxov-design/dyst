- type: entity
  id: DystopiaWallRockFluorite
  name: rock
  description: A rock seam rich with fluorite.
  suffix: Fluorite (fluorite)
  placement:
    mode: SnapgridCenter
    snap: [ Wall ]
  components:
  - type: OreVein
    oreChance: 1.0
    currentOre: DystopiaFluorite
  - type: Sprite
    layers:
    - state: fluorite
      sprite: _Dystopia/Structures/Walls/fluorite_vein.rsi
      map:
      - enum.MiningScannerVisualLayers.Overlay
    drawdepth: Walls
    sprite: Structures/Walls/stone-dirt.rsi
  - type: Transform
    anchored: true
    noRot: true
  - type: Clickable
  - type: GravityAffected
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        density: 1000
        mask: [ FullTileMask ]
        layer: [ WallLayer ]
  - type: Pullable
  - type: Tag
    tags: [ Structure ]
  - type: Anchorable
    flags: [ Anchorable ]
  - type: Rotatable
  - type: RangedDamageSound
    soundGroups:
      Brute:
        collection: MetalBulletImpact
    soundTypes:
      Heat:
        collection: MetalLaserImpact
  - type: Wall
  - type: IsRoof
  - type: Icon
    state: full
    sprite: Structures/Walls/stone-dirt.rsi
  - type: PlacementReplacement
    key: walls
  - type: Airtight
  - type: StaticPrice
    price: 75
  - type: RadiationBlocker
    resistance: 2
  - type: BlockWeather
  - type: SunShadowCast
  - type: Occluder
  - type: StructureAlignerPylon
    pylons: [ Door, Firelock ]
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 150
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/break_stone.ogg
          params:
            volume: -6
  - type: Damageable
    damageModifierSet: RockMod
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: SoundOnGather
  - type: Gatherable
    toolWhitelist:
      tags: [ Pickaxe ]
  - type: IconSmooth
    key: stone
    index: 0
    base: stone
  - type: MiningScannerViewable
  - type: EntityRemap
    mask:
      WallRockSand: DystopiaWallRockSandFluorite
      WallRockSnow: DystopiaWallRockSnowFluorite
      WallRockChromite: DystopiaWallRockChromiteFluorite

