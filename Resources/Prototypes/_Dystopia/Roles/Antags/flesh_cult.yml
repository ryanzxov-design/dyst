# Проповедник Плоти — скрытый антагонист. Выбирается из Пролетариев, у которых включено
# «Проповедник Плоти» в настройках антагонистов. Для Города он обычный работяга.
# Связь с Культом — псионическая (канал «Шёпот Плоти» без гарнитуры, см. DystopiaFleshPsionicSystem).

- type: antag
  id: DystopiaFleshPreacher
  name: roles-antag-dystopia-flesh-preacher-name
  antagonist: true
  setPreference: true
  objective: roles-antag-dystopia-flesh-preacher-objective

- type: antagSpecifier
  id: DystopiaFleshPreacher
  prefRoles:
  - DystopiaFleshPreacher
  jobWhitelist:
  - DystopiaProletarian
  blacklist:
    components:
    - AntagImmune
  components:
  - type: DystopiaFleshCultist
    rank: Preacher
    statusIcon: DystopiaFleshPreacherIcon
  - type: DystopiaFleshSeeder
  mindRoles:
  - MindRoleDystopiaFleshPreacher
  briefing:
    text: dystopia-flesh-preacher-briefing
    color: "#C0392B"
    sound: "/Audio/Ambience/Antag/headrev_start.ogg"

# Роль разума Проповедника (для итогов раунда и админов). Самостоятельная сущность, без parent.
- type: entity
  id: MindRoleDystopiaFleshPreacher
  name: Flesh Preacher Role
  description: Mind Role entity
  components:
  - type: MindRole
    antag: true
    antagPrototype: DystopiaFleshPreacher
    roleType: TeamAntagonist
    sortWeight: 50
    subtype: role-subtype-dystopia-flesh-preacher
