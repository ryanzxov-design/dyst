# Роли: Научная Служба
# Сумки (и пояс/РПС у Стражи) выдаются через выбор снаряжения — см. Loadouts/loadouts.yml.

- type: job
  id: DystopiaScienceDirector
  name: job-name-dystopia-science-director
  description: job-description-dystopia-science-director
  playTimeTracker: JobDystopiaScienceDirector
  startingGear: DystopiaScienceDirectorGear
  icon: "JobIconDystopiaScienceDirector"
  supervisors: dystopia-job-supervisors-consul
  joinNotifyCrew: true
  accessGroups:
  # ВРЕМЕННО: ванильные доступы для дверей тестовой карты Terra. Убрать вместе с Terra.
  - Research
  access:
  - DystopiaAdministration
  - DystopiaScienceDirector
  - DystopiaScience
  - DystopiaAugmentation
  - DystopiaIsolationLab
  - DystopiaGates
  # ВРЕМЕННО: ванильные доступы для дверей тестовой карты Terra. Убрать вместе с Terra.
  - Command
  - ResearchDirector
  - Maintenance
  - External

- type: startingGear
  id: DystopiaScienceDirectorGear
  equipment:
    jumpsuit: ClothingUniformJumpsuitResearchDirector
    outerClothing: ClothingOuterCoatRD
    mask: DystopiaClothingMaskGasScience
    shoes: ClothingShoesBootsLaceup
    id: DystopiaScienceDirectorPDA
    ears: ClothingHeadsetAltDystopiaScienceDirector

