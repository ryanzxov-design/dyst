# Роли: Городская Стража
# Сумки (и пояс/РПС у Стражи) выдаются через выбор снаряжения — см. Loadouts/loadouts.yml.

- type: job
  id: DystopiaGuardCaptain
  name: job-name-dystopia-guard-captain
  description: job-description-dystopia-guard-captain
  playTimeTracker: JobDystopiaGuardCaptain
  startingGear: DystopiaGuardCaptainGear
  icon: "JobIconDystopiaGuardCaptain"
  supervisors: dystopia-job-supervisors-consul
  joinNotifyCrew: true
  accessGroups:
  # ВРЕМЕННО: ванильные доступы для дверей тестовой карты Terra. Убрать вместе с Terra.
  - Security
  - Armory
  access:
  - DystopiaAdministration
  - DystopiaGuardCaptain
  - DystopiaGuard
  - DystopiaGuardArmory
  - DystopiaGuardDispatch # соционадзор
  - DystopiaPrison
  - DystopiaPatrol
  - DystopiaPatrolArmory
  - DystopiaGates
  - DystopiaFactory
  - DystopiaGreenhouse
  - DystopiaCanteen
  - DystopiaTavern
  - DystopiaShop
  # ВРЕМЕННО: ванильные доступы для дверей тестовой карты Terra. Убрать вместе с Terra.
  - Command
  - HeadOfSecurity
  - Maintenance
  - External

- type: startingGear
  id: DystopiaGuardCaptainGear
  equipment:
    jumpsuit: DystopiaClothingUniformGuardCaptain
    mask: DystopiaClothingMaskGuard
    gloves: ClothingHandsGlovesCombat
    shoes: ClothingShoesBootsJack
    id: DystopiaGuardCaptainPDA
    ears: ClothingHeadsetAltDystopiaGuardCaptain
  # оружие, голова и броня — в выборе снаряжения (Loadouts/loadouts.yml, guard_sidearms.yml)
  storage:
    back:
    - DystopiaFineTerminal

