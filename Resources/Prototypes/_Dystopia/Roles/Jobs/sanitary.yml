- type: job
  id: DystopiaChiefSanitaryDoctor
  name: job-name-dystopia-chief-sanitary-doctor
  description: job-description-dystopia-chief-sanitary-doctor
  playTimeTracker: JobDystopiaChiefSanitaryDoctor
  startingGear: DystopiaChiefSanitaryDoctorGear
  icon: "JobIconDystopiaChiefSanitaryDoctor"
  supervisors: dystopia-job-supervisors-consul
  joinNotifyCrew: true
  accessGroups:
  # ВРЕМЕННО: ванильные доступы для дверей тестовой карты Terra. Убрать вместе с Terra.
  - Medical
  access:
  - DystopiaAdministration
  - DystopiaChiefSanitary
  - DystopiaSanitary
  - DystopiaPharmacy
  - DystopiaCrematorium
  - DystopiaTechnical
  - DystopiaGates
  # ВРЕМЕННО: ванильные доступы для дверей тестовой карты Terra. Убрать вместе с Terra.
  - Command
  - ChiefMedicalOfficer
  - Maintenance
  - External

- type: startingGear
  id: DystopiaChiefSanitaryDoctorGear
  equipment:
    jumpsuit: ClothingUniformJumpsuitCMO
    eyes: ClothingEyesHudMedical
    mask: ClothingMaskGas
    shoes: ClothingShoesBootsLaceup
    id: DystopiaChiefSanitaryDoctorPDA
    ears: ClothingHeadsetCMO
    pocket1: HandheldHealthAnalyzer
  storage:
    back:
    - MedkitFilled

