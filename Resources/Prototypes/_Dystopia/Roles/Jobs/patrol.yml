# Роли: Внешний Патруль
# Сумки (и пояс/РПС у Стражи) выдаются через выбор снаряжения — см. Loadouts/loadouts.yml.
# Снаряжение Внешнего Патруля — ВРЕМЕННОЕ, будет позже.

- type: job
  id: DystopiaPraetorian
  name: job-name-dystopia-praetorian
  description: job-description-dystopia-praetorian
  playTimeTracker: JobDystopiaPraetorian
  startingGear: DystopiaPraetorianGear
  icon: "JobIconDystopiaPraetorian"
  supervisors: dystopia-job-supervisors-consul
  accessGroups:
  # ВРЕМЕННО: ванильные доступы для дверей тестовой карты Terra. Убрать вместе с Terra.
  - Security
  - Armory
  access:
  - DystopiaConsul
  - DystopiaAdministration
  - DystopiaPatrol
  - DystopiaPatrolArmory
  # ВРЕМЕННО: ванильные доступы для дверей тестовой карты Terra. Убрать вместе с Terra.
  - Command
  - Maintenance
  - External

- type: startingGear
  id: DystopiaPraetorianGear
  equipment:
    jumpsuit: ClothingUniformJumpsuitSeniorOfficer
    mask: DystopiaClothingMaskGasSanitary
    shoes: ClothingShoesBootsCombat
    id: DystopiaPraetorianPDA
    ears: ClothingHeadsetAltSecurity

