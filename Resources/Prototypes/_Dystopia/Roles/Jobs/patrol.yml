# Роли: Внешний Патруль (переделан 29.10). Единицы — люди, переделанные Городом: оболочка, шлем, лицевая маска и КПК
# не снимаются (UnitLockedEquipment), зарплаты нет (city.yml). Имя-номер, обнуление карт, биокод оружия и машина
# модификации — следующим этапом. Роли в начале раунда: Единица, Командная Единица, Преторианец.

- type: job
  id: DystopiaPraetorian
