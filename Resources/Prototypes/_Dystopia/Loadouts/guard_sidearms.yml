# Dystopia: табельное оружие Стражи в выборе снаряжения. Пистолет и патроны — одна группа: магазины у каждого
# пистолета свои, а группы снаряжения друг о друге не знают. Пистолет заряжен выбранными патронами + 1 запасной
# магазин (у Матебы — спидлоадер) в сумке. Сгенерировано: /tmp/claude-0/scripts/weap (data.GUARD_SIDEARMS).

- type: loadoutGroup
