# Выбор снаряжения (лоадауты) для ролей Города.
# Сумки — ванильные группы (рюкзак / сумка / вещмешок в цветах службы).
# Стража дополнительно выбирает пояс или РПС (обе уже заполнены), табельный пистолет с патронами
# (Loadouts/guard_sidearms.yml), а старшие чины — головной убор и броню.

- type: loadoutGroup
  id: DystopiaGuardBelt
  name: loadout-group-dystopia-guard-belt
  loadouts:
  - DystopiaGuardBelt
  - DystopiaGuardWebbing

- type: loadout
  id: DystopiaGuardBelt
  equipment:
    belt: DystopiaClothingBeltGuardFilled

- type: loadout
  id: DystopiaGuardWebbing
  equipment:
    belt: DystopiaClothingBeltGuardWebbingFilled

# --- Стража: головной убор (у Стражника и Рекрута — только шлем, он в startingGear)
