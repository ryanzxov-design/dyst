# Dystopia: свинцовый контейнер (gen_energy1.py; компоненты — как у коричневого портфеля).

- type: entity
  id: DystopiaLeadContainer
  name: lead container
  description: "A heavy lead-lined case for radioactive material: uranium, radium, fuel rods. Whatever is inside barely shines through."
  components:
  - type: Construction   # крафт (gen_crafts.py)
    graph: DystopiaLeadContainerCraft
    node: done
  - type: Item
    size: Ginormous
    sprite: _Dystopia/Objects/Storage/lead_container.rsi
  - type: Animateable
  - type: Clickable
  - type: InteractionOutline
  - type: MovedByPressure
  - type: EmitSoundOnCollide
    sound:
      collection: WeakHit
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Effects/drop.ogg
      params:
        volume: 2
  - type: DamageOnHighSpeedImpact
    damage:
      types:
        Blunt: 5
    soundHit:
      collection: MetalThud
  - type: CollisionWake
  - type: GravityAffected
  - type: Physics
    bodyType: Dynamic
    fixedRotation: false
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.25,-0.25,0.25,0.25"
        density: 20
        mask: [ ItemMask ]
        restitution: 0.3
        friction: 0.2
  - type: Sprite
    drawdepth: Items
    noRot: false
    sprite: _Dystopia/Objects/Storage/lead_container.rsi
    state: icon
  - type: Pullable
  - type: DamageExaminable
  - type: Rotatable
    increment: 30
  - type: Storage
    grid: [ 0,0,5,3 ]
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
        ents: []
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 8
  - type: RadiationBlockingContainer
    resistance: 6
