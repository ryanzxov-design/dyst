# Деревянные протезы (хирургия S2). Самостоятельные сущности, без parent.
# Детали — органы из ванильных частей тела человека с деревянными спрайтами; протез — «отделённое тело» с органами внутри,
# его пришивают к вскрытой части тела так же, как отрезанную конечность.

- type: entity
  id: DystopiaWoodArmLeft
  name: деревянная левая рука
  description: Грубо выточенная деревянная деталь протеза. Лучше, чем ничего.
  categories:
  - HideSpawnMenu
  components:
  # Часть тела и раны (система здоровья)
  - type: BodyPart
    partType: Arm
    symmetry: Left
    partComposition: Inorganic
  - type: Woundable
    integrity: 80
    integrityCap: 80
    thresholds:
      Minor: 70
      Moderate: 50
      Severe: 25
      Critical: 10
      Mangled: 0
  - type: Item
    size: Small
  - type: Animateable
  - type: Clickable
  - type: InteractionOutline
  - type: MovedByPressure
  - type: EmitSoundOnCollide
    sound:
      collection: WeakHit
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Effects/drop.ogg
      params:
        volume: 2
  - type: DamageOnHighSpeedImpact
    damage:
      types:
        Blunt: 5
    soundHit:
      collection: MetalThud
  - type: CollisionWake
  - type: GravityAffected
  - type: Physics
    bodyType: Dynamic
    fixedRotation: false
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.25,-0.25,0.25,0.25"
        density: 20
        mask:
        - ItemMask
        restitution: 0.3
        friction: 0.2
  - type: Sprite
    drawdepth: Items
    noRot: false
    sprite: _Dystopia/Mobs/Prosthetics/wood.rsi
    state: l_arm
  - type: Pullable
  - type: DamageExaminable
  - type: Rotatable
    increment: 30
  - type: Organ
    category: ArmLeft
  - type: VisualOrgan
    data:
      sprite: _Dystopia/Mobs/Prosthetics/wood.rsi
      state: l_arm
    layer: enum.HumanoidVisualLayers.LArm
  - type: ChildOrgan
  - type: DetachableOrgan
    detachedBody: DetachedBody
  - type: ParentOrgan

