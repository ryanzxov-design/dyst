# ID-карты профессий Города. Цвет полос — цвет департамента, иконка — своя.
# Позже эта же карта станет банковской картой жителя.

- type: entity
  parent: IDCardStandard
  id: DystopiaConsulIDCard
  name: ID-карта (консул)
  components:
  - type: Sprite
    layers:
    - state: gold
    - state: stripe_top
      color: "#B8962E"
    - state: stripe_bottom
      color: "#725d1c"
    - sprite: _Dystopia/Interface/job_icons.rsi
      offset: -0.09375, 0.0625
      state: Consul
  - type: Item
    heldPrefix: gold
  - type: PresetIdCard
    job: DystopiaConsul

