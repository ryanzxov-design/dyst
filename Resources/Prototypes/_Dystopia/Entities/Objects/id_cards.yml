# Dystopia. Все предметы в этом файле самостоятельные: без parent, все свойства выписаны явно.

# Самостоятельный предмет: все свойства выписаны явно (раньше: parent IDCardStandard)

- type: entity
  id: DystopiaConsulIDCard
  name: ID-карта (консул)
  description: A card necessary to access various areas aboard the station.
  components:
  - type: Item
    size: Small
    heldPrefix: gold
    storedRotation: -90
  - type: Animateable
  - type: Clickable
  - type: InteractionOutline
  - type: MovedByPressure
  - type: EmitSoundOnCollide
    sound:
      collection: WeakHit
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Effects/drop.ogg
      params:
        volume: 2
  - type: DamageOnHighSpeedImpact
    damage:
      types:
        Blunt: 5
    soundHit:
      collection: MetalThud
  - type: CollisionWake
  - type: GravityAffected
  - type: Physics
    bodyType: Dynamic
    fixedRotation: false
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.25,-0.25,0.25,0.25"
        density: 20
        mask:
        - ItemMask
        restitution: 0.3
        friction: 0.2
  - type: Sprite
    drawdepth: Items
    noRot: false
    sprite: _Dystopia/Objects/Misc/id_cards.rsi
    layers:
    - state: gold
    - state: stripe_top
      color: "#B8962E"
    - state: stripe_bottom
      color: "#725d1c"
    - sprite: _Dystopia/Interface/job_icons.rsi
      offset: -0.09375, 0.0625
      state: Consul
  - type: Pullable
  - type: DamageExaminable
  - type: Rotatable
    increment: 30
  - type: Tag
    tags:
    - DoorBumpOpener
    - WhitelistChameleon
    - WhitelistChameleonIdCard
  - type: StaticPrice
    price: 10
  - type: FlavorProfile
    flavors:
    - fiber
  - type: Clothing
    slots:
    - idcard
    sprite: _Dystopia/Objects/Misc/id_cards.rsi
  - type: Access
  - type: IdCard
  - type: StationRecordKeyStorage
  - type: StealTarget
    stealGroup: IDCard
  - type: PresetIdCard
    job: DystopiaConsul
