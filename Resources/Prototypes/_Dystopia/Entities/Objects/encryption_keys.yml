# Dystopia. Все предметы в этом файле самостоятельные: без parent, все свойства выписаны явно.

# Самостоятельный предмет: все свойства выписаны явно (раньше: parent EncryptionKey)

- type: entity
  id: EncryptionKeyDystopiaAdministration
  name: ключ шифрования Администрации
  description: Ключ шифрования служебного радиоканала Города.
  components:
  - type: Item
    size: Small
    sprite: _Dystopia/Objects/Devices/encryption_keys.rsi
  - type: Animateable
  - type: Clickable
  - type: InteractionOutline
  - type: MovedByPressure
  - type: EmitSoundOnCollide
    sound:
      collection: WeakHit
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Effects/drop.ogg
      params:
        volume: 2
  - type: DamageOnHighSpeedImpact
    damage:
      types:
        Blunt: 5
    soundHit:
      collection: MetalThud
  - type: CollisionWake
  - type: GravityAffected
  - type: Physics
    bodyType: Dynamic
    fixedRotation: false
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.25,-0.25,0.25,0.25"
        density: 20
        mask:
        - ItemMask
        restitution: 0.3
        friction: 0.2
  - type: Sprite
    drawdepth: Items
    noRot: false
    sprite: _Dystopia/Objects/Devices/encryption_keys.rsi
    layers:
    - state: crypt_gold
    - sprite: _Dystopia/Objects/Devices/encryption_labels.rsi
      state: administration_label
  - type: Pullable
  - type: DamageExaminable
  - type: Rotatable
    increment: 30
  - type: EncryptionKey
    channels:
    - Command
    defaultChannel: Command
