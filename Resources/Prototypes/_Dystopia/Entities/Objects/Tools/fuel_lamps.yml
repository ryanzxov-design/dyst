# Dystopia: керосиновая и карбидная лампы — ручные и настенные (gen_oil4b.py).

- type: entity
  id: DystopiaKeroseneLamp
  name: kerosene lamp
  description: "A hurricane lantern: wick and glass. Fill it with kerosene; it burns warm for about 25 minutes. Hang it on a wall: right-click the wall, Hang lamp."
  components:
  - type: Construction   # крафт (gen_crafts.py)
    graph: DystopiaKeroseneLampCraft
    node: done
  - type: Item
    size: Small
    sprite: _Dystopia/Objects/Tools/kerosene_lamp.rsi
    heldPrefix: "off"
  - type: Clickable
  - type: InteractionOutline
  - type: MovedByPressure
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Effects/drop.ogg
      params:
        volume: 2
  - type: CollisionWake
  - type: GravityAffected
  - type: Physics
    bodyType: Dynamic
    fixedRotation: false
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeCircle
          radius: 0.2
        density: 20
        mask: [ ItemMask ]
        restitution: 0.3
        friction: 0.2
  - type: Sprite
    sprite: _Dystopia/Objects/Tools/kerosene_lamp.rsi
    noRot: true
    layers:
    - state: icon
      map: [ "enum.DystopiaFuelLampVisuals.On" ]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.DystopiaFuelLampVisuals.On:
        enum.DystopiaFuelLampVisuals.On:
          True: { state: "on" }
          False: { state: icon }
  - type: PointLight
    enabled: false
    radius: 5
    energy: 1.3
    softness: 1
    color: "#FFB868"
  - type: Pullable
  - type: Solution
    id: fuel
    solution:
      maxVol: 50
      canReact: false
  - type: RefillableSolution
    solution: fuel
  - type: DrainableSolution
    solution: fuel
  - type: DystopiaFuelLamp
    mountedPrototype: DystopiaWallLampKerosene
    fuels:   # секунд горения с единицы
      DystopiaKerosene: 30
  - type: DystopiaParticleEmitter   # копоть над огнём
    emitters:
    # копоть
    - rate: 2
      lifetime: 0.8,1.4
      speed: 0.05,0.15
      direction: 0
      spread: 30
      alignToVelocity: false
      inheritVelocity: 0
      drift: 0,0.3
      drag: 0.5
      jitter: 0.08
      size: 1,2
      additive: false
      offset: 0,0.3
      activeWhen: enum.DystopiaFuelLampVisuals.On
      colors:
      - "#3A363000"
      - "#3A363050"
      - "#3A363000"
  - type: Damageable
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 40
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
      - !type:SpillBehavior
        solution: fuel
      - !type:DoActsBehavior
        acts: [ Destruction ]

- type: entity
  id: DystopiaWallLampKerosene
  name: wall kerosene lamp
  description: "A kerosene lantern on a hook. Click to light or put out; right-click to take it down."
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Clickable
  - type: InteractionOutline
  - type: Sprite   # 4 направления: лампа у той стены, от которой смотрит
    sprite: _Dystopia/Objects/Tools/kerosene_lamp.rsi
    noRot: false
    drawdepth: WallMountedItems
    layers:
    - state: wall
      map: [ "enum.DystopiaFuelLampVisuals.On" ]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.DystopiaFuelLampVisuals.On:
        enum.DystopiaFuelLampVisuals.On:
          True: { state: wall-on }
          False: { state: wall }
  - type: PointLight
    enabled: false
    radius: 5
    energy: 1.3
    softness: 1
    color: "#FFB868"
  - type: Solution
    id: fuel
    solution:
      maxVol: 50
      canReact: false
  - type: RefillableSolution
    solution: fuel
  - type: DrainableSolution
    solution: fuel
  - type: DystopiaFuelLamp
    itemPrototype: DystopiaKeroseneLamp
    fuels:
      DystopiaKerosene: 30
  - type: DystopiaParticleEmitter
    emitters:
    # копоть
    - rate: 2
      lifetime: 0.8,1.4
      speed: 0.05,0.15
      direction: 0
      spread: 30
      alignToVelocity: false
      inheritVelocity: 0
      drift: 0,0.3
      drag: 0.5
      jitter: 0.08
      size: 1,2
      additive: false
      offset: 0,0.6
      rotate: true
      activeWhen: enum.DystopiaFuelLampVisuals.On
      colors:
      - "#3A363000"
      - "#3A363050"
      - "#3A363000"
  - type: Damageable
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 40
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
      - !type:SpillBehavior
        solution: fuel
      - !type:DoActsBehavior
        acts: [ Destruction ]

