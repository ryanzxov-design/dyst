      jitter: 0.08
      size: 1,2
      additive: false
      offset: 0,0.3
      activeWhen: enum.DystopiaFuelLampVisuals.On
      colors:
      - "#3A363000"
      - "#3A363050"
      - "#3A363000"
  - type: Damageable
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 40
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
      - !type:SpillBehavior
        solution: fuel
      - !type:DoActsBehavior
        acts: [ Destruction ]

