- type: entity
  id: Magazine9x18PM
  name: PM magazine (9x18mm)
  description: Holds 8 rounds of 9x18mm.
  components:
  - type: Tag
    tags: [ Magazine9x18PM ]
  - type: BallisticAmmoProvider
    proto: Cartridge9x18
    capacity: 8
    whitelist:
      tags: [ Cartridge9x18 ]
    mayTransfer: true
  - type: Sprite
    sprite: _Dystopia/Objects/Weapons/Guns/Magazines/Pistol/pistol_mag.rsi
    layers:
    - state: base
      map: [ enum.GunVisualLayers.Base ]
    - state: mag-1
      map: [ enum.GunVisualLayers.Mag ]
    drawdepth: Items
    noRot: false
  - type: MagazineVisuals
    magState: mag
    steps: 3
    zeroVisible: false
  - type: Item
    size: Small
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Appearance
  - type: Contraband
    severity: Corvax433
    allowedDepartments: [ Security ]
    allowedJobs: []
  - type: Animateable
  - type: Clickable
  - type: InteractionOutline
  - type: MovedByPressure
  - type: EmitSoundOnCollide
    sound:
      collection: WeakHit
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Effects/drop.ogg
      params:
        volume: 2
  - type: DamageOnHighSpeedImpact
    damage:
      types:
        Blunt: 5
    soundHit:
      collection: MetalThud
  - type: CollisionWake
  - type: GravityAffected
  - type: Physics
    bodyType: Dynamic
    fixedRotation: false
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.25,-0.25,0.25,0.25"
        density: 20
        mask: [ ItemMask ]
        restitution: 0.3
        friction: 0.2
  - type: Pullable
  - type: DamageExaminable
  - type: Rotatable
    increment: 30

