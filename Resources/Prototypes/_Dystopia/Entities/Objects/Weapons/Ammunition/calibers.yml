# SPDX-License-Identifier: AGPL-3.0-or-later
# Dystopia: калибры оружия, перенесённого из Backmen (github.com/Rxup/space-station-14).
# Каждому стволу — свой настоящий калибр; виды патронов — только существующие для калибра.
# Урон/пробитие FMJ — по реальной дульной энергии (тупое пробитие = энергия / 50 Дж), см. penetration.yml.
# Варианты от FMJ: JHP урон ×1.25, пробитие −2 мм; AP урон ×0.75, пробитие +3 мм (пистолетные) / +5 мм
# (винтовочные) / ×1.5 (крупнокалиберные); бронебойно-зажигательные (API) — +3/+5 мм и огонь; WP — фосфор;
# HE — разрывные; резиновые — тупой урон и оглушение.
# Сущности самостоятельные (без parent); названия — Locale/*/_dystopia/calibers.ftl.

