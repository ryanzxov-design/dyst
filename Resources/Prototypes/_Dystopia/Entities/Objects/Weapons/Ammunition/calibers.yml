# ===================== 9x18mm (9×18 мм) =====================

- type: entity
  id: Bullet9x18
  name: bullet (9x18mm)
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        Piercing: 13
    impactEffect: BulletImpactEffect
    soundHit:
      path: /Audio/Weapons/Guns/Hits/bullet_hit.ogg
  - type: ArmorPenetration
    sharp: 3
    blunt: 6
  - type: Sprite
    noRot: false
    sprite: _Dystopia/Objects/Weapons/Guns/Projectiles/projectiles2.rsi
    layers:
    - state: bullet
      shader: unshaded
  - type: Reflective
  - type: FlyBySound
  - type: Clickable
  - type: Physics
    bodyType: Dynamic
  - type: TileFrictionModifier
    modifier: 0
  - type: Fixtures
    fixtures:
      projectile:
        shape: !type:PhysShapeAabb
          bounds: "-0.1,-0.10,0.1,0.30"
        hard: false
        mask: [ Impassable, BulletImpassable ]
      fly-by:
        shape: !type:PhysShapeCircle
          radius: 1.5
        layer: [ Impassable, MidImpassable, HighImpassable, LowImpassable ]
        hard: false
  - type: TimedDespawn
    lifetime: 10

- type: entity
  id: Cartridge9x18
  name: cartridge (9x18mm)
  description: "A 9x18mm Makarov pistol round. A full metal jacket bullet: the standard combat load."
  components:
  - type: Tag
    tags: [ Cartridge9x18 ]
  - type: CartridgeAmmo
    proto: Bullet9x18
  - type: Sprite
    layers:
    - state: base
      map: [ enum.AmmoVisualLayers.Base ]
    sprite: _Dystopia/Objects/Weapons/Guns/Ammunition/Casings/ammo_casing.rsi
    drawdepth: Items
    noRot: false
  - type: Appearance
  - type: SpentAmmoVisuals
  - type: Contraband
    severity: Corvax433
    allowedDepartments: [ Security ]
    allowedJobs: []
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.10,-0.05,0.10,0.05"
        density: 20
        mask: [ ItemMask ]
        restitution: 0.3
        friction: 0.2
  - type: Item
    size: Tiny
  - type: SpaceGarbage
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Weapons/Guns/Casings/casing_fall_2.ogg
      params:
        volume: -1
  - type: StaticPrice
    price: 1
  - type: Animateable
  - type: Clickable
  - type: InteractionOutline
  - type: MovedByPressure
  - type: EmitSoundOnCollide
    sound:
      collection: WeakHit
  - type: DamageOnHighSpeedImpact
    damage:
      types:
        Blunt: 5
    soundHit:
      collection: MetalThud
  - type: CollisionWake
  - type: GravityAffected
  - type: Physics
    bodyType: Dynamic
    fixedRotation: false
  - type: Pullable
  - type: DamageExaminable
  - type: Rotatable
    increment: 30
  - type: Damageable
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:DoActsBehavior
        acts: [ Destruction ]

- type: entity
  id: MagazineBox9x18
  name: ammunition box (9x18mm)
  description: A cardboard box of 60 9x18mm rounds.
  components:
  - type: BallisticAmmoProvider
    proto: Cartridge9x18
    capacity: 60
    whitelist:
      tags: [ Cartridge9x18 ]
    mayTransfer: true
  - type: Sprite
    layers:
    - state: base
      map: [ enum.GunVisualLayers.Base ]
    - state: mag-1
      map: [ enum.GunVisualLayers.Mag ]
    sprite: _Dystopia/Objects/Weapons/Guns/Ammunition/Boxes/pistol.rsi
    drawdepth: Items
    noRot: false
  - type: Item
    size: Small
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: MagazineVisuals
    magState: mag
    steps: 3
    zeroVisible: false
  - type: Appearance
  - type: Contraband
    severity: Corvax433
    allowedDepartments: [ Security ]
    allowedJobs: []
  - type: Animateable
  - type: Clickable
  - type: InteractionOutline
  - type: MovedByPressure
  - type: EmitSoundOnCollide
    sound:
      collection: WeakHit
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Effects/drop.ogg
      params:
        volume: 2
  - type: DamageOnHighSpeedImpact
    damage:
      types:
        Blunt: 5
    soundHit:
      collection: MetalThud
  - type: CollisionWake
  - type: GravityAffected
  - type: Physics
    bodyType: Dynamic
    fixedRotation: false
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.25,-0.25,0.25,0.25"
        density: 20
        mask: [ ItemMask ]
        restitution: 0.3
        friction: 0.2
  - type: Pullable
  - type: DamageExaminable
  - type: Rotatable
    increment: 30

