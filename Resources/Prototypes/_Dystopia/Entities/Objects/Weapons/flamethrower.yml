# Dystopia. Все предметы в этом файле самостоятельные: без parent, все свойства выписаны явно.

- type: Tag
  id: DystopiaFlamethrowerNozzle


- type: Tag
  id: DystopiaFlamethrowerTank

# --- Брандспойт ---
# Самостоятельный предмет: все свойства выписаны явно (раньше: parent BaseItem)

- type: entity
  id: DystopiaFlamethrower
  name: "огнемёт дезинфектора"
  description: "Брандспойт ранцевого огнемёта с запальником. Работает только от баллонов на спине."
  components:
  - type: Item
    size: Large
    sprite: _Dystopia/Objects/Weapons/flamethrower.rsi
  - type: Animateable
  - type: Clickable
  - type: InteractionOutline
  - type: MovedByPressure
  - type: EmitSoundOnCollide
    sound:
      collection: WeakHit
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Effects/drop.ogg
      params:
        volume: 2
  - type: DamageOnHighSpeedImpact
    damage:
      types:
        Blunt: 5
    soundHit:
      collection: MetalThud
  - type: CollisionWake
  - type: GravityAffected
  - type: Physics
    bodyType: Dynamic
    fixedRotation: false
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.25,-0.25,0.25,0.25"
        density: 20
        mask:
        - ItemMask
        restitution: 0.3
        friction: 0.2
  - type: Sprite
    drawdepth: Items
    noRot: false
    sprite: _Dystopia/Objects/Weapons/flamethrower.rsi
    layers:
    - state: icon
    - state: icon-pilot
      shader: unshaded
  - type: Pullable
  - type: DamageExaminable
  - type: Rotatable
    increment: 30
  - type: Tag
    tags:
    - DystopiaFlamethrowerNozzle
  - type: Gun
    cameraRecoilScalar: 0
    fireRate: 12
    projectileSpeed: 7
    minAngle: 4
    maxAngle: 16
    angleIncrease: 1
    angleDecay: 12
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    # Звук выстрела выключен: рёв огнемёта играет DystopiaFleshIgniter струи (не чаще раза в 1.6 с)
    soundGunshot: null
    soundEmpty:
      path: /Audio/Items/hiss.ogg
      params:
        volume: -6
  - type: Appearance
  - type: ClothingSlotAmmoProvider
  - type: SlotBasedConnectedContainer
    targetSlot: BACK
    containerWhitelist:
      tags:
      - DystopiaFlamethrowerTank
  - type: PointLight
    radius: 1.1
    energy: 1.2
    color: "#FF9A40"
    castShadows: false
