# Ранцевый огнемёт Дезинфектора (по мотивам ЛПО-50): баллоны на спине + брандспойт в руках.
# Работает на сварочном топливе. Пары топлива поджигают пол по пути струи и цели при попадании.
# Заправка — как у ранцевого бака для воды: приложить к цистерне с топливом.

- type: Tag
  id: DystopiaFlamethrowerNozzle

- type: Tag
  id: DystopiaFlamethrowerTank

# --- Брандспойт ---
- type: entity
  parent: BaseItem
  id: DystopiaFlamethrower
  name: "огнемёт дезинфектора"
  description: "Брандспойт ранцевого огнемёта с запальником. Работает только от баллонов на спине."
  components:
  - type: Tag
    tags:
    - DystopiaFlamethrowerNozzle
  - type: Sprite
    sprite: _Dystopia/Objects/Weapons/flamethrower.rsi
    layers:
    - state: icon
    - state: icon-pilot
      shader: unshaded
  - type: Item
    sprite: _Dystopia/Objects/Weapons/flamethrower.rsi
    size: Large
  - type: Gun
    cameraRecoilScalar: 0
    fireRate: 12
    projectileSpeed: 7
    minAngle: 4
    maxAngle: 16
    angleIncrease: 1
    angleDecay: 12
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    soundGunshot:
      path: /Audio/Effects/fire.ogg
      params:
        volume: -8
        variation: 0.15
    soundEmpty:
      path: /Audio/Items/hiss.ogg
      params:
        volume: -6
  - type: Appearance
  - type: ClothingSlotAmmoProvider
  - type: SlotBasedConnectedContainer
    targetSlot: BACK
    containerWhitelist:
      tags:
      - DystopiaFlamethrowerTank
  - type: PointLight
    radius: 1.1
    energy: 1.2
    color: "#FF9A40"
    castShadows: false

# --- Баллоны на спину (пустые) ---
- type: entity
  parent: [SolutionTank, SolutionGinormous, Clothing, ClothingSlotBase]
  id: DystopiaFlamethrowerTank
  name: "баллоны ранцевого огнемёта"
  description: "Три баллона с топливом на ремнях. Сбоку крепление для брандспойта."
  components:
  - type: Tag
    tags:
    - DystopiaFlamethrowerTank
  - type: Sprite
    sprite: _Dystopia/Objects/Weapons/flamethrower_tank.rsi
    state: icon
  - type: Item
    size: Ginormous
  - type: Clothing
    slots: BACK
    sprite: _Dystopia/Objects/Weapons/flamethrower_tank.rsi
  - type: Solution
    solution:
      maxVol: 300
  - type: ItemSlots
    slots:
      item:
        priority: 2
        whitelist:
          tags:
          - DystopiaFlamethrowerNozzle
  - type: ItemMapper
    mapLayers:
      icon-filled:
        whitelist:
          tags:
          - DystopiaFlamethrowerNozzle
  - type: Appearance
  - type: SolutionAmmoProvider
    solutionId: tank
    proto: DystopiaFlameShot
    fireCost: 1.5
  - type: SolutionTransfer
    transferAmount: 50
    maxTransferAmount: 100
    minTransferAmount: 10
    canChangeTransferAmount: true
  - type: UserInterface
    interfaces:
      enum.TransferAmountUiKey.Key:
        type: TransferAmountBoundUserInterface
  - type: DrawableSolution
    solution: tank
  - type: RefillableSolution
    solution: tank
  - type: DrainableSolution
    solution: tank
  - type: ExaminableSolution
    solution: tank
    exactVolume: true

# --- Баллоны заправленные, с брандспойтом в креплении ---
- type: entity
  parent: DystopiaFlamethrowerTank
  id: DystopiaFlamethrowerTankFilled
  suffix: Заправлен
  components:
  - type: Solution
    solution:
      maxVol: 300
      reagents:
      - ReagentId: WeldingFuel
        Quantity: 300
  - type: ItemSlots
    slots:
      item:
        priority: 2
        startingItem: DystopiaFlamethrower
        whitelist:
          tags:
          - DystopiaFlamethrowerNozzle

# --- Струя пламени ---
# Короткоживущие пары топлива: поджигают пол по пути (FlammableTileReaction топлива)
# и поджигают того, в кого попали. Видно пламя благодаря системе частиц.
- type: entity
  parent: [ SolutionVapor, SolutionSmall ]
  id: DystopiaFlameShot
  categories: [ HideSpawnMenu ]
  name: "пламя"
  components:
  - type: Physics
    bodyType: Dynamic
  - type: TileFrictionModifier
    modifier: 0
  - type: TimedDespawn
    lifetime: 0.55
  - type: Projectile
    damage:
      types:
        Heat: 4
  # Сам снаряд невидим — пламя рисуют частицы (DystopiaParticleEmitter ниже).
  - type: Sprite
    noRot: false
    visible: false
    sprite: _Dystopia/Objects/Weapons/flame_shot.rsi
    layers:
    - state: flame
      shader: unshaded
  - type: DystopiaParticleEmitter
    emitters:
    # Языки пламени: светлое ядро -> жёлтый -> оранжевый -> тёмно-красный
    - rate: 320
      lifetime: 0.22,0.42
      speed: 0.4,1.8
      spread: 70
      inheritVelocity: 0.45
      drag: 2.5
      jitter: 0.14
      size: 4,1
      additive: true
      colors:
      - "#FFE296BE"
      - "#FFA83AAF"
      - "#EC621E96"
      - "#A82C1464"
      - "#50180E00"
    # Искры: мелкие, живут дольше, разлетаются и мерцают
    - rate: 30
      lifetime: 0.4,0.9
      speed: 1.0,2.8
      spread: 90
      inheritVelocity: 0.35
      drag: 1
      jitter: 0.08
      size: 1,1
      additive: true
      flicker: 0.5
      colors:
      - "#FFE08AFF"
      - "#FF8A2AE6"
      - "#7A2A1000"
    # Дым: тёмные клочья, расползаются и тают
    - rate: 35
      lifetime: 0.7,1.3
      speed: 0.2,0.7
      spread: 200
      inheritVelocity: 0.15
      drag: 2
      jitter: 0.15
      size: 2,5
      additive: false
      colors:
      - "#2A2A2A00"
      - "#2E2E2E96"
      - "#3A3A3A64"
      - "#40404000"
  - type: Ammo
    muzzleFlash: null
  - type: Fixtures
    fixtures:
      projectile:
        shape: !type:PhysShapeAabb
          bounds: "-0.15,-0.30,0.15,0.20"
        hard: false
        mask:
        - Impassable
        - BulletImpassable
  - type: Vapor
    active: true
    transferAmountPercentage: 1
  - type: Appearance
  - type: IgnitionSource
    temperature: 700
    ignited: true
  - type: IgniteOnCollide
    fireStacks: 0.6
  - type: PointLight
    radius: 2
    energy: 3
    color: "#FF8C3A"
    castShadows: false
