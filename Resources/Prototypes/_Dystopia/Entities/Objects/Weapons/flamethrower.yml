# Самостоятельный предмет: все свойства выписаны явно (раньше: parent SolutionVapor, SolutionSmall)

- type: entity
  id: DystopiaFlameShot
  name: "пламя"
  categories: [HideSpawnMenu]
  components:
  - type: Solution
    solution:
      maxVol: 60
    id: vapor
  - type: Physics
    bodyType: Dynamic
  - type: TileFrictionModifier
    modifier: 0
  - type: TimedDespawn
    lifetime: 0.55
  - type: Projectile
    damage:
      types:
        Heat: 4
  - type: Sprite
    noRot: false
    visible: false
    sprite: _Dystopia/Objects/Weapons/flame_shot.rsi
    layers:
    - state: flame
      shader: unshaded
  - type: DystopiaParticleEmitter
    emitters:
    - rate: 320
      lifetime: 0.22,0.42
      speed: 0.4,1.8
      spread: 50
      inheritVelocity: 0.45
      drag: 2.5
      jitter: 0.08
      size: 4,1
      # у сопла узко, к концу дальности облако шире и крупнее
      rampTime: 0.5
      spreadEnd: 150
      jitterEnd: 0.6
      sizeMultiplierEnd: 1.8
      additive: true
      colors:
      - "#FFE296BE"
      - "#FFA83AAF"
      - "#EC621E96"
      - "#A82C1464"
      - "#50180E00"
    - rate: 30
      lifetime: 0.4,0.9
      speed: 1.0,2.8
      spread: 90
      inheritVelocity: 0.35
      drag: 1
      jitter: 0.08
      size: 1,1
      additive: true
      flicker: 0.5
      colors:
      - "#FFE08AFF"
      - "#FF8A2AE6"
      - "#7A2A1000"
    - rate: 35
      lifetime: 0.7,1.3
      speed: 0.2,0.7
      spread: 200
      inheritVelocity: 0.15
      drag: 2
      jitter: 0.15
      rampTime: 0.5
      jitterEnd: 0.7
      sizeMultiplierEnd: 1.6
      size: 2,5
      additive: false
      colors:
      - "#2A2A2A00"
      - "#2E2E2E96"
      - "#3A3A3A64"
      - "#40404000"
  - type: Ammo
    muzzleFlash: null
  - type: Fixtures
    fixtures:
      projectile:
        shape: !type:PhysShapeAabb
          bounds: "-0.15,-0.30,0.15,0.20"
        hard: false
        mask:
        - Impassable
        - BulletImpassable
  - type: Vapor
    active: true
    transferAmountPercentage: 1
  - type: Appearance
  - type: IgnitionSource
    temperature: 700
    ignited: true
  - type: IgniteOnCollide
    fireStacks: 0.6
  # Поджигает плоть Культа на клетках, над которыми пролетает струя
  - type: DystopiaFleshIgniter
    wideAfter: 0.3
    soundInterval: 1.6
    sound:
      path: /Audio/_Dystopia/Weapons/flamethrower.ogg
      params:
        volume: 2
        variation: 0.08
        maxDistance: 14
  - type: PointLight
    radius: 2
    energy: 3
    color: "#FF8C3A"
    castShadows: false
