# SPDX-License-Identifier: AGPL-3.0-or-later
# Dystopia: пулемёты, перенесённые из Backmen (github.com/Rxup/space-station-14, AGPL-3.0).
# Калибры и магазины — Ammunition/calibers.yml, Ammunition/magazines.yml. Спрайты — Бекмена (CC-BY-SA 3.0,
# авторы в meta.json), звуки — Audio/_Dystopia/Weapons/Guns (attributions.yml). Самостоятельные сущности (без parent).

- type: entity
  id: DystopiaWeaponMachineGunRPD
  name: RPD
  description: The Degtyaryov light machine gun in 7.62x39mm, fed from a 100-round belt drum.
  components:
  - type: Sprite
    sprite: _Dystopia/Objects/Weapons/Guns/LMGs/rpd/big.rsi
    layers:
    - state: base
      map: [ enum.GunVisualLayers.Base ]
    - state: mag-0
      map: [ enum.GunVisualLayers.Mag ]
    drawdepth: Items
    noRot: false
  - type: Clothing
    sprite: _Dystopia/Objects/Weapons/Guns/LMGs/rpd/tiny.rsi
    quickEquip: false
    slots: [ Back, suitStorage ]
  - type: Item
    sprite: _Dystopia/Objects/Weapons/Guns/LMGs/rpd/tiny.rsi
    size: Huge
    shape:
    - 0,0,4,3
  - type: WieldedCameraRecoil
    cameraRecoilScalar: -4
  - type: GunWieldBonus
    minAngle: -30
    maxAngle: -50
  - type: Gun
    minAngle: 34
    maxAngle: 55
    cameraRecoilScalar: 5
    fireRate: 5
    soundGunshot:
      path: /Audio/_Dystopia/Weapons/Guns/Rifles/ak47.ogg
    angleIncrease: 4
    angleDecay: 16
    selectedMode: FullAuto
    availableModes: [ FullAuto ]
    soundEmpty:
      path: /Audio/Weapons/Guns/Empty/lmg_empty.ogg
  - type: ChamberMagazineAmmoProvider
    soundRack:
      path: /Audio/Weapons/Guns/Cock/lmg_cock.ogg
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: Magazine762x39RPD
        insertSound: /Audio/_Dystopia/Weapons/Guns/Rifles/ak47_reload.ogg
        ejectSound: /Audio/_Dystopia/Weapons/Guns/Rifles/ak47_unload.ogg
        priority: 2
        whitelist:
          tags: [ Magazine762x39RPD ]
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        priority: 1
        whitelist:
          tags: [ Cartridge762x39 ]
        startingItem: Cartridge762x39
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: MagazineVisuals
    magState: mag
    steps: 2
    zeroVisible: true
  - type: Appearance
  - type: Wieldable
    unwieldOnUse: false
  - type: UseDelay
    delay: 1.9
  - type: ClothingSpeedModifier
    walkModifier: 1
    sprintModifier: 0.8
  - type: HeldSpeedModifier
  - type: AmmoCounter
  - type: StaticPrice
    price: 500
  - type: Animateable
  - type: Clickable
  - type: InteractionOutline
  - type: MovedByPressure
  - type: EmitSoundOnCollide
    sound:
      collection: WeakHit
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Effects/drop.ogg
      params:
        volume: 2
  - type: DamageOnHighSpeedImpact
    damage:
      types:
        Blunt: 5
    soundHit:
      collection: MetalThud
  - type: CollisionWake
  - type: GravityAffected
  - type: Physics
    bodyType: Dynamic
    fixedRotation: false
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.25,-0.25,0.25,0.25"
        density: 20
        mask: [ ItemMask ]
        restitution: 0.3
        friction: 0.2
  - type: Pullable
  - type: DamageExaminable
  - type: Rotatable
    increment: 30

