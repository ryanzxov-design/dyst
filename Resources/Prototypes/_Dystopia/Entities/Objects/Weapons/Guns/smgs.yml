# SPDX-License-Identifier: AGPL-3.0-or-later
# Dystopia: пистолеты-пулемёты, перенесённые из Backmen (github.com/Rxup/space-station-14, AGPL-3.0).
# Калибры и магазины — Ammunition/calibers.yml, Ammunition/magazines.yml. Спрайты — Бекмена (CC-BY-SA 3.0,
# авторы в meta.json), звуки — Audio/_Dystopia/Weapons/Guns (attributions.yml). Самостоятельные сущности (без parent).

- type: entity
  id: DystopiaWeaponSMGMP5
  name: MP5
  description: "A classic 9x19mm submachine gun: accurate, controllable, with 30-round magazines."
  components:
  - type: Sprite
    sprite: _Dystopia/Objects/Weapons/Guns/SMGs/mp5/big.rsi
    layers:
    - state: base
      map: [ enum.GunVisualLayers.Base ]
    - state: mag-0
      map: [ enum.GunVisualLayers.Mag ]
    drawdepth: Items
    noRot: false
  - type: Clothing
    sprite: _Dystopia/Objects/Weapons/Guns/SMGs/mp5/tiny.rsi
    quickEquip: false
    slots: [ Back, suitStorage ]
  - type: Item
    sprite: _Dystopia/Objects/Weapons/Guns/SMGs/mp5/tiny.rsi
    size: Large
    shape:
    - 0,0,2,1
  - type: WieldedCameraRecoil
    cameraRecoilScalar: -4
  - type: GunWieldBonus
    minAngle: -22
    maxAngle: 0
    angleIncrease: -3
  - type: Gun
    angleDecay: 25
    angleIncrease: 6
    cameraRecoilScalar: 5
    minAngle: 24
    maxAngle: 45
    fireRate: 6
    soundGunshot:
      path: /Audio/_Dystopia/Weapons/Guns/SMGs/mp5.ogg
    burstFireRate: 8
    selectedMode: FullAuto
    availableModes: [ SemiAuto, FullAuto ]
    defaultDirection: 1, 0
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: Magazine9x19MP5
        insertSound: /Audio/_Dystopia/Weapons/Guns/SMGs/mp5_reload.ogg
        ejectSound: /Audio/_Dystopia/Weapons/Guns/SMGs/mp5_unload.ogg
        priority: 2
        whitelist:
          tags: [ Magazine9x19MP5 ]
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        priority: 1
        whitelist:
          tags: [ Cartridge9x19 ]
        startingItem: Cartridge9x19
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance
  - type: Wieldable
  - type: UseDelay
    delay: 0.5
  - type: AmmoCounter
  - type: ChamberMagazineAmmoProvider
    soundRack:
      path: /Audio/Weapons/Guns/Cock/smg_cock.ogg
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: StaticPrice
    price: 500
  - type: Animateable
  - type: Clickable
  - type: InteractionOutline
  - type: MovedByPressure
  - type: EmitSoundOnCollide
    sound:
      collection: WeakHit
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Effects/drop.ogg
      params:
        volume: 2
  - type: DamageOnHighSpeedImpact
    damage:
      types:
        Blunt: 5
    soundHit:
      collection: MetalThud
  - type: CollisionWake
  - type: GravityAffected
  - type: Physics
    bodyType: Dynamic
    fixedRotation: false
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.25,-0.25,0.25,0.25"
        density: 20
        mask: [ ItemMask ]
        restitution: 0.3
        friction: 0.2
  - type: Pullable
  - type: DamageExaminable
  - type: Rotatable
    increment: 30

