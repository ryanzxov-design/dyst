# Dystopia: автоматы и винтовки, перенесённые из Backmen (github.com/Rxup/space-station-14, AGPL-3.0).
# Калибры и магазины — Ammunition/calibers.yml, Ammunition/magazines.yml. Спрайты — Бекмена (CC-BY-SA 3.0,
# авторы в meta.json), звуки — Audio/_Dystopia/Weapons/Guns (attributions.yml). Самостоятельные сущности (без parent).

- type: entity
  id: DystopiaWeaponRifleAKS74U
  name: AKS-74U
  description: A shortened 5.45x39mm carbine with a folding stock. 30-round magazines.
  components:
  - type: Sprite
    sprite: _Dystopia/Objects/Weapons/Guns/Rifles/aksu.rsi
    layers:
    - state: base
      map: [ enum.GunVisualLayers.Base ]
    - state: mag-0
      map: [ enum.GunVisualLayers.Mag ]
    drawdepth: Items
    noRot: false
  - type: Clothing
    sprite: _Dystopia/Objects/Weapons/Guns/Rifles/aksu.rsi
    quickEquip: false
    slots: [ Back, suitStorage ]
  - type: Item
    sprite: _Dystopia/Objects/Weapons/Guns/Rifles/aksu.rsi
    size: Large
    shape:
    - 0,0,3,2
  - type: WieldedCameraRecoil
    cameraRecoilScalar: -3.5
  - type: GunWieldBonus
    minAngle: -23
    maxAngle: 0
    angleIncrease: -2
  - type: Gun
    angleDecay: 25
    angleIncrease: 6
    cameraRecoilScalar: 5
    minAngle: 24
    maxAngle: 45
    fireRate: 5
    soundGunshot:
      path: /Audio/_Dystopia/Weapons/Guns/Rifles/ak47.ogg
    selectedMode: FullAuto
    availableModes: [ FullAuto, SemiAuto ]
  - type: ChamberMagazineAmmoProvider
    soundRack:
      path: /Audio/Weapons/Guns/Cock/sf_rifle_cock.ogg
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: Magazine545x39AK
        insertSound: /Audio/_Dystopia/Weapons/Guns/Rifles/ak47_reload.ogg
        ejectSound: /Audio/_Dystopia/Weapons/Guns/Rifles/ak47_unload.ogg
        priority: 2
        whitelist:
          tags: [ Magazine545x39AK ]
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        priority: 1
        whitelist:
          tags: [ Cartridge545x39 ]
        startingItem: Cartridge545x39
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance
  - type: Wieldable
    unwieldOnUse: false
  - type: UseDelay
    delay: 0.5
  - type: AmmoCounter
  - type: StaticPrice
    price: 500
  - type: Animateable
  - type: Clickable
  - type: InteractionOutline
  - type: MovedByPressure
  - type: EmitSoundOnCollide
    sound:
      collection: WeakHit
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Effects/drop.ogg
      params:
        volume: 2
  - type: DamageOnHighSpeedImpact
    damage:
      types:
        Blunt: 5
    soundHit:
      collection: MetalThud
  - type: CollisionWake
  - type: GravityAffected
  - type: Physics
    bodyType: Dynamic
    fixedRotation: false
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.25,-0.25,0.25,0.25"
        density: 20
        mask: [ ItemMask ]
        restitution: 0.3
        friction: 0.2
  - type: Pullable
  - type: DamageExaminable
  - type: Rotatable
    increment: 30

