# SPDX-License-Identifier: AGPL-3.0-or-later
# Dystopia: снайперские и затворные винтовки, перенесённые из Backmen (github.com/Rxup/space-station-14, AGPL-3.0).
# Калибры и магазины — Ammunition/calibers.yml, Ammunition/magazines.yml. Спрайты — Бекмена (CC-BY-SA 3.0,
# авторы в meta.json), звуки — Audio/_Dystopia/Weapons/Guns (attributions.yml). Самостоятельные сущности (без parent).

- type: entity
  id: DystopiaWeaponSniperSVD
  name: SVD
  description: The Dragunov sniper rifle in 7.62x54mmR. Self-loading, with 10-round magazines.
  components:
  - type: Sprite
    sprite: _Dystopia/Objects/Weapons/Guns/Snipers/dragunov/big.rsi
    layers:
    - state: base
      map: [ enum.GunVisualLayers.Base ]
    - state: mag-0
      map: [ enum.GunVisualLayers.Mag ]
    drawdepth: Items
    noRot: false
  - type: Clothing
    sprite: _Dystopia/Objects/Weapons/Guns/Snipers/dragunov/tiny.rsi
    quickEquip: false
    slots: [ Back, suitStorage ]
  - type: Item
    sprite: _Dystopia/Objects/Weapons/Guns/Snipers/dragunov/tiny.rsi
    size: Huge
    shape:
    - 0,0,3,2
  - type: WieldedCameraRecoil
    cameraRecoilScalar: -5
  - type: GunWieldBonus
    minAngle: -23
    maxAngle: -44
  - type: Gun
    selectedMode: SemiAuto
    availableModes: [ SemiAuto ]
    minAngle: 24
    maxAngle: 45
    cameraRecoilScalar: 10
    fireRate: 3
    soundGunshot:
      path: /Audio/_Dystopia/Weapons/Guns/Snipers/svd.ogg
      params:
        volume: -5
  - type: ChamberMagazineAmmoProvider
    soundRack:
      path: /Audio/Weapons/Guns/Cock/sf_rifle_cock.ogg
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: Magazine762x54RSVD
        insertSound: /Audio/_Dystopia/Weapons/Guns/Snipers/svd_reload.ogg
        ejectSound: /Audio/_Dystopia/Weapons/Guns/Snipers/svd_unload.ogg
        priority: 2
        whitelist:
          tags: [ Magazine762x54RSVD ]
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        priority: 1
        whitelist:
          tags: [ Cartridge762x54R ]
        startingItem: Cartridge762x54R
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance
  - type: Wieldable
    unwieldOnUse: false
  - type: UseDelay
    delay: 1.5
  - type: AmmoCounter
  - type: StaticPrice
    price: 500
  - type: Animateable
  - type: Clickable
  - type: InteractionOutline
  - type: MovedByPressure
  - type: EmitSoundOnCollide
    sound:
      collection: WeakHit
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Effects/drop.ogg
      params:
        volume: 2
  - type: DamageOnHighSpeedImpact
    damage:
      types:
        Blunt: 5
    soundHit:
      collection: MetalThud
  - type: CollisionWake
  - type: GravityAffected
  - type: Physics
    bodyType: Dynamic
    fixedRotation: false
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.25,-0.25,0.25,0.25"
        density: 20
        mask: [ ItemMask ]
        restitution: 0.3
        friction: 0.2
  - type: Pullable
  - type: DamageExaminable
  - type: Rotatable
    increment: 30

