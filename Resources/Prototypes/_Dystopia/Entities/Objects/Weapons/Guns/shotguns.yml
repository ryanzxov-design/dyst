# SPDX-License-Identifier: AGPL-3.0-or-later
# Dystopia: дробовики, перенесённые из Backmen (github.com/Rxup/space-station-14, AGPL-3.0).
# Калибры и магазины — Ammunition/calibers.yml, Ammunition/magazines.yml. Спрайты — Бекмена (CC-BY-SA 3.0,
# авторы в meta.json), звуки — Audio/_Dystopia/Weapons/Guns (attributions.yml). Самостоятельные сущности (без parent).

- type: entity
  id: DystopiaWeaponShotgunXM1014
  name: XM1014
  description: A semi-automatic 12 gauge combat shotgun. 7-round tube magazine.
  components:
  - type: Sprite
    sprite: _Dystopia/Objects/Weapons/Guns/Shotguns/sh-39/big.rsi
    layers:
    - state: icon
      map: [ enum.GunVisualLayers.Base ]
    drawdepth: Items
    noRot: false
  - type: Item
    sprite: _Dystopia/Objects/Weapons/Guns/Shotguns/sh-39/tiny.rsi
    size: Large
    shape:
    - 0,0,4,0
  - type: Clothing
    sprite: _Dystopia/Objects/Weapons/Guns/Shotguns/sh-39/tiny.rsi
    quickEquip: false
    slots: [ Back, suitStorage ]
  - type: BallisticAmmoProvider
    capacity: 7
    whitelist:
      tags: [ ShellShotgun ]
    proto: ShellShotgun
    soundInsert:
      path: /Audio/Weapons/Guns/MagIn/shotgun_insert.ogg
  - type: Wieldable
  - type: UseDelay
    delay: 1.3
  - type: GunRequiresWield
  - type: Gun
    cameraRecoilScalar: 2
    soundGunshot:
      path: /Audio/_Dystopia/Weapons/Guns/Shotguns/sh39.ogg
    fireRate: 2
    selectedMode: SemiAuto
    availableModes: [ SemiAuto ]
    soundEmpty:
      path: /Audio/Weapons/Guns/Empty/empty.ogg
  - type: AmmoCounter
  - type: CustomSpriteAmmoCounter
    loadedAmmoSprite: Interface/ItemStatus/Shotgun_Shells/not_spent.png
    spentAmmoSprite: Interface/ItemStatus/Shotgun_Shells/spent.png
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
        ents: []
  - type: StaticPrice
    price: 500
  - type: Animateable
  - type: Clickable
  - type: InteractionOutline
  - type: MovedByPressure
  - type: EmitSoundOnCollide
    sound:
      collection: WeakHit
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Effects/drop.ogg
      params:
        volume: 2
  - type: DamageOnHighSpeedImpact
    damage:
      types:
        Blunt: 5
    soundHit:
      collection: MetalThud
  - type: CollisionWake
  - type: GravityAffected
  - type: Physics
    bodyType: Dynamic
    fixedRotation: false
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.25,-0.25,0.25,0.25"
        density: 20
        mask: [ ItemMask ]
        restitution: 0.3
        friction: 0.2
  - type: Pullable
  - type: DamageExaminable
  - type: Rotatable
    increment: 30

