- type: entity
  id: DystopiaWeaponShotgunAA12
  name: AA-12
  description: A fully automatic 12 gauge shotgun fed from a 20-round drum.
  components:
  - type: Sprite
    sprite: _Dystopia/Objects/Weapons/Guns/Shotguns/aa12/big.rsi
    layers:
    - state: base
      map: [ enum.GunVisualLayers.Base ]
    - state: mag-0
      map: [ enum.GunVisualLayers.Mag ]
    drawdepth: Items
    noRot: false
  - type: Item
    sprite: _Dystopia/Objects/Weapons/Guns/Shotguns/aa12/tiny.rsi
    size: Large
  - type: Clothing
    sprite: _Dystopia/Objects/Weapons/Guns/Shotguns/aa12/tiny.rsi
    quickEquip: false
    slots: [ Back, suitStorage ]
  - type: Wieldable
    unwieldOnUse: false
  - type: UseDelay
    delay: 1.3
  - type: GunRequiresWield
  - type: Gun
    fireRate: 3
    cameraRecoilScalar: 2
    selectedMode: FullAuto
    availableModes: [ FullAuto ]
    soundGunshot:
      path: /Audio/Corvax/Weapons/Guns/Gunshots/shotgun_auto.ogg
    soundEmpty:
      path: /Audio/Weapons/Guns/Empty/empty.ogg
    minAngle: 21
    maxAngle: 32
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazineShotgunAA12
        insertSound: /Audio/Weapons/Guns/MagIn/smg_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/smg_magout.ogg
        priority: 2
        whitelist:
          tags: [ MagazineShotgunAA12 ]
        whitelistFailPopup: gun-magazine-whitelist-fail
  - type: AmmoCounter
  - type: CustomSpriteAmmoCounter
    loadedAmmoSprite: Interface/ItemStatus/Shotgun_Shells/not_spent.png
    spentAmmoSprite: Interface/ItemStatus/Shotgun_Shells/spent.png
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
  - type: MagazineAmmoProvider
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance
  - type: StaticPrice
    price: 5000
  - type: Contraband
    severity: Corvax434
    allowedDepartments: [ Security ]
    allowedJobs: []
  - type: Animateable
  - type: Clickable
  - type: InteractionOutline
  - type: MovedByPressure
  - type: EmitSoundOnCollide
    sound:
      collection: WeakHit
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Effects/drop.ogg
      params:
        volume: 2
  - type: DamageOnHighSpeedImpact
    damage:
      types:
        Blunt: 5
    soundHit:
      collection: MetalThud
  - type: CollisionWake
  - type: GravityAffected
  - type: Physics
    bodyType: Dynamic
    fixedRotation: false
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.25,-0.25,0.25,0.25"
        density: 20
        mask: [ ItemMask ]
        restitution: 0.3
        friction: 0.2
  - type: Pullable
  - type: DamageExaminable
  - type: Rotatable
    increment: 30
  - type: GunWieldBonus
    minAngle: -20
    maxAngle: -30
