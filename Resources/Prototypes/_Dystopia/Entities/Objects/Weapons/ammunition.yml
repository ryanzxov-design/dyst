# SPDX-License-Identifier: AGPL-3.0-or-later
# Dystopia: виды патронов по образцу Combat Extended. Ванильные патроны — FMJ (цельнометаллическая оболочка),
# ванильные зажигательные — WP (фосфорные). Здесь добавлены недостающие: JHP (экспансивные), AP (бронебойные),
# WP и HE (разрывные) — только те, что существуют для калибра.
# Пробитие: ArmorPenetration (мм / МПа), см. _Dystopia/Health/Armor/penetration.yml.
# Сгенерировано по одной схеме: JHP — урон ×1.25, пробитие ×0.5; AP — урон ×0.65, пробитие ×2;
# WP — как AP, плюс жар и поджог; HE — урон и пробитие FMJ, плюс маленький взрыв.
# Названия на русском — Locale/ru-RU/_dystopia/ammunition.ftl

# ===================== .35 auto =====================
- type: entity
  parent: BulletPistol
  id: BulletPistolJHP
  categories: [ HideSpawnMenu ]
  name: bullet (.35 auto JHP)
  components:
  - type: Projectile
    damage:
      types:
        Piercing: 20
  - type: ArmorPenetration
    sharp: 2
    blunt: 9.7

- type: entity
  parent: BaseCartridgePistol
  id: CartridgePistolJHP
  name: cartridge (.35 auto JHP)
  description: "Jacketed hollow point (JHP): expands on impact for more damage, but penetrates armor half as well."
  components:
  - type: CartridgeAmmo
    proto: BulletPistolJHP
  - type: Sprite
    layers:
    - state: base
      map: [ "enum.AmmoVisualLayers.Base" ]
    - state: tip
      map: [ "enum.AmmoVisualLayers.Tip" ]
      color: "#b5651d"

- type: entity
  parent: BaseMagazineBoxPistol
  id: MagazineBoxPistolJHP
  name: ammunition box (.35 auto JHP)
  description: "A cardboard box of .35 auto rounds. Jacketed hollow point (JHP): expands on impact for more damage, but penetrates armor half as well."
  components:
  - type: BallisticAmmoProvider
    proto: CartridgePistolJHP
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
    - sprite: _Dystopia/Objects/Weapons/ammo_marks.rsi
      state: box-pistol
      color: "#b5651d"

- type: entity
  parent: BulletPistol
  id: BulletPistolAP
  categories: [ HideSpawnMenu ]
  name: bullet (.35 auto AP)
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/projectiles2.rsi
    layers:
    - state: piercing
  - type: Projectile
    damage:
      types:
        Piercing: 10
  - type: ArmorPenetration
    sharp: 8
    blunt: 9.7

- type: entity
  parent: BaseCartridgePistol
  id: CartridgePistolAP
  name: cartridge (.35 auto AP)
  description: "Armor-piercing (AP) with a hardened core: penetrates armor twice as well, but deals less damage to unarmored targets."
  components:
  - type: CartridgeAmmo
    proto: BulletPistolAP
  - type: Sprite
    layers:
    - state: base
      map: [ "enum.AmmoVisualLayers.Base" ]
    - state: tip
      map: [ "enum.AmmoVisualLayers.Tip" ]
      color: "#0a0a0a"

- type: entity
  parent: BaseMagazineBoxPistol
  id: MagazineBoxPistolAP
  name: ammunition box (.35 auto AP)
  description: "A cardboard box of .35 auto rounds. Armor-piercing (AP) with a hardened core: penetrates armor twice as well, but deals less damage to unarmored targets."
  components:
  - type: BallisticAmmoProvider
    proto: CartridgePistolAP
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
    - sprite: _Dystopia/Objects/Weapons/ammo_marks.rsi
      state: box-pistol
      color: "#0a0a0a"


