# SPDX-License-Identifier: AGPL-3.0-or-later
# Dystopia: виды патронов. Ванильные патроны — FMJ, ванильные зажигательные остаются зажигательными.
# Сущности самостоятельные (без parent): всё, что раньше приходило от ванильных баз, выписано явно.
# Здесь — то, чего не было: JHP (экспансивные), AP (бронебойные), бронебойно-зажигательные, WP (фосфорные),
# HE (разрывные) и ружейные патроны. Только те виды, что существуют для калибра.
# Пробитие — ArmorPenetration (острое, мм / тупое, МПа), броня — _Dystopia/Health/Armor/.
# Урон: JHP ×1.25, AP ×0.75 от FMJ. WP поджигает цель на 10 секунд, огонь не тушится (PhosphorusOnHit).
# Названия и описания на русском — Locale/ru-RU/_dystopia/ammunition.ftl

# ===================== .35 auto =====================

- type: entity
  id: BulletPistolJHP
  name: bullet (.35 auto JHP)
  description: If you can see this you're probably dead!
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        Piercing: 20
    impactEffect: BulletImpactEffect
    soundHit:
      path: /Audio/Weapons/Guns/Hits/bullet_hit.ogg
  - type: ArmorPenetration
    sharp: 2
    blunt: 10.4
  - type: Sprite
    noRot: false
    sprite: _Dystopia/Objects/Weapons/Guns/Projectiles/projectiles2.rsi
    layers:
    - state: bullet
      shader: unshaded
  - type: Reflective
  - type: FlyBySound
  - type: Clickable
  - type: Physics
    bodyType: Dynamic
  - type: TileFrictionModifier
    modifier: 0
  - type: Fixtures
    fixtures:
      projectile:
        shape: !type:PhysShapeAabb
          bounds: "-0.1,-0.10,0.1,0.30"
        hard: false
        mask: [ Impassable, BulletImpassable ]
      fly-by:
        shape: !type:PhysShapeCircle
          radius: 1.5
        layer: [ Impassable, MidImpassable, HighImpassable, LowImpassable ]
        hard: false
  - type: TimedDespawn
    lifetime: 10

- type: entity
  id: CartridgePistolJHP
  name: cartridge (.35 auto JHP)
  description: A .35 auto cartridge with a jacketed hollow point. The bullet mushrooms on impact and leaves a nasty wound, but body armor stops it cold.
  components:
  - type: CartridgeAmmo
    proto: BulletPistolJHP
  - type: Sprite
    layers:
    - state: base
      map: [ enum.AmmoVisualLayers.Base ]
    - state: tip
      map: [ enum.AmmoVisualLayers.Tip ]
      color: "#b5651d"
    sprite: _Dystopia/Objects/Weapons/Guns/Ammunition/Casings/ammo_casing.rsi
    drawdepth: Items
    noRot: false
  - type: Tag
    tags: [ CartridgePistol ]
  - type: Appearance
  - type: SpentAmmoVisuals
  - type: Contraband
    severity: Corvax433
    allowedDepartments: [ Security ]
    allowedJobs: []
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.10,-0.05,0.10,0.05"
        density: 20
        mask: [ ItemMask ]
        restitution: 0.3
        friction: 0.2
  - type: Item
    size: Tiny
  - type: SpaceGarbage
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Weapons/Guns/Casings/casing_fall_2.ogg
      params:
        volume: -1
  - type: StaticPrice
    price: 1
  - type: Animateable
  - type: Clickable
  - type: InteractionOutline
  - type: MovedByPressure
  - type: EmitSoundOnCollide
    sound:
      collection: WeakHit
  - type: DamageOnHighSpeedImpact
    damage:
      types:
        Blunt: 5
    soundHit:
      collection: MetalThud
  - type: CollisionWake
  - type: GravityAffected
  - type: Physics
    bodyType: Dynamic
    fixedRotation: false
  - type: Pullable
  - type: DamageExaminable
  - type: Rotatable
    increment: 30
  - type: Damageable
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:DoActsBehavior
        acts: [ Destruction ]

- type: entity
  id: MagazineBoxPistolJHP
  name: ammunition box (.35 auto JHP)
  description: A cardboard box of .35 auto hollow point rounds.
  components:
  - type: BallisticAmmoProvider
    proto: CartridgePistolJHP
    mayTransfer: true
    whitelist:
      tags: [ CartridgePistol ]
    capacity: 60
  - type: Sprite
    layers:
    - state: base
      map: [ enum.GunVisualLayers.Base ]
    - state: mag-1
      map: [ enum.GunVisualLayers.Mag ]
    - sprite: _Dystopia/Objects/Weapons/ammo_marks.rsi
      state: box-pistol
      color: "#b5651d"
    sprite: _Dystopia/Objects/Weapons/Guns/Ammunition/Boxes/pistol.rsi
    drawdepth: Items
    noRot: false
  - type: Item
    size: Small
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: MagazineVisuals
    magState: mag
    steps: 3
    zeroVisible: false
  - type: Appearance
  - type: Contraband
    severity: Corvax433
    allowedDepartments: [ Security ]
    allowedJobs: []
  - type: Animateable
  - type: Clickable
  - type: InteractionOutline
  - type: MovedByPressure
  - type: EmitSoundOnCollide
    sound:
      collection: WeakHit
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Effects/drop.ogg
      params:
        volume: 2
  - type: DamageOnHighSpeedImpact
    damage:
      types:
        Blunt: 5
    soundHit:
      collection: MetalThud
  - type: CollisionWake
  - type: GravityAffected
  - type: Physics
    bodyType: Dynamic
    fixedRotation: false
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.25,-0.25,0.25,0.25"
        density: 20
        mask: [ ItemMask ]
        restitution: 0.3
        friction: 0.2
  - type: Pullable
  - type: DamageExaminable
  - type: Rotatable
    increment: 30

