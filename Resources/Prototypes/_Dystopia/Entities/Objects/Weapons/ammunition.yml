  name: ammunition box (.20 rifle AP)
  description: A cardboard box of .20 rifle armor-piercing rounds.
  components:
  - type: BallisticAmmoProvider
    proto: CartridgeRifleAP
    mayTransfer: true
    whitelist:
      tags: [ CartridgeRifle ]
    capacity: 50
  - type: Sprite
    layers:
    - state: base
      map: [ enum.GunVisualLayers.Base ]
    - state: mag-1
      map: [ enum.GunVisualLayers.Mag ]
    - sprite: _Dystopia/Objects/Weapons/ammo_marks.rsi
      state: box-rifle
      color: "#0a0a0a"
    sprite: _Dystopia/Objects/Weapons/Guns/Ammunition/Boxes/rifle.rsi
    drawdepth: Items
    noRot: false
  - type: Item
    size: Small
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: MagazineVisuals
    magState: mag
    steps: 4
    zeroVisible: false
  - type: Appearance
  - type: Contraband
    severity: Corvax433
    allowedDepartments: [ Security ]
    allowedJobs: []
  - type: Animateable
  - type: Clickable
  - type: InteractionOutline
  - type: MovedByPressure
  - type: EmitSoundOnCollide
    sound:
      collection: WeakHit
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Effects/drop.ogg
      params:
        volume: 2
  - type: DamageOnHighSpeedImpact
    damage:
      types:
        Blunt: 5
    soundHit:
      collection: MetalThud
  - type: CollisionWake
  - type: GravityAffected
  - type: Physics
    bodyType: Dynamic
    fixedRotation: false
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.25,-0.25,0.25,0.25"
        density: 20
        mask: [ ItemMask ]
        restitution: 0.3
        friction: 0.2
  - type: Pullable
  - type: DamageExaminable
  - type: Rotatable
    increment: 30

- type: entity
  id: BulletRifleWP
  name: bullet (.20 rifle WP)
  description: If you can see this you're probably dead!
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        Piercing: 13
        Heat: 2
    impactEffect: BulletImpactEffect
    soundHit:
      path: /Audio/Weapons/Guns/Hits/bullet_hit.ogg
  - type: PhosphorusOnHit
    duration: 10
    fireStacks: 3
  - type: PointLight
    enabled: true
    color: "#fff4d6"
    radius: 2.0
    energy: 5.0
  - type: ArmorPenetration
    sharp: 11.5
    blunt: 27
  - type: Sprite
    noRot: false
    sprite: _Dystopia/Objects/Weapons/Guns/Projectiles/projectiles2.rsi
    layers:
    - state: bullet
      shader: unshaded
  - type: Reflective
  - type: FlyBySound
  - type: Clickable
  - type: Physics
    bodyType: Dynamic
  - type: TileFrictionModifier
    modifier: 0
  - type: Fixtures
    fixtures:
      projectile:
        shape: !type:PhysShapeAabb
          bounds: "-0.1,-0.10,0.1,0.30"
        hard: false
        mask: [ Impassable, BulletImpassable ]
      fly-by:
        shape: !type:PhysShapeCircle
          radius: 1.5
        layer: [ Impassable, MidImpassable, HighImpassable, LowImpassable ]
        hard: false
  - type: TimedDespawn
    lifetime: 10

- type: entity
  id: CartridgeRifleWP
  name: cartridge (.20 rifle WP)
  description: A .20 rifle cartridge with a white phosphorus filler. On impact the phosphorus splashes over the target and burns for about ten seconds; water won't put it out.
  components:
  - type: CartridgeAmmo
    proto: BulletRifleWP
  - type: Sprite
    layers:
    - state: base
      map: [ enum.AmmoVisualLayers.Base ]
    - state: tip
      map: [ enum.AmmoVisualLayers.Tip ]
      color: "#e8e8e8"
