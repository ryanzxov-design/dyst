# SPDX-License-Identifier: AGPL-3.0-or-later
# Dystopia: виды патронов. Ванильные патроны — FMJ, ванильные зажигательные остаются зажигательными.
# Здесь — то, чего не было: JHP (экспансивные), AP (бронебойные), бронебойно-зажигательные, WP (фосфорные),
# HE (разрывные) и ружейные патроны. Только те виды, что существуют для калибра.
# Пробитие — ArmorPenetration (острое, мм / тупое, МПа), броня — _Dystopia/Health/Armor/.
# Урон: JHP ×1.25, AP ×0.75 от FMJ. WP поджигает цель на 10 секунд, огонь не тушится (PhosphorusOnHit).
# Названия и описания на русском — Locale/ru-RU/_dystopia/ammunition.ftl

# ===================== .35 auto =====================
- type: entity
  parent: BulletPistol
  id: BulletPistolJHP
  categories: [ HideSpawnMenu ]
  name: bullet (.35 auto JHP)
  components:
  - type: Projectile
    damage:
      types:
        Piercing: 20
  - type: ArmorPenetration
    sharp: 2
    blunt: 10.4

- type: entity
  parent: BaseCartridgePistol
  id: CartridgePistolJHP
  name: cartridge (.35 auto JHP)
  description: "A .35 auto cartridge with a jacketed hollow point. The bullet mushrooms on impact and leaves a nasty wound, but body armor stops it cold."
  components:
  - type: CartridgeAmmo
    proto: BulletPistolJHP
  - type: Sprite
    layers:
    - state: base
      map: [ "enum.AmmoVisualLayers.Base" ]
    - state: tip
      map: [ "enum.AmmoVisualLayers.Tip" ]
      color: "#b5651d"

- type: entity
  parent: BaseMagazineBoxPistol
  id: MagazineBoxPistolJHP
  name: ammunition box (.35 auto JHP)
  description: "A cardboard box of .35 auto hollow point rounds."
  components:
  - type: BallisticAmmoProvider
    proto: CartridgePistolJHP
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
    - sprite: _Dystopia/Objects/Weapons/ammo_marks.rsi
      state: box-pistol
      color: "#b5651d"

- type: entity
  parent: BulletPistol
  id: BulletPistolAP
  categories: [ HideSpawnMenu ]
  name: bullet (.35 auto AP)
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/projectiles2.rsi
    layers:
    - state: piercing
  - type: Projectile
    damage:
      types:
        Piercing: 12
  - type: ArmorPenetration
    sharp: 7
    blunt: 10.4

- type: entity
  parent: BaseCartridgePistol
  id: CartridgePistolAP
  name: cartridge (.35 auto AP)
  description: "A .35 auto cartridge with a hardened steel core under the jacket. It gets through vests that would catch a regular bullet, at the cost of a cleaner wound."
  components:
  - type: CartridgeAmmo
    proto: BulletPistolAP
  - type: Sprite
    layers:
    - state: base
      map: [ "enum.AmmoVisualLayers.Base" ]
    - state: tip
      map: [ "enum.AmmoVisualLayers.Tip" ]
      color: "#0a0a0a"

- type: entity
  parent: BaseMagazineBoxPistol
  id: MagazineBoxPistolAP
  name: ammunition box (.35 auto AP)
  description: "A cardboard box of .35 auto armor-piercing rounds."
  components:
  - type: BallisticAmmoProvider
    proto: CartridgePistolAP
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
    - sprite: _Dystopia/Objects/Weapons/ammo_marks.rsi
      state: box-pistol
      color: "#0a0a0a"


