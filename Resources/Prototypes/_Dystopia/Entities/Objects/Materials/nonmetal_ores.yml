# Dystopia: неметаллы, шаг 1 — сырьё и вещества (машины и рецепты переработки — следующим шагом).
# Куски сырья. Самостоятельные сущности, без parent.

- type: entity
  id: DystopiaOreLimestone
  name: limestone
  description: Pale dense rock with tiny shells in the break. Lime, cement and soda come from it.
  suffix: Lime, Full
  components:
  - type: Solution
    solution:
      canReact: false
      maxVol: 1
    id: composite
  - type: Item
    size: Normal
    sprite: _Dystopia/Objects/Materials/NonMetals/ore.rsi
    heldPrefix: limestone
  - type: Animateable
  - type: Clickable
  - type: InteractionOutline
  - type: MovedByPressure
  - type: EmitSoundOnCollide
    sound:
      collection: WeakHit
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Effects/drop.ogg
      params:
        volume: 2
  - type: DamageOnHighSpeedImpact
    damage:
      types:
        Blunt: 5
    soundHit:
      collection: MetalThud
  - type: CollisionWake
  - type: GravityAffected
  - type: Physics
    bodyType: Dynamic
    fixedRotation: false
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeCircle
          radius: 0.2
        density: 20
        mask: [ ItemMask ]
        restitution: 0.3
        friction: 0.2
  - type: Sprite
    drawdepth: Items
    noRot: false
    sprite: _Dystopia/Objects/Materials/NonMetals/ore.rsi
    state: limestone
  - type: Pullable
  - type: DamageExaminable
  - type: Rotatable
    increment: 30
  - type: Damageable
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:DoActsBehavior
        acts: [ Destruction ]
  - type: Appearance
  - type: Material
  - type: Tag
    tags: [ Ore ]
  - type: Extractable
    grindableSolutionName: composite
  - type: Stack
    stackType: DystopiaOreLimestone
  - type: PhysicalComposition
    materialComposition:
      DystopiaRawLimestone: 100

