# Dystopia: металлы и сплавы Города (этап «Промышленность: вещества»). Самостоятельные сущности, без parent.
# Проволока (мотки).

- type: entity
  id: DystopiaWireCopper
  name: copper wire
  description: A coil of copper wire.
  suffix: Full
  components:
  - type: Solution
    solution:
      canReact: false
      maxVol: 2.5
      reagents:
      - ReagentId: Copper
        Quantity: 2.5
    id: composite
  - type: Item
    size: Small
    sprite: _Dystopia/Objects/Materials/Metals/wires.rsi
    heldPrefix: copper
  - type: Animateable
  - type: Clickable
  - type: InteractionOutline
  - type: MovedByPressure
  - type: EmitSoundOnCollide
    sound:
      collection: WeakHit
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Effects/drop.ogg
      params:
        volume: 2
  - type: DamageOnHighSpeedImpact
    damage:
      types:
        Blunt: 5
    soundHit:
      collection: MetalThud
  - type: CollisionWake
  - type: GravityAffected
  - type: Physics
    bodyType: Dynamic
    fixedRotation: false
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.25,-0.25,0.25,0.25"
        density: 20
        mask: [ ItemMask ]
        restitution: 0.3
        friction: 0.2
  - type: Sprite
    drawdepth: Items
    noRot: false
    sprite: _Dystopia/Objects/Materials/Metals/wires.rsi
    state: copper-30
    layers:
    - state: copper-30
      map: [ base ]
  - type: Pullable
  - type: DamageExaminable
  - type: Rotatable
    increment: 30
  - type: Damageable
    damageModifierSet: FlimsyMetallic
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:DoActsBehavior
        acts: [ Destruction ]
  - type: Appearance
  - type: Material
  - type: Extractable
    grindableSolutionName: composite
  - type: PhysicalComposition
    materialComposition:
      DystopiaCopper: 25
  - type: Stack
    stackType: DystopiaWireCopper
    baseLayer: base
    layerStates: [ copper-10, copper-20, copper-30 ]

