# Dystopia: металлы и сплавы Города (этап «Промышленность: вещества»). Самостоятельные сущности, без parent.
# Листы. Стальной и латунный — ванильные листы.

- type: entity
  id: DystopiaSheetCopper
  name: copper sheet
  description: A rolled sheet of copper.
  suffix: Full
  components:
  - type: Solution
    solution:
      canReact: false
      maxVol: 10.0
      reagents:
      - ReagentId: Copper
        Quantity: 10.0
    id: composite
  - type: Item
    size: Normal
    sprite: _Dystopia/Objects/Materials/Metals/sheets.rsi
    heldPrefix: copper
  - type: Animateable
  - type: Clickable
  - type: InteractionOutline
  - type: MovedByPressure
  - type: EmitSoundOnCollide
    sound:
      collection: WeakHit
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Effects/drop.ogg
      params:
        volume: 2
  - type: DamageOnHighSpeedImpact
    damage:
      types:
        Blunt: 5
    soundHit:
      collection: MetalThud
  - type: CollisionWake
  - type: GravityAffected
  - type: Physics
    bodyType: Dynamic
    fixedRotation: false
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.25,-0.25,0.25,0.25"
        density: 20
        mask: [ ItemMask ]
        restitution: 0.3
        friction: 0.2
  - type: Sprite
    drawdepth: Items
    noRot: false
    sprite: _Dystopia/Objects/Materials/Metals/sheets.rsi
    state: copper_3
    layers:
    - state: copper_3
      map: [ base ]
  - type: Pullable
  - type: DamageExaminable
  - type: Rotatable
    increment: 30
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:DoActsBehavior
        acts: [ Destruction ]
  - type: Appearance
  - type: Material
  - type: Tag
    tags: [ Sheet ]
  - type: Extractable
    grindableSolutionName: composite
  - type: PhysicalComposition
    materialComposition:
      DystopiaCopper: 100
  - type: Stack
    stackType: DystopiaSheetCopper
    baseLayer: base
    layerStates: [ copper, copper_2, copper_3 ]

