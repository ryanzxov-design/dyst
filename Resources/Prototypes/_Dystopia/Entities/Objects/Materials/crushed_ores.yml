# SPDX-License-Identifier: AGPL-3.0-or-later
# Dystopia: дроблёная руда — ступень ×2 переработки металлов (дробилка → тигель 1:1).
# Самостоятельные сущности, без parent.

- type: entity
  id: DystopiaCrushedHematite
  name: crushed hematite
  description: Crushed hematite. One chunk of ore gives two handfuls, each melts into an ingot.
  suffix: Iron, Full
  components:
  - type: Item
    size: Normal
    sprite: _Dystopia/Objects/Materials/Metals/crushed.rsi
    heldPrefix: hematite
  - type: Animateable
  - type: Clickable
  - type: InteractionOutline
  - type: MovedByPressure
  - type: EmitSoundOnCollide
    sound:
      collection: WeakHit
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Effects/drop.ogg
      params:
        volume: 2
  - type: DamageOnHighSpeedImpact
    damage:
      types:
        Blunt: 5
    soundHit:
      collection: MetalThud
  - type: CollisionWake
  - type: GravityAffected
  - type: Physics
    bodyType: Dynamic
    fixedRotation: false
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeCircle
          radius: 0.2
        density: 20
        mask: [ ItemMask ]
        restitution: 0.3
        friction: 0.2
  - type: Sprite
    drawdepth: Items
    noRot: false
    sprite: _Dystopia/Objects/Materials/Metals/crushed.rsi
    state: hematite
  - type: Pullable
  - type: DamageExaminable
  - type: Rotatable
    increment: 30
  - type: Damageable
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:DoActsBehavior
        acts: [ Destruction ]
  - type: Appearance
  - type: Material
  - type: Tag
    tags: [ Ore ]
  - type: Stack
    stackType: DystopiaCrushedHematite
  - type: PhysicalComposition
    materialComposition:
      DystopiaCrushedHematite: 100

