# Dystopia: неметаллы, шаг 1 — сырьё и вещества (машины и рецепты переработки — следующим шагом).
# Продукты неметаллов: известь, клинкер, цемент, бетон, щебень, кирпичи, шихта, кокс, огарок. Без parent.

- type: entity
  id: DystopiaQuicklime
  name: quicklime
  description: White lumps of burnt limestone. They hiss and get hot when wet, so keep them dry.
  suffix: Lime, Full
  components:
  - type: Item
    size: Normal
    sprite: _Dystopia/Objects/Materials/NonMetals/products.rsi
    heldPrefix: quicklime
  - type: Animateable
  - type: Clickable
  - type: InteractionOutline
  - type: MovedByPressure
  - type: EmitSoundOnCollide
    sound:
      collection: WeakHit
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Effects/drop.ogg
      params:
        volume: 2
  - type: DamageOnHighSpeedImpact
    damage:
      types:
        Blunt: 5
    soundHit:
      collection: MetalThud
  - type: CollisionWake
  - type: GravityAffected
  - type: Physics
    bodyType: Dynamic
    fixedRotation: false
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeCircle
          radius: 0.2
        density: 20
        mask: [ ItemMask ]
        restitution: 0.3
        friction: 0.2
  - type: Sprite
    drawdepth: Items
    noRot: false
    sprite: _Dystopia/Objects/Materials/NonMetals/products.rsi
    state: quicklime
  - type: Pullable
  - type: DamageExaminable
  - type: Rotatable
    increment: 30
  - type: Damageable
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:DoActsBehavior
        acts: [ Destruction ]
  - type: Appearance
  - type: Material
  - type: Stack
    stackType: DystopiaQuicklime
  - type: PhysicalComposition
    materialComposition:
      DystopiaQuicklime: 100

