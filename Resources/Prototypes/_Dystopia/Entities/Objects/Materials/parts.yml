# Dystopia: детали машин — шестерня, электромотор, редуктор, обмоточный провод, сальниковая набивка.
# Собираются крафтами (следующий архив); шестерню льют в изложницу. Без parent. Генератор gen_parts.py.

- type: entity
  id: DystopiaGear
  name: cast-iron gear
  description: A cast gear, its teeth still rough from the mould. Two of these and a housing make a gearbox.
  suffix: Full
  components:
  - type: Item
    size: Small
    sprite: _Dystopia/Objects/Materials/Parts/parts.rsi
    heldPrefix: gear
  - type: Animateable
  - type: Clickable
  - type: InteractionOutline
  - type: MovedByPressure
  - type: EmitSoundOnCollide
    sound:
      collection: WeakHit
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Effects/drop.ogg
      params:
        volume: 2
  - type: DamageOnHighSpeedImpact
    damage:
      types:
        Blunt: 5
    soundHit:
      collection: MetalThud
  - type: CollisionWake
  - type: GravityAffected
  - type: Physics
    bodyType: Dynamic
    fixedRotation: false
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.25,-0.25,0.25,0.25"
        density: 20
        mask: [ ItemMask ]
        restitution: 0.3
        friction: 0.2
  - type: Sprite
    drawdepth: Items
    noRot: false
    sprite: _Dystopia/Objects/Materials/Parts/parts.rsi
    state: gear_3
    layers:
    - state: gear_3
      map: [ base ]
  - type: Pullable
  - type: DamageExaminable
  - type: Rotatable
    increment: 30
  - type: Damageable
    damageModifierSet: FlimsyMetallic
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:DoActsBehavior
        acts: [ Destruction ]
  - type: Appearance
  - type: PhysicalComposition
    materialComposition:
      DystopiaCastIron: 50
  - type: Stack
    stackType: DystopiaGear
    baseLayer: base
    layerStates: [ gear, gear_2, gear_3 ]

