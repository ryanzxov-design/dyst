# SPDX-License-Identifier: AGPL-3.0-or-later
# Dystopia: ступень ×3 переработки металлов — мельница (дроблёная → молотая руда 1:1) и обогащение с водой
# (2 горсти молотой → 3 горсти гравитационного концентрата + 1 горсть песка). Концентрат плавится 1:1 с малым шлаком.
# Самостоятельные сущности, без parent.

- type: entity
  id: DystopiaGroundHematite
  name: ground hematite
  description: Ore milled to flour. Wash it on a concentrating table to get concentrate.
  suffix: Iron, Full
  components:
  - type: Item
    size: Normal
    sprite: _Dystopia/Objects/Materials/Metals/ore_processing.rsi
    heldPrefix: ground_hematite
  - type: Animateable
  - type: Clickable
  - type: InteractionOutline
  - type: MovedByPressure
  - type: EmitSoundOnCollide
    sound:
      collection: WeakHit
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Effects/drop.ogg
      params:
        volume: 2
  - type: DamageOnHighSpeedImpact
    damage:
      types:
        Blunt: 5
    soundHit:
      collection: MetalThud
  - type: CollisionWake
  - type: GravityAffected
  - type: Physics
    bodyType: Dynamic
    fixedRotation: false
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeCircle
          radius: 0.2
        density: 20
        mask: [ ItemMask ]
        restitution: 0.3
        friction: 0.2
  - type: Sprite
    drawdepth: Items
    noRot: false
    sprite: _Dystopia/Objects/Materials/Metals/ore_processing.rsi
    state: ground_hematite
  - type: Pullable
  - type: DamageExaminable
  - type: Rotatable
    increment: 30
  - type: Damageable
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:DoActsBehavior
        acts: [ Destruction ]
  - type: Appearance
  - type: Material
  - type: Tag
    tags: [ Ore ]
  - type: Stack
    stackType: DystopiaGroundHematite
  - type: PhysicalComposition
    materialComposition:
      DystopiaGroundHematite: 100

