        volume: 2
  - type: DamageOnHighSpeedImpact
    damage:
      types:
        Blunt: 5
    soundHit:
      collection: MetalThud
  - type: CollisionWake
  - type: GravityAffected
  - type: Physics
    bodyType: Dynamic
    fixedRotation: false
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.25,-0.25,0.25,0.25"
        density: 20
        mask: [ ItemMask ]
        restitution: 0.3
        friction: 0.2
  - type: Sprite
    sprite: _Dystopia/Objects/Materials/Petrochem/products.rsi
    state: rubber_3
    layers:
    - state: rubber_3
      map: [ base ]
  - type: Pullable
  - type: DamageExaminable
  - type: Rotatable
    increment: 30
  - type: Damageable
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
