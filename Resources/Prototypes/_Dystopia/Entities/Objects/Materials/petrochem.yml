- type: entity
  id: DystopiaSheetRubber
  name: rubber
  description: "Sheets of vulcanised rubber: they stretch without tearing and let through neither water nor current."
  suffix: Rubber, Full
  components:
  - type: Item
    size: Normal
    sprite: _Dystopia/Objects/Materials/Petrochem/products.rsi
    heldPrefix: rubber
  - type: Animateable
  - type: Clickable
  - type: InteractionOutline
  - type: MovedByPressure
  - type: EmitSoundOnCollide
    sound:
      collection: WeakHit
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Effects/drop.ogg
