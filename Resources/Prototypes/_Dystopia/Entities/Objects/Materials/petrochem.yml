# Dystopia: нефть, шаг 3 — нефтехимия. Генератор gen_petrochem.py.
# Сажа, каучук, резина. Самостоятельные сущности, без parent.

- type: entity
  id: DystopiaCarbonBlack
  name: carbon black
  description: A greasy black powder that smudges at a glance. It is mixed into rubber to keep it from wearing away.
  suffix: Soot, Full
  components:
  - type: Item
    size: Normal
    sprite: _Dystopia/Objects/Materials/Petrochem/products.rsi
    heldPrefix: carbon_black
  - type: Animateable
  - type: Clickable
  - type: InteractionOutline
  - type: MovedByPressure
  - type: EmitSoundOnCollide
    sound:
      collection: WeakHit
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Effects/drop.ogg
      params:
        volume: 2
  - type: DamageOnHighSpeedImpact
    damage:
      types:
        Blunt: 5
    soundHit:
      collection: MetalThud
  - type: CollisionWake
  - type: GravityAffected
  - type: Physics
    bodyType: Dynamic
    fixedRotation: false
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeCircle
          radius: 0.2
        density: 20
        mask: [ ItemMask ]
        restitution: 0.3
        friction: 0.2
  - type: Sprite
    drawdepth: Items
    noRot: false
    sprite: _Dystopia/Objects/Materials/Petrochem/products.rsi
    state: carbon_black
  - type: Pullable
  - type: DamageExaminable
  - type: Rotatable
    increment: 30
  - type: Damageable
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:DoActsBehavior
        acts: [ Destruction ]
  - type: Appearance
  - type: Material
  - type: Stack
    stackType: DystopiaCarbonBlack
  - type: PhysicalComposition
    materialComposition:
      DystopiaCarbonBlack: 100

