  - type: Appearance
  - type: Material
  - type: Tag
    tags: [ Sheet ]
  - type: StaticPrice
    price: 0
  - type: PhysicalComposition
    materialComposition:
      DystopiaRubber: 100
  - type: Stack
    stackType: DystopiaRubber
    baseLayer: base
    layerStates: [ rubber, rubber_2, rubber_3 ]

