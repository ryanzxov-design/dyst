# Dystopia: металлы и сплавы Города (этап «Промышленность: вещества»). Самостоятельные сущности, без parent.
# Слитки. Золото, серебро и уран — ванильные слитки (уран — бывший лист урана).

- type: entity
  id: DystopiaIngotIron
  name: iron ingot
  description: A heavy bar of iron, cast in a mould.
  suffix: Full
  components:
  - type: Solution
    solution:
      canReact: false
      maxVol: 10.0
      reagents:
      - ReagentId: Iron
        Quantity: 10.0
    id: composite
  - type: Item
    size: Normal
    sprite: _Dystopia/Objects/Materials/Metals/ingots.rsi
    heldPrefix: iron
  - type: Animateable
  - type: Clickable
  - type: InteractionOutline
  - type: MovedByPressure
  - type: EmitSoundOnCollide
    sound:
      collection: WeakHit
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Effects/drop.ogg
      params:
        volume: 2
  - type: DamageOnHighSpeedImpact
    damage:
      types:
        Blunt: 5
    soundHit:
      collection: MetalThud
  - type: CollisionWake
  - type: GravityAffected
  - type: Physics
    bodyType: Dynamic
    fixedRotation: false
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.25,-0.25,0.25,0.25"
        density: 20
        mask: [ ItemMask ]
        restitution: 0.3
        friction: 0.2
  - type: Sprite
    drawdepth: Items
    noRot: false
    sprite: _Dystopia/Objects/Materials/Metals/ingots.rsi
    state: iron_3
    layers:
    - state: iron_3
      map: [ base ]
  - type: Pullable
  - type: DamageExaminable
  - type: Rotatable
    increment: 30
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:DoActsBehavior
        acts: [ Destruction ]
  - type: Appearance
  - type: Material
  - type: Tag
    tags: [ Ingot ]
  - type: Extractable
    grindableSolutionName: composite
  - type: PhysicalComposition
    materialComposition:
      DystopiaIron: 100
  - type: Stack
    stackType: DystopiaIngotIron
    baseLayer: base
    layerStates: [ iron, iron_2, iron_3 ]

