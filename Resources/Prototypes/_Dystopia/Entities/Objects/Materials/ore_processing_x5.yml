# SPDX-License-Identifier: AGPL-3.0-or-later
# Dystopia: ступень ×5 переработки металлов. Молотая руда (из мельницы) обогащается тремя путями:
# флотация — халькопирит, сфалерит, галенит, аргентит, касситерит (2 горсти молотой + 20 воды + 1 флотореагента →
# 5 флотоконцентрата + песок; у полиметаллических руд — партия ×4 с попутным концентратом);
# магнитная сепарация — гематит, хромит (2 горсти → 5 магнитного концентрата + песок, всухую);
# амальгамация — золото (2 горсти + 10 воды + 2 ртути → 5 амальгамы + песок; ртуть в тигле выкипает).
# Самостоятельные сущности, без parent.

- type: entity
  id: DystopiaMagneticHematite
  name: hematite magnetic concentrate
  description: Ore grains pulled out of ore flour by a magnetic drum. Melts with almost no slag.
  suffix: Iron, Full
  components:
  - type: Item
    size: Normal
    sprite: _Dystopia/Objects/Materials/Metals/ore_processing_x5.rsi
    heldPrefix: magnetic_hematite
  - type: Animateable
  - type: Clickable
  - type: InteractionOutline
  - type: MovedByPressure
  - type: EmitSoundOnCollide
    sound:
      collection: WeakHit
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Effects/drop.ogg
      params:
        volume: 2
  - type: DamageOnHighSpeedImpact
    damage:
      types:
        Blunt: 5
    soundHit:
      collection: MetalThud
  - type: CollisionWake
  - type: GravityAffected
  - type: Physics
    bodyType: Dynamic
    fixedRotation: false
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeCircle
          radius: 0.2
        density: 20
        mask: [ ItemMask ]
        restitution: 0.3
        friction: 0.2
  - type: Sprite
    drawdepth: Items
    noRot: false
    sprite: _Dystopia/Objects/Materials/Metals/ore_processing_x5.rsi
    state: magnetic_hematite
  - type: Pullable
  - type: DamageExaminable
  - type: Rotatable
    increment: 30
  - type: Damageable
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:DoActsBehavior
        acts: [ Destruction ]
  - type: Appearance
  - type: Material
  - type: Tag
    tags: [ Ore ]
  - type: Stack
    stackType: DystopiaMagneticHematite
  - type: PhysicalComposition
    materialComposition:
      DystopiaMagneticHematite: 100

