# Dystopia. Все предметы в этом файле самостоятельные: без parent, все свойства выписаны явно.

# Самостоятельный предмет: все свойства выписаны явно (раньше: parent BaseItem)

- type: entity
  id: DystopiaPaymentTerminal
  name: "платёжный терминал"
  description: "Терминал оплаты по ID-карте. Продавец выставляет счёт, покупатель прикладывает карту или КПК."
  components:
  - type: Item
    size: Small
    sprite: _Dystopia/Objects/Devices/payment_terminal.rsi
  - type: Animateable
  - type: Clickable
  - type: InteractionOutline
  - type: MovedByPressure
  - type: EmitSoundOnCollide
    sound:
      collection: WeakHit
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Effects/drop.ogg
      params:
        volume: 2
  - type: DamageOnHighSpeedImpact
    damage:
      types:
        Blunt: 5
    soundHit:
      collection: MetalThud
  - type: CollisionWake
  - type: GravityAffected
  - type: Physics
    bodyType: Dynamic
    fixedRotation: false
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.25,-0.25,0.25,0.25"
        density: 20
        mask:
        - ItemMask
        restitution: 0.3
        friction: 0.2
  - type: Sprite
    drawdepth: Items
    noRot: false
    sprite: _Dystopia/Objects/Devices/payment_terminal.rsi
    state: icon
  - type: Pullable
  - type: DamageExaminable
  - type: Rotatable
    increment: 30
  - type: PaymentTerminal
  - type: ActivatableUI
    key: enum.PaymentTerminalUiKey.Key
  - type: UserInterface
    interfaces:
      enum.PaymentTerminalUiKey.Key:
        type: PaymentTerminalBoundUserInterface
