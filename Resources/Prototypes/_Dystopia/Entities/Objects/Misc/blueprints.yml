# SPDX-License-Identifier: AGPL-3.0-or-later
# Dystopia: крафты производства (первый заход, без нефти). Предметы — в руки из меню. Постройки — по
# призраку: первый ресурс (у сложных машин — чертёж) закладывает недострой, остальные ресурсы вставляют по
# одному, последний превращает недострой в машину. Разборка ломом возвращает всё. Цены — crafts_table.py,
# генератор gen_crafts.py.
# Чертежи сложных машин. Пока только спавн: делать их будет научная служба.

- type: Tag
  id: DystopiaBlueprintContactApparatus

- type: entity
  id: DystopiaBlueprintContactApparatus
  name: blueprint
  description: A blueprint from the scientific service. Lay it down where the machine will stand and start building on it.
  components:
  - type: Item
    size: Small
    sprite: _Dystopia/Objects/Misc/blueprint.rsi
  - type: Animateable
  - type: Clickable
  - type: InteractionOutline
  - type: MovedByPressure
  - type: EmitSoundOnCollide
    sound:
      collection: WeakHit
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Effects/drop.ogg
      params:
        volume: 2
  - type: DamageOnHighSpeedImpact
    damage:
      types:
        Blunt: 5
    soundHit:
      collection: MetalThud
  - type: CollisionWake
  - type: GravityAffected
  - type: Physics
    bodyType: Dynamic
    fixedRotation: false
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.25,-0.25,0.25,0.25"
        density: 20
        mask: [ ItemMask ]
        restitution: 0.3
        friction: 0.2
  - type: Sprite
    sprite: _Dystopia/Objects/Misc/blueprint.rsi
    state: icon
  - type: Pullable
  - type: DamageExaminable
  - type: Rotatable
    increment: 30
  - type: Tag
    tags:
    - DystopiaBlueprintContactApparatus
  - type: Appearance
  - type: Reactive
    groups:
      Flammable: [ Touch ]
      Extinguish: [ Touch ]
  - type: ExtinguishableSetCollisionWake
  - type: Flammable
    fireSpread: true
    alwaysCombustible: true
    canExtinguish: true
    damage:
      types:
        Heat: 1
  - type: FireVisuals
    sprite: Effects/fire.rsi
    normalState: fire
  - type: Damageable
    damageModifierSet: Wood
  - type: Injurable
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 15
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          Ash:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ Destruction ]
  - type: PhysicalComposition
    materialComposition:
      PrinterPaper: 100

