# Dystopia. Все предметы в этом файле самостоятельные: без parent, все свойства выписаны явно.

# Самостоятельный предмет: все свойства выписаны явно (раньше: parent DoorElectronics)

- type: entity
  id: DoorElectronicsDystopiaConsul
  name: door electronics
  description: An electronics board used in doors and airlocks.
  suffix: Город, Кабинет Консула, Locked
  components:
  - type: Item
    size: Small
    storedRotation: -90
  - type: Animateable
  - type: Clickable
  - type: InteractionOutline
  - type: MovedByPressure
  - type: EmitSoundOnCollide
    sound:
      collection: WeakHit
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Effects/drop.ogg
      params:
        volume: 2
  - type: DamageOnHighSpeedImpact
    damage:
      types:
        Blunt: 5
    soundHit:
      collection: MetalThud
  - type: CollisionWake
  - type: GravityAffected
  - type: Physics
    bodyType: Dynamic
    fixedRotation: false
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.25,-0.25,0.25,0.25"
        density: 20
        mask:
        - ItemMask
        restitution: 0.3
        friction: 0.2
  - type: Sprite
    drawdepth: Items
    noRot: false
    sprite: _Dystopia/Objects/Devices/door_electronics.rsi
    state: door_electronics
  - type: Pullable
  - type: DamageExaminable
  - type: Rotatable
    increment: 30
  - type: PhysicalComposition
    materialComposition:
      Glass: 200
    chemicalComposition:
      Silicon: 20
  - type: Circuitboard
  - type: Tag
    tags:
    - DoorElectronics
  - type: DoorElectronics
  - type: AccessReader
    access: [["DystopiaConsul"]]
  - type: ActivatableUI
    key: enum.DoorElectronicsConfigurationUiKey.Key
    requiredItems:
      tags:
      - DoorElectronicsConfigurator
  - type: UserInterface
    interfaces:
      enum.DoorElectronicsConfigurationUiKey.Key:
        type: DoorElectronicsBoundUserInterface
