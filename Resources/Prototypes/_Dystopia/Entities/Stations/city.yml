# Станция-прототип Города.
# В отличие от StandardNanotrasenStation здесь нет космических частей:
# эвакуационного шаттла, прибытия (arrivals), ЦК, экспедиций, магнита, карго-шаттла.

- type: entity
  id: DystopiaCityStation
  parent:
    - BaseStation
    - BaseStationJobsSpawning
    - BaseStationRecords
    - BaseStationAlertLevels
  categories: [ HideSpawnMenu ]
  components:
    - type: Transform
    # Положения Города вместо ванильных уровней тревоги (меняет Консул через Консоль Управления Городом).
    - type: AlertLevel
      availableAlertLevels:
      - DystopiaNormal
      - DystopiaCurfew
      - DystopiaQuarantine
      - DystopiaMartialLaw
      - DystopiaSiege
      defaultAlertLevel: DystopiaNormal
      currentAlertLevel: DystopiaNormal
    # Банк Города: казна, личные счета, зарплаты и налоги (этап Э1).
    # Позже эти ставки будет менять Консул через Консоль Управления Городом.
    - type: CityBank
      treasury: 100000
      payIntervalMinutes: 10
      startingSalaries: 2
      # Фонды Города. Пополняются Консулом из казны (Консоль → «Фонды»).
      funds:
      - id: Rewards
        name: "Фонд поощрений"
        description: "Из него Гражданский Инспектор печатает векселя на вексельном принтере."
        balance: 2000
      # Зарплата за один период (10 минут), в марках, до налога
      salaries:
        # Администрация Города
        DystopiaConsul: 300
        DystopiaAdjutant: 150
        DystopiaCivilInspector: 200
        # Городская Стража
        DystopiaGuardCaptain: 220
        DystopiaGuardSergeant: 150
        DystopiaGuardsman: 120
        DystopiaGuardRecruit: 70
        # Внешний Патруль
        DystopiaPraetorian: 200
        DystopiaGrenadier: 160
        DystopiaStormtrooper: 160
        DystopiaSoldier: 130
        # Санитарная Служба
        DystopiaChiefSanitaryDoctor: 200
        DystopiaHealer: 130
        DystopiaDisinfector: 130
        DystopiaPharmacist: 120
        DystopiaJuniorOrderly: 70
        # Промышленная Служба
        DystopiaChiefIndustrial: 200
        DystopiaEngineer: 130
        DystopiaJuniorTechnician: 70
        # Научная Служба
        DystopiaScienceDirector: 200
        DystopiaAugmentologist: 150
        DystopiaPathobiologist: 140
        DystopiaResearcher: 120
        DystopiaLabAssistant: 70
        # Горожане
        DystopiaProletarian: 40
        DystopiaShopkeeper: 50
      # Налог в процентах от дохода
      taxRates:
        # Администрация Города
        DystopiaConsul: 0
        DystopiaAdjutant: 10
        DystopiaCivilInspector: 10
        # Городская Стража
        DystopiaGuardCaptain: 10
        DystopiaGuardSergeant: 10
        DystopiaGuardsman: 10
        DystopiaGuardRecruit: 10
        # Внешний Патруль
        DystopiaPraetorian: 5
        DystopiaGrenadier: 10
        DystopiaStormtrooper: 10
        DystopiaSoldier: 10
        # Санитарная Служба
        DystopiaChiefSanitaryDoctor: 10
        DystopiaHealer: 10
        DystopiaDisinfector: 10
        DystopiaPharmacist: 10
        DystopiaJuniorOrderly: 10
        # Промышленная Служба
        DystopiaChiefIndustrial: 10
        DystopiaEngineer: 10
        DystopiaJuniorTechnician: 10
        # Научная Служба
        DystopiaScienceDirector: 10
        DystopiaAugmentologist: 10
        DystopiaPathobiologist: 10
        DystopiaResearcher: 10
        DystopiaLabAssistant: 10
        # Горожане
        DystopiaProletarian: 20
        DystopiaShopkeeper: 30
    # Свод законов Города: Основной закон и шкала санкций. Каждый раунд начинается с них.
    # Консул правит статьи и шкалу через Консоль Управления Городом (вкладка «Законы»).
    # Реестр граждан (социоучёт). Номер гражданина получают профессии из loyaltyNorms и outsideLoyalty;
    # число — норма лояльности, с которой гражданин начинает смену (потолок — maxLoyalty).
    - type: CityRegistry
      maxLoyalty: 50
      outsideLoyalty:
      - DystopiaConsul # вне учёта: Консул не может быть лоялен сам себе
      loyaltyNorms:
        # Администрация Города
        DystopiaCivilInspector: 40
        DystopiaAdjutant: 25
        # Городская Стража
        DystopiaGuardCaptain: 40
        DystopiaGuardSergeant: 25
        DystopiaGuardsman: 20
        DystopiaGuardRecruit: 15
        # Внешний Патруль
        DystopiaPraetorian: 25
        DystopiaGrenadier: 20
        DystopiaStormtrooper: 20
        DystopiaSoldier: 20
        # Главы служб
        DystopiaChiefSanitaryDoctor: 35
        DystopiaChiefIndustrial: 35
        DystopiaScienceDirector: 35
        # Рядовые работники служб
        DystopiaHealer: 15
        DystopiaDisinfector: 15
        DystopiaPharmacist: 15
        DystopiaJuniorOrderly: 15
        DystopiaEngineer: 15
        DystopiaJuniorTechnician: 15
        DystopiaAugmentologist: 15
        DystopiaPathobiologist: 15
        DystopiaResearcher: 15
        DystopiaLabAssistant: 15
        # Горожане
        DystopiaProletarian: 10
        DystopiaShopkeeper: 10
    - type: CityLaws
      generalProvision: "Повторное нарушение той же статьи в течение смены даёт должностному лицу право назначить санкцию на класс выше."
      # Вторая колонка (disciplinary) — что происходит с лояльностью; loyaltyMin/Max — сколько очков можно снять,
      # dismissal — отстранение от должности и обнуление лояльности.
      sanctions:
      - class: "I"
        legal: "10 минут заключения или предупреждение (на усмотрение стражника)"
        disciplinary: "Снижение лояльности на 0–5 очков"
        loyaltyMin: 0
        loyaltyMax: 5
      - class: "II"
        legal: "15 минут заключения"
        disciplinary: "Снижение лояльности на 5–10 очков"
        loyaltyMin: 5
        loyaltyMax: 10
      - class: "III"
        legal: "30 минут заключения"
        disciplinary: "Снижение лояльности на 10–15 очков"
        loyaltyMin: 10
        loyaltyMax: 15
      - class: "IV"
        legal: "Смертная казнь"
        disciplinary: "Отстранение от должности и обнуление лояльности"
        dismissal: true
      - class: "V"
        legal: "Уничтожение на месте"
        disciplinary: "Отстранение от должности и обнуление лояльности"
        dismissal: true
      # classes — какие классы можно назначить по статье (пусто — любой); повторное нарушение открывает класс выше.
      laws:
      - number: 1
        title: "О верховной власти"
        text: "Верховная и единоличная власть в Городе принадлежит Консулу. Распоряжения Консула подлежат безусловному и незамедлительному исполнению всеми гражданами и должностными лицами Города. Обжалованию и обсуждению распоряжения Консула не подлежат."
        sanction: "Класс III. Неисполнение распоряжения, повлёкшее тяжкие последствия, — класс V."
        classes: ["III", "V"]
      - number: 2
        title: "О должностных лицах"
        text: "Должностные лица Города действуют от имени Консула и в пределах возложенных на них полномочий. Воспрепятствование законной деятельности должностного лица запрещается."
        sanction: "Класс II. Применение насилия в отношении должностного лица — класс IV."
        classes: ["II", "IV"]
      - number: 3
        title: "О трудовой повинности"
        text: "Каждый трудоспособный гражданин обязан получить трудовое назначение у Гражданского Инспектора и добросовестно его исполнять. Уклонение от трудовой повинности признаётся нарушением общественного порядка."
        sanction: "Класс I."
        classes: ["I"]
      - number: 4
        title: "О документах, удостоверяющих личность"
        text: "Каждый гражданин обязан иметь при себе ID-карту и предъявлять её по требованию должностного лица. Использование ID-карты, выданной на имя другого лица, запрещается."
        sanction: "Задержание до установления личности. Использование чужой ID-карты — класс III."
        classes: ["III"]
      - number: 5
        title: "О собраниях"
        text: "Проведение собраний, сборов, шествий и иных скоплений граждан без разрешения Администрации Города запрещается."
        sanction: "Для участников — класс II. Для организаторов — класс IV."
        classes: ["II", "IV"]
      - number: 6
        title: "О порядке пересечения границы Города"
        text: "Выход за пределы стен Города допускается исключительно при наличии пропуска, выданного Гражданским Инспектором. Лицо, вернувшееся из-за стен, подлежит обязательному санитарному осмотру."
        sanction: "Класс V."
        classes: ["V"]
      - number: 7
        title: "О санитарном контроле"
        text: "Граждане обязаны проходить санитарный осмотр по требованию Санитарной Службы и незамедлительно сообщать о выявленных у себя или иных лиц признаках заражения. Сокрытие признаков заражения приравнивается к умышленному распространению заражения."
        sanction: "Уклонение от осмотра — класс II с принудительной изоляцией. Сокрытие заражения — класс V."
        classes: ["II", "V"]
      - number: 8
        title: "О религиозных объединениях"
        text: "На территории Города запрещаются создание религиозных культов и объединений, участие в них, проведение религиозных обрядов, а также хранение и распространение религиозной атрибутики и материалов. Укрывательство участников религиозных культов приравнивается к участию в них."
        sanction: "Участие, хранение и распространение — класс IV. Создание культа, руководство им и проведение обрядов — класс V."
        classes: ["IV", "V"]
      - number: 9
        title: "О средствах связи"
        text: "Изготовление, хранение и использование несанкционированных средств радиосвязи, а также выход на неавторизованные частоты запрещаются."
        sanction: "Класс II с конфискацией средств связи."
        classes: ["II"]
      - number: 10
        title: "Об оружии"
        text: "Ношение, хранение и изготовление огнестрельного оружия лицами, не состоящими на службе Города, запрещаются."
        sanction: "Класс IV с конфискацией оружия. Применение оружия — класс V."
        classes: ["IV", "V"]
      - number: 11
        title: "Об имуществе Города"
        text: "Всё имущество на территории Города является собственностью Города. Хищение, повреждение и уничтожение имущества Города запрещаются."
        sanction: "Класс II с изъятием средств в возмещение ущерба. Хищение оружия, медикаментов или имущества служб — класс IV."
        classes: ["II", "IV"]
      - number: 12
        title: "О гражданском долге"
        text: "Каждый гражданин обязан сообщать должностным лицам о ставших ему известными нарушениях законов Города. Недонесение о нарушении признаётся соучастием в нём. Гражданину, сообщившему о нарушении, может быть назначено поощрение."
        sanction: "По классу статьи, о нарушении которой не было сообщено."
        classes: []
      - number: 13
        title: "О генетической чистоте"
        text: "Каждому лицу с повреждённым генотипом запрещается занимать руководящие государственные должности и должности в органах правопорядка. Каждое лицо с опасным генотипом подлежит немедленному устранению."
        sanction: "Запрещённая работа для лиц с повреждённым генотипом — класс III. Наличие опасного генотипа — класс V."
        classes: ["III", "V"]
