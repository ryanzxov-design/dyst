# Dystopia. Все предметы в этом файле самостоятельные: без parent, все свойства выписаны явно.

# Самостоятельный предмет: все свойства выписаны явно (раньше: parent SpawnPointJobBase)

- type: entity
  id: SpawnPointDystopiaConsul
  name: консул
  suffix: Job Spawn
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Marker
  - type: Clickable
  - type: InteractionOutline
  - type: Tag
    tags:
    - ForceFixRotations
  - type: Sprite
    drawdepth: Overdoors
    sprite: Markers/jobs.rsi
    layers:
    - state: green
    - state: captain
  - type: SpawnPoint
    spawn_type: Job
    job_id: DystopiaConsul
