  placement:
    mode: SnapgridCenter
  components:
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 175
      behaviors:
      - !type:SpawnEntitiesBehavior
        offset: 0
        spawn:
          MachineFrameDestroyed:
            min: 1
            max: 1
  - type: Damageable
    damageModifierSet: SteelMod
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Transform
    anchored: true
    noRot: true
  - type: Clickable
  - type: GravityAffected
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.25,-0.45,0.25,0.45"
        mask:
        - MachineMask
        layer:
        - MachineLayer
        density: 200
  - type: Pullable
  - type: Tag
    tags:
    - Structure
  - type: Animateable
  - type: InteractionOutline
  - type: Anchorable
    delay: 2
  - type: ApcPowerReceiver
    powerLoad: 200
  - type: ExtensionCableReceiver
  - type: LightningTarget
    priority: 1
  - type: Sprite
    sprite: _Dystopia/Structures/Machines/ration_dispenser.rsi
    snapCardinals: true
    layers:
    - state: "off"
    - state: normal-unshaded
      shader: unshaded
  - type: AccessReader
    access: [["DystopiaFactory"], ["DystopiaGreenhouse"], ["DystopiaCanteen"], ["DystopiaTechnical"]]
  - type: PointLight
    radius: 1.5
    energy: 1.2
    color: "#7FA7D9"
  - type: CityRationDispenser
    cooldownMinutes: 20
    items:
    - FoodSnackNutribrick
    - DrinkWaterBottleFull
