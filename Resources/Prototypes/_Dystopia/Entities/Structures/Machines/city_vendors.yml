# Dystopia. Все предметы в этом файле самостоятельные: без parent, все свойства выписаны явно.

# Самостоятельный предмет: все свойства выписаны явно (раньше: parent BaseMachinePowered, BaseMachineDestructible)

- type: entity
  id: DystopiaVendingCity
  name: "городской автомат"
  description: "Автомат Городского снабжения. Оплата по ID-карте."
  placement:
    mode: SnapgridCenter
  components:
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 175
      behaviors:
      - !type:SpawnEntitiesBehavior
        offset: 0
        spawn:
          MachineFrameDestroyed:
            min: 1
            max: 1
  - type: Damageable
    damageModifierSet: SteelMod
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Transform
    anchored: true
    noRot: true
  - type: Clickable
  - type: GravityAffected
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.25,-0.45,0.25,0.45"
        mask:
        - MachineMask
        layer:
        - MachineLayer
        density: 200
  - type: Pullable
  - type: Tag
    tags:
    - Structure
  - type: Animateable
  - type: InteractionOutline
  - type: Anchorable
    delay: 2
  - type: ApcPowerReceiver
    powerLoad: 200
  - type: ExtensionCableReceiver
  - type: LightningTarget
    priority: 1
  - type: Sprite
    sprite: _Dystopia/Structures/Machines/city_vendor.rsi
    snapCardinals: true
    layers:
    - state: "off"
    - state: normal-unshaded
      shader: unshaded
  - type: ActivatableUI
    key: enum.CityVendorUiKey.Key
  - type: ActivatableUIRequiresPower
  - type: UserInterface
    interfaces:
      enum.CityVendorUiKey.Key:
        type: CityVendorBoundUserInterface
  - type: PointLight
    radius: 1.5
    energy: 1.2
    color: "#D9B44A"
  - type: CityVendor
    inventory:
    - item: FoodSnackNutribrick
      price: 15
      amount: 20
    - item: FoodBreadPlain
      price: 20
      amount: 10
    - item: FoodSnackChips
      price: 20
      amount: 10
    - item: FoodSnackMREBrownie
      price: 25
      amount: 10
    - item: DrinkWaterBottleFull
      price: 10
      amount: 20
    - item: DrinkColaCan
      price: 25
      amount: 10
# Самостоятельный предмет: все свойства выписаны явно (раньше: parent BaseMachinePowered, BaseMachineDestructible)

- type: entity
