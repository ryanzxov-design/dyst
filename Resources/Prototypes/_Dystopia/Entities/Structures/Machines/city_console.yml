# Dystopia. Все предметы в этом файле самостоятельные: без parent, все свойства выписаны явно.

# Самостоятельный предмет: все свойства выписаны явно (раньше: parent BaseMachinePowered, BaseMachineDestructible)

- type: entity
  id: ComputerDystopiaCityConsole
  name: "Консоль Управления Городом"
  description: "Монолит, через который Консул управляет казной, законами и положениями Города."
  placement:
    mode: SnapgridCenter
  components:
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 175
      behaviors:
      - !type:SpawnEntitiesBehavior
        offset: 0
        spawn:
          MachineFrameDestroyed:
            min: 1
            max: 1
  - type: Damageable
    damageModifierSet: SteelMod
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Transform
    anchored: true
    noRot: true
  - type: Clickable
  - type: GravityAffected
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-1.45,-1.45,1.45,1.45"
        density: 1000
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Pullable
  - type: Tag
    tags:
    - Structure
  - type: Animateable
  - type: InteractionOutline
  - type: Anchorable
    delay: 2
  - type: ApcPowerReceiver
    powerLoad: 1500
  - type: ExtensionCableReceiver
  - type: LightningTarget
    priority: 1
  - type: Sprite
    sprite: _Dystopia/Structures/Machines/city_console.rsi
    noRot: true
    layers:
    - state: base
    - state: screen
      map: ["screen"]
      shader: unshaded
  - type: Computer
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ComputerVisuals.Powered:
        screen:
          true: {visible: true}
          false: {visible: false}
  - type: LitOnPowered
  - type: PointLight
    radius: 3
    energy: 2.0
    color: "#78BEE1"
    enabled: false
    castShadows: false
  - type: AccessReader
    access: [["DystopiaConsul"]]
  - type: ActivatableUIRequiresAccess
  - type: ActivatableUIRequiresPower
  - type: CityConsole
  - type: ActivatableUI
    key: enum.CityConsoleUiKey.Key
  - type: UserInterface
    interfaces:
      enum.CityConsoleUiKey.Key:
        type: CityConsoleBoundUserInterface
