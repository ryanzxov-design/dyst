# Dystopia. Все предметы в этом файле самостоятельные: без parent, все свойства выписаны явно.

# Самостоятельный предмет: все свойства выписаны явно (раньше: parent BaseMachinePowered, BaseMachineDestructible)

- type: entity
  id: ComputerDystopiaVexelPrinter
  name: "вексельный принтер"
  description: "Печатает векселя Города на предъявителя. Деньги берутся из Фонда поощрений."
  placement:
    mode: SnapgridCenter
  components:
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 175
      behaviors:
      - !type:SpawnEntitiesBehavior
        offset: 0
        spawn:
          MachineFrameDestroyed:
            min: 1
            max: 1
  - type: Damageable
    damageModifierSet: SteelMod
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Transform
    anchored: true
    noRot: false
  - type: Clickable
  - type: GravityAffected
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.35,-0.45,0.35,0.35"
        density: 190
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Pullable
  - type: Tag
    tags:
    - Structure
  - type: Animateable
  - type: InteractionOutline
  - type: Anchorable
    delay: 2
  - type: ApcPowerReceiver
    powerLoad: 200
  - type: ExtensionCableReceiver
  - type: LightningTarget
    priority: 1
  - type: Sprite
    sprite: _Dystopia/Structures/Machines/vexel_printer.rsi
    layers:
    - state: base
    - state: screen
      map: ["screen"]
      shader: unshaded
  - type: Computer
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ComputerVisuals.Powered:
        screen:
          true: {visible: true}
          false: {visible: false}
  - type: LitOnPowered
  - type: PointLight
    radius: 1.2
    energy: 1.2
    color: "#78BEE1"
    enabled: false
    castShadows: false
  - type: AccessReader
    access: [["DystopiaInspection"]]
  - type: ActivatableUIRequiresAccess
  - type: ActivatableUIRequiresPower
  - type: VexelPrinter
  - type: ActivatableUI
    key: enum.VexelPrinterUiKey.Key
  - type: UserInterface
    interfaces:
      enum.VexelPrinterUiKey.Key:
        type: VexelPrinterBoundUserInterface
