  suffix: Lithium (spodumene)
  placement:
    mode: SnapgridCenter
    snap: [ Wall ]
  components:
  - type: OreVein
    oreChance: 1.0
    currentOre: DystopiaSpodumene
  - type: Sprite
    layers:
    - state: spodumene
      sprite: _Dystopia/Structures/Walls/ore_veins.rsi
      map:
      - enum.MiningScannerVisualLayers.Overlay
    drawdepth: Walls
    sprite: Structures/Walls/stone-snow.rsi
  - type: Transform
    anchored: true
    noRot: true
  - type: Clickable
  - type: GravityAffected
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        density: 1000
        mask: [ FullTileMask ]
        layer: [ WallLayer ]
  - type: Pullable
  - type: Tag
    tags: [ Structure ]
  - type: Anchorable
    flags: [ Anchorable ]
  - type: Rotatable
  - type: RangedDamageSound
    soundGroups:
      Brute:
        collection: MetalBulletImpact
    soundTypes:
      Heat:
        collection: MetalLaserImpact
  - type: Wall
  - type: IsRoof
  - type: Icon
    state: full
    sprite: Structures/Walls/stone-snow.rsi
  - type: PlacementReplacement
    key: walls
  - type: Airtight
  - type: StaticPrice
    price: 75
  - type: RadiationBlocker
    resistance: 2
  - type: BlockWeather
  - type: SunShadowCast
  - type: Occluder
  - type: StructureAlignerPylon
    pylons: [ Door, Firelock ]
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 150
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/break_stone.ogg
          params:
            volume: -6
  - type: Damageable
    damageModifierSet: RockMod
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: SoundOnGather
  - type: Gatherable
    toolWhitelist:
      tags: [ Pickaxe ]
  - type: IconSmooth
    key: stone
    index: 0
    base: stone
  - type: MiningScannerViewable

