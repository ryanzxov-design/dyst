# Семя → Росток → Киста → Наросты. Самостоятельные сущности, без parent.
# Наросты проходят под незаваренными дверями; под самой кистой тоже нарост.
# Горит (DystopiaFleshBurnable): струя огнемёта поджигает плоть на клетках, над которыми пролетает,
# пожар на клетке поджигает плоть на ней. Цепной реакции нет.

# --- Росток: через минуту становится Кистой ---
- type: entity
  id: DystopiaFleshSeedling
  name: росток плоти
  description: Из пола тянется пульсирующий мясистый побег. Его стоит сжечь, пока он не вырос.
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Clickable
  - type: InteractionOutline
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        hard: false
        shape: !type:PhysShapeAabb
          bounds: "-0.3,-0.3,0.3,0.3"
        layer:
        - MidImpassable
  - type: Sprite
    sprite: _Dystopia/Structures/FleshCult/seedling.rsi
    state: seedling
    drawdepth: Objects
  - type: Damageable
    damageModifierSet: DystopiaFlesh
  - type: Injurable
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 20
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/gib1.ogg
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Temperature
    temperature: 293.15
    heatCapacity: 5000
  - type: AtmosExposed
  - type: TemperatureDamage
    heatDamage:
      types:
        Heat: 5
    coldDamage: {}
    coldDamageThreshold: 0
  - type: Flammable
    fireSpread: false
    damage:
      types:
        Heat: 3
  - type: Reactive
    groups:
      Flammable: [Touch]
      Extinguish: [Touch]
  - type: DystopiaFleshSeedling
    growTime: 60
  - type: DystopiaFleshBurnable
    burnTime: 6
    burnDamage:
      types:
        Heat: 4

# --- Киста: растит наросты, вокруг — ядовитая зона со спорами ---
- type: entity
  id: DystopiaFleshCyst
  name: киста плоти
  description: Раздутый мясной мешок. Из пор сочатся едкие споры — без противогаза не подходить.
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
    noRot: true
  - type: Clickable
  - type: InteractionOutline
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.4"
        density: 200
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Sprite
    sprite: _Dystopia/Structures/FleshCult/cyst.rsi
    noRot: true
    drawdepth: Objects
    layers:
    - state: cyst
    - state: glow
      shader: unshaded
  - type: PointLight
    radius: 2.5
    energy: 0.8
    color: "#9AB840"
    castShadows: false
  - type: Damageable
    damageModifierSet: DystopiaFlesh
  - type: Injurable
    damageContainer: StructuralBiological
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 150
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/gib3.ogg
      - !type:SpawnEntitiesBehavior
        spawn:
          DystopiaBiomassChunk:
            min: 1
            max: 2
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Temperature
    temperature: 293.15
    heatCapacity: 15000
  - type: AtmosExposed
  - type: TemperatureDamage
    heatDamage:
      types:
        Heat: 8
    coldDamage: {}
    coldDamageThreshold: 0
  - type: Flammable
    fireSpread: true
    damage:
      types:
        Heat: 4
  - type: Reactive
    groups:
      Flammable: [Touch]
      Extinguish: [Touch]
  - type: DystopiaFleshCyst
    maxGrowths: 30
    spreadInterval: 4
    zoneRadius: 2.5
    zoneDamage:
      types:
        Poison: 1.5
  # Горит: 5 Heat/с (x2.5 от плоти) — киста сгорает примерно за 12 секунд горения
  - type: DystopiaFleshBurnable
    burnTime: 10
    burnDamage:
      types:
        Heat: 5
  # Споры: видимая граница ядовитой зоны
  - type: DystopiaParticleEmitter
    emitters:
    # Облако спор: тусклые жёлто-зелёные клочья, медленно дрейфуют во всей зоне
    - rate: 28
      lifetime: 1.6,3.2
      speed: 0.05,0.25
      spread: 360
      alignToVelocity: false
      inheritVelocity: 0
      drag: 0.5
      jitter: 2.5
      size: 2,3
      additive: false
      colors:
      - "#7E9A3000"
      - "#8FAF3A6E"
      - "#6E8A2A50"
      - "#5A702000"
    # Светящиеся споры: мелкие яркие точки, мерцают
    - rate: 8
      lifetime: 1.0,2.2
      speed: 0.1,0.4
      spread: 360
      alignToVelocity: false
      inheritVelocity: 0
      drag: 0.4
      jitter: 2.3
      size: 1,1
      additive: true
      flicker: 0.5
      colors:
      - "#D2E870FF"
      - "#9AB84080"
      - "#6E8A2A00"

# --- Нарост: замедляет и жжёт всех, кроме культистов; переваривает трупы ---
- type: entity
  id: DystopiaFleshGrowth
  name: нарост плоти
  description: Пол затянут живым мясом. Оно липнет к подошвам и разъедает кожу.
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Clickable
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        hard: false
        density: 7
        shape: !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        layer:
        - MidImpassable
  - type: Sprite
    sprite: _Dystopia/Structures/FleshCult/growth.rsi
    drawdepth: FloorObjects
    layers:
    - state: kudzu_33
      map: ["base"]
  # Вариант рисунка выбирается случайно при появлении (1–3)
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.DystopiaFleshGrowthVisuals.Variant:
        base:
          1: { state: kudzu_13 }
          2: { state: kudzu_23 }
          3: { state: kudzu_33 }
  - type: MeleeSound
    soundGroups:
      Brute:
        path: /Audio/Weapons/slash.ogg
  - type: Damageable
    damageModifierSet: DystopiaFlesh
  - type: Injurable
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 25
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Temperature
    temperature: 293.15
    heatCapacity: 21000
  - type: AtmosExposed
  - type: TemperatureDamage
    heatDamage:
      types:
        Heat: 5
    coldDamage: {}
    coldDamageThreshold: 0
  - type: Flammable
    fireSpread: true
    damage:
      types:
        Heat: 3
  - type: Reactive
    groups:
      Flammable: [Touch]
      Extinguish: [Touch]
  - type: SpeedModifierContacts
    walkSpeedModifier: 0.55
    sprintSpeedModifier: 0.55
    ignoreWhitelist:
      components:
      - DystopiaFleshCultist
  - type: DamageContacts
    damage:
      types:
        Caustic: 1
    ignoreWhitelist:
      components:
      - DystopiaFleshCultist
  - type: DystopiaFleshGrowth
    dissolveTime: 30
  # Горит: нарост выгорает примерно за 3 секунды (на соседей огонь сам не переходит)
  - type: DystopiaFleshBurnable
    burnTime: 6
    burnDamage:
      types:
        Heat: 4
