# Шея: плащи, накидки.
# Dystopia. Все предметы в этом файле самостоятельные: без parent, все свойства выписаны явно.

# Самостоятельный предмет: все свойства выписаны явно (раньше: parent ClothingNeckCloakCap)

- type: entity
  id: DystopiaClothingNeckConsulCloak
  name: белый плащ Консула
  description: Белый плащ с золотой каймой. Его видно издалека — и это главное.
  components:
  - type: Contraband
    severity: Corvax431
    allowedDepartments: [Command]
    allowedJobs: [Captain]
  - type: ToolRefinable
    qualityNeeded: Slicing
    verbText: refined-slice-verb-name
    verbDefaultTooltip: refined-slice-verb-message-default
    toolMissingQualityTooltip: refined-slice-verb-message-tool
    startRefinePopupType: small
    popupForUser: refined-butchered-success
    popupForOther: refined-butchered-success-others
    verbIcon: Interface/VerbIcons/cutlery.svg.192dpi.png
    sound: !type:SoundPathSpecifier
      path: /Audio/Items/Culinary/chop.ogg
    refineResult:
    - id: MaterialCloth1
      amount: 2
  - type: Item
    size: Small
  - type: Animateable
  - type: Clickable
  - type: InteractionOutline
  - type: MovedByPressure
  - type: EmitSoundOnCollide
    sound:
      collection: WeakHit
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Effects/drop.ogg
      params:
        volume: 2
  - type: DamageOnHighSpeedImpact
    damage:
      types:
        Blunt: 5
    soundHit:
      collection: MetalThud
  - type: CollisionWake
  - type: GravityAffected
  - type: Physics
    bodyType: Dynamic
    fixedRotation: false
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.25,-0.25,0.25,0.25"
        density: 20
        mask:
        - ItemMask
        restitution: 0.3
        friction: 0.2
  - type: Sprite
    drawdepth: Items
    noRot: false
    state: icon
    sprite: _Dystopia/Clothing/Neck/consul_cloak.rsi
  - type: Pullable
  - type: DamageExaminable
  - type: Rotatable
    increment: 30
  - type: Tag
    tags:
    - ClothMade
    - Recyclable
    - WhitelistChameleon
  - type: StaticPrice
    price: 10
  - type: FlavorProfile
    flavors:
    - fiber
  - type: Solution
    solution:
      reagents:
      - ReagentId: Fiber
        Quantity: 15
    id: food
  - type: Clothing
    quickEquip: true
    slots:
    - neck
    sprite: _Dystopia/Clothing/Neck/consul_cloak.rsi
  - type: PhysicalComposition
    materialComposition:
      Cloth: 100
  - type: Edible
    requiresSpecialDigestion: true
  - type: StealTarget
    stealGroup: HeadCloak
