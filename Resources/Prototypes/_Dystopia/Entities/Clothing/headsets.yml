    containers:
      key_slots:
      - EncryptionKeyDystopiaAdministration
      - EncryptionKeyDystopiaGuard
      - EncryptionKeyDystopiaPatrol
      - EncryptionKeyDystopiaSanitary
      - EncryptionKeyDystopiaScience
      - EncryptionKeyCommon
  - type: EncryptionKeyHolder
    keySlots: 6
  - type: Sprite
