# Самодельная гарнитура: пустая, на один ключ. Будет собираться работягами (крафт — позже).
- type: entity
  parent: ClothingHeadset
  id: ClothingHeadsetDystopiaMakeshift
  name: самодельная гарнитура
  description: Собрана из того, что нашлось на свалке. Держится на изоленте и надежде.
  components:
  - type: ContainerFill
    containers:
      key_slots: []
  - type: EncryptionKeyHolder
    keySlots: 1
  - type: Sprite
    sprite: _Dystopia/Clothing/Ears/Headsets/makeshift.rsi
  - type: Clothing
    sprite: _Dystopia/Clothing/Ears/Headsets/makeshift.rsi
