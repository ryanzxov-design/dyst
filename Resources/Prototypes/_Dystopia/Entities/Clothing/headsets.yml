# Гарнитуры Города. Спрайты — перекраски ванильной гарнитуры СБ в цвета служб.
# У всех служащих есть Общий канал (он же служебный: у горожан раций нет).
# Наушники (alt) — у Консула и глав служб.

- type: entity
  parent: ClothingHeadset
  id: ClothingHeadsetDystopiaAdministration
  name: гарнитура Администрации
  components:
  - type: ContainerFill
    containers:
      key_slots:
      - EncryptionKeyDystopiaAdministration
      - EncryptionKeyCommon
  - type: Sprite
    sprite: _Dystopia/Clothing/Ears/Headsets/administration.rsi
  - type: Clothing
    sprite: _Dystopia/Clothing/Ears/Headsets/administration.rsi

- type: entity
  parent: ClothingHeadsetAlt
  id: ClothingHeadsetAltDystopiaAdministration
  name: наушники Администрации
  components:
