- type: entity
  parent: ClothingUniformJumpsuitSec
  id: DystopiaClothingUniformGuard
  name: форма Городской Стражи
  description: Синяя форма Городской Стражи. Одинаковая у всех — как и лица под беретами.
  components:
  - type: Sprite
    sprite: _Dystopia/Clothing/Uniforms/guard.rsi
  - type: Clothing
    sprite: _Dystopia/Clothing/Uniforms/guard.rsi

- type: entity
  parent: ClothingUniformJumpsuitWarden
  id: DystopiaClothingUniformGuardSergeant
  name: форма сержанта Стражи
  description: Синяя форма с сержантскими знаками различия.
  components:
  - type: Sprite
    sprite: _Dystopia/Clothing/Uniforms/guard_sergeant.rsi
  - type: Clothing
    sprite: _Dystopia/Clothing/Uniforms/guard_sergeant.rsi

- type: entity
  parent: ClothingUniformJumpsuitHoS
  id: DystopiaClothingUniformGuardCaptain
  name: форма капитана Стражи
  description: Синяя форма с золотыми знаками различия капитана Городской Стражи.
  components:
  - type: Sprite
    sprite: _Dystopia/Clothing/Uniforms/guard_captain.rsi
  - type: Clothing
    sprite: _Dystopia/Clothing/Uniforms/guard_captain.rsi

- type: entity
  parent: ClothingHeadHatBeretSecurity
  id: DystopiaClothingHeadGuardBeret
  name: берет Стражи
  description: Синий берет Городской Стражи.
  components:
  - type: Sprite
    sprite: _Dystopia/Clothing/Head/guard_beret.rsi
  - type: Clothing
    sprite: _Dystopia/Clothing/Head/guard_beret.rsi

# --- Броня Санитарной и Научной служб (пока с ванильным видом) ---
- type: entity
  parent: ClothingOuterSuitFire
  id: DystopiaClothingOuterDisinfectorSuit
  name: костюм дезинфектора
  description: Тяжёлый защитный костюм. Держит огонь собственного огнемёта и едкие выделения плоти.
  components:
  - type: Armor
    modifiers:
      coefficients:
        Slash: 0.9
        Heat: 0.5
        Cold: 0.8
        Caustic: 0.5
  - type: FireProtection
    reduction: 0.8
  - type: ClothingSpeedModifier
    walkModifier: 0.85
    sprintModifier: 0.85

- type: entity
  parent: ClothingOuterBioScientist
  id: DystopiaClothingOuterPathobiologistSuit
  name: костюм патобиолога
  description: Герметичный лабораторный костюм для работы с образцами заражённой плоти.
  components:
  - type: Armor
    modifiers:
      coefficients:
        Caustic: 0.6
        Poison: 0.6
        Cellular: 0.7

# --- Маска Стражи: противогаз + свойства очков СБ (защита от вспышек, HUD Стражи) ---
- type: entity
  parent: [ClothingMaskGasSecurity, ShowSecurityIcons]
  id: DystopiaClothingMaskGuard
  name: маска Стражи
  description: Глухая резиновая маска с круглыми окулярами и фильтром. В окулярах холодно тлеет голубой свет — лица за ней никто не видел.
  components:
  - type: Sprite
    sprite: _Dystopia/Clothing/Mask/guard_mask.rsi
    layers:
    - state: icon
    - state: icon-glow
      shader: unshaded
  - type: Clothing
    sprite: _Dystopia/Clothing/Mask/guard_mask.rsi
    clothingVisuals:
      mask:
      - state: equipped-MASK
      - state: equipped-MASK-glow
        shader: unshaded
  - type: FlashImmunity
  - type: EyeProtection
    protectionTime: 5

# --- Пояс и РПС Стражи ---
  # Визор: синяя монохромная картинка (яркость сохраняется), резкость, полоски
  - type: DystopiaVisor
    tint: "#2F86FF"
    centerStrength: 0
    edgeStrength: 0
    haze: 0
    darken: 0
    monochrome: 0.9
    sharpen: 0.6
    brightness: 0.1
    centerRelief: 0.08
    scanlines: 1
    linePeriod: 6
    lineStrength: 0.3

- type: entity
  parent: ClothingBeltSecurity
  id: DystopiaClothingBeltGuard
  name: пояс Стражи
  description: Синий поясной ремень Городской Стражи.
  components:
  - type: Sprite
    sprite: _Dystopia/Clothing/Belt/guard_belt.rsi
  - type: Clothing
    sprite: _Dystopia/Clothing/Belt/guard_belt.rsi

- type: entity
  parent: ClothingBeltSecurityWebbing
  id: DystopiaClothingBeltGuardWebbing
  name: РПС Стражи
  description: Разгрузочная система Городской Стражи.
  components:
  - type: Sprite
    sprite: _Dystopia/Clothing/Belt/guard_webbing.rsi
  - type: Clothing
    sprite: _Dystopia/Clothing/Belt/guard_webbing.rsi

- type: entity
  parent: DystopiaClothingBeltGuard
  id: DystopiaClothingBeltGuardFilled
  suffix: Заполненный
  components:
  - type: StorageFill
    contents:
    - id: MagazinePistol
    - id: DystopiaGuardBaton
    - id: Handcuffs
      amount: 2
    - id: Tourniquet

- type: entity
  parent: DystopiaClothingBeltGuardWebbing
  id: DystopiaClothingBeltGuardWebbingFilled
  suffix: Заполненная
  components:
  - type: StorageFill
    contents:
    - id: MagazinePistol
    - id: DystopiaGuardBaton
    - id: Handcuffs
      amount: 2
    - id: Tourniquet

# --- Противогазы служб ---
- type: entity
  parent: ClothingMaskGasMerc
  id: DystopiaClothingMaskGasSanitary
  name: санитарный противогаз
  description: Серый противогаз установленного Городом образца. Выдаётся служащим вместе с формой.
  components:
  - type: Sprite
    sprite: _Dystopia/Clothing/Mask/gas_sanitary.rsi
  - type: Clothing
    sprite: _Dystopia/Clothing/Mask/gas_sanitary.rsi
  # Взгляд через зелёные стёкла
  - type: DystopiaVisor
    tint: "#52956A"
    centerStrength: 0.12
    edgeStrength: 0.7
    haze: 0.12
    darken: 0.15

- type: entity
  parent: ClothingMaskGasMerc
  id: DystopiaClothingMaskGasField
  name: полевой противогаз
  description: Грубый, но надёжный противогаз для работы в очагах заразы и за стенами Города.
  components:
  # Взгляд через жёлтые стёкла — грубое стекло, мутнее
  - type: DystopiaVisor
    tint: "#C2CB48"
    centerStrength: 0.15
    edgeStrength: 0.75
    haze: 0.18
    darken: 0.2

- type: entity
  parent: ClothingMaskGasExplorer
  id: DystopiaClothingMaskGasScience
  name: противогаз Научной службы
  description: Лабораторный противогаз с широким обзором. Не спасёт от того, что вы изучаете, но даст время это записать.
  components:
  - type: Sprite
    sprite: _Dystopia/Clothing/Mask/gas_science.rsi
  - type: Clothing
    sprite: _Dystopia/Clothing/Mask/gas_science.rsi
  # Взгляд через фиолетовые стёкла — широкий обзор, почти без мути
  - type: DystopiaVisor
    tint: "#846D98"
    centerStrength: 0.1
    edgeStrength: 0.6
    haze: 0.06
    darken: 0.1

