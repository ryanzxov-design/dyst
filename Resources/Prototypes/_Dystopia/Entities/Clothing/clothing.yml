# Одежда Города. Спрайты — перекраски ванильных (CC-BY-SA-3.0), лежат в Textures/_Dystopia.

# --- Консул: весь в белом ---
- type: entity
  parent: ClothingUniformJumpsuitCaptain
  id: DystopiaClothingUniformConsul
  name: белый мундир Консула
  description: Безупречно белый мундир правителя Города. Ни пятнышка — грязь здесь убирают другие.
  components:
  - type: Sprite
    sprite: _Dystopia/Clothing/Uniforms/consul.rsi
  - type: Clothing
    sprite: _Dystopia/Clothing/Uniforms/consul.rsi

- type: entity
  parent: ClothingNeckCloakCap
  id: DystopiaClothingNeckConsulCloak
  name: белый плащ Консула
  description: Белый плащ с золотой каймой. Его видно издалека — и это главное.
  components:
  - type: Sprite
    sprite: _Dystopia/Clothing/Neck/consul_cloak.rsi
  - type: Clothing
    sprite: _Dystopia/Clothing/Neck/consul_cloak.rsi

- type: entity
  parent: ClothingOuterCoatCaptain
  id: DystopiaClothingOuterConsulJacket
  name: торжественный китель Консула
  description: Белоснежный китель с золотым шитьём. Надевается, когда Город должен видеть своего правителя.
  components:
  - type: Sprite
    sprite: _Dystopia/Clothing/OuterClothing/consul_jacket.rsi
  - type: Clothing
    sprite: _Dystopia/Clothing/OuterClothing/consul_jacket.rsi

