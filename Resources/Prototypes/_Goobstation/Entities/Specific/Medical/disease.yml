# Перенос из Goob-Station: живой инжектор — вводит болезнь из мазка (режим вакцинатора).

- type: entity
  parent: BaseItem
  id: LiveInjector
  name: live injector
  description: Injects people with a disease.
  components:
  - type: Item
    size: Tiny
  - type: Sprite
    sprite: Objects/Specific/Medical/medipen.rsi
    layers:
    - state: livepen
      map: [ "salpen" ] # Dystopia: без карты слоя визуализатор не находил слой
  - type: Appearance
  - type: DiseasePen
    vaccine: false
  - type: GenericVisualizer
    visuals:
      enum.DiseasePenVisuals.Used:
        salpen:
          True: { state: livepen_empty }
          False: { state: livepen }
